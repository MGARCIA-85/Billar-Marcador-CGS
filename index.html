                      ✏️
                    </button>
                    {isOperario && <button onClick={()=>savePlayersList(playersList.filter((_,j)=>j!==i))}
                      style={{background:"rgba(255,80,80,0.1)",border:"1px solid rgba(255,80,80,0.22)",color:"#f87171",borderRadius:8,padding:"7px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
                      🗑
                    </button>}
                  </div>
                </div>
              );
            })
          }
        </div>
        {devDialog && (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 24px"}}>
            <div style={{background:"#1a2e1a",borderRadius:16,padding:"24px",border:"1px solid rgba(74,222,128,0.2)",maxWidth:320,width:"100%"}}>
              <div style={{fontSize:16,fontWeight:800,color:"#f9e04b",marginBottom:8,textAlign:"center"}}>📱 Registrar dispositivo</div>
              <div style={{fontSize:13,color:"#ccc",textAlign:"center",marginBottom:20,lineHeight:1.6}}>
                <b style={{color:"#63b3ed"}}>{devDialog.jugName}</b> ya tiene {devDialog.existingDevs.length} dispositivo(s) registrado(s).
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                <button onClick={()=>{localStorage.setItem("bg_device",devDialog.newDev);setDeviceName(devDialog.newDev);saveDispositivosMap({...dispositivosMap,[devDialog.jugKey]:[devDialog.newDev]});setDevDialog(null);}}
                  style={{padding:"13px",borderRadius:10,background:"rgba(239,68,68,0.12)",border:"1px solid rgba(239,68,68,0.3)",color:"#f87171",fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",textAlign:"left"}}>
                  🔄 Cambiar dispositivo
                  <div style={{fontSize:11,color:"#888",fontWeight:400,marginTop:2}}>Borra el dispositivo anterior</div>
                </button>
                <button onClick={()=>{localStorage.setItem("bg_device",devDialog.newDev);setDeviceName(devDialog.newDev);saveDispositivosMap({...dispositivosMap,[devDialog.jugKey]:[...devDialog.existingDevs,devDialog.newDev]});setDevDialog(null);}}
                  style={{padding:"13px",borderRadius:10,background:"rgba(74,222,128,0.08)",border:"1px solid rgba(74,222,128,0.25)",color:"#63b3ed",fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",textAlign:"left"}}>
                  ➕ Agregar dispositivo
                  <div style={{fontSize:11,color:"#888",fontWeight:400,marginTop:2}}>Mantiene el anterior también</div>
                </button>
                <button onClick={()=>setDevDialog(null)}
                  style={{padding:"13px",borderRadius:10,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"#666",fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                  ✕ No hacer nada
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ===== NUEVA PARTIDA =====
  if (screen === "newMatch") {
    const isCR = wModalidad === "Contrarreloj";
    const validPlayers = wPlayers.filter(p => p.trim());
    const ready = isCR
      ? validPlayers.length >= 2 && wOrder.length === validPlayers.length
      : wP1.trim() && wP2.trim() && wServe;
    return (
      <div className="app-screen" style={{background:"radial-gradient(ellipse at 50% 35%,#0f2a5a 0%,#081530 55%,#05102a 100%)"}}>
        <div className="app-scroll"
          onTouchStart={e=>{ptrRef.current.startY=e.touches[0].clientY;ptrRef.current.active=false;}}
          onTouchMove={e=>{if(e.currentTarget.scrollTop===0&&e.touches[0].clientY-ptrRef.current.startY>70){ptrRef.current.active=true;setPtrActive(true);}else if(e.currentTarget.scrollTop>0){ptrRef.current.active=false;setPtrActive(false);}}}
          onTouchEnd={e=>{if(ptrRef.current.active){ptrRef.current.active=false;setPtrActive(false);window.location.reload();}else{setPtrActive(false);}}}
          style={{padding:"24px 22px"}}>
          <div className={"ptr-indicator"+(ptrActive?" ptr-visible":"")}>↓ Suelta para actualizar</div>
          <button onClick={()=>setScreenP("lobby")} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.11)",color:"#bbb",borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit",marginBottom:16}}>← Volver</button>
          <div style={{fontSize:20,fontWeight:800,color:"#63b3ed",marginBottom:18}}>Nueva Partida</div>

          <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Modalidad</div>
          <div style={{display:"flex",gap:8,marginTop:8,marginBottom:18}}>
            {MODALIDADES.map(mod => {
              const sel = wModalidad === mod;
              return <button key={mod} onClick={()=>setWModalidad(mod)} style={{flex:1,padding:"10px 4px",borderRadius:14,fontFamily:"inherit",fontSize:10,fontWeight:700,cursor:"pointer",background:sel?"linear-gradient(160deg,#1a3a1a,#2d6a2d)":"rgba(255,255,255,0.05)",border:sel?"1px solid rgba(74,222,128,0.5)":"1px solid rgba(255,255,255,0.09)",color:sel?"#fff":"#888",display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
                <BallIcon modalidad={mod} size={30} />{mod}
              </button>;
            })}
          </div>

          {!isCR ? (<>
            {["Jugador 1","Jugador 2"].map((label,pi) => {
              const val = pi===0?wP1:wP2;
              const setVal = pi===0?setWP1:setWP2;
              const other = pi===0?wP2:wP1;
              const opts = playersList.map(p=>plName(p)).filter(pn=>pn!==other);
              return (<React.Fragment key={pi}>
                <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:pi===1?14:0}}>{label}</div>
                <select value={val} onChange={e=>setVal(e.target.value)}
                  style={{width:"100%",padding:"12px 14px",borderRadius:10,background:"#0d2b0d",border:`1px solid ${val?"rgba(74,222,128,0.5)":"rgba(255,255,255,0.12)"}`,color:val?"#fff":"#888",fontFamily:"inherit",fontSize:15,outline:"none",boxSizing:"border-box",marginBottom:6,cursor:"pointer"}}>
                  <option value="" style={{color:"#888",background:"#081530"}}>Selecciona un jugador...</option>
                  {opts.map((pn,oi)=>(<option key={oi} value={pn} style={{color:"#fff",background:"#081530"}}>{pn}</option>))}
                </select>
              </React.Fragment>);
            })}
          </>) : (<>
            <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Jugadores</div>
            {wPlayers.map((p,i) => {
              const otherPlayers = wPlayers.filter((_,j)=>j!==i);
              const opts = playersList.map(pl=>plName(pl)).filter(pn=>!otherPlayers.includes(pn));
              return (
              <div key={i} style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
                <select value={p} onChange={e=>{const n=[...wPlayers];n[i]=e.target.value;setWPlayers(n);setWOrder([]);}}
                  style={{flex:1,padding:"11px 14px",borderRadius:10,background:"#0d2b0d",border:`1px solid ${p?"rgba(74,222,128,0.5)":"rgba(255,255,255,0.12)"}`,color:p?"#fff":"#888",fontFamily:"inherit",fontSize:14,outline:"none",cursor:"pointer"}}>
                  <option value="" style={{color:"#888",background:"#081530"}}>Selecciona un jugador...</option>
                  {opts.map((pn,oi)=>(<option key={oi} value={pn} style={{color:"#fff",background:"#081530"}}>{pn}</option>))}
                </select>
                {wPlayers.length > 2 && <button onClick={()=>{const n=wPlayers.filter((_,j)=>j!==i);setWPlayers(n);setWOrder([]);}} style={{background:"rgba(255,80,80,0.15)",border:"1px solid rgba(255,80,80,0.3)",color:"#f87171",borderRadius:8,padding:"8px 12px",cursor:"pointer",fontSize:14,fontFamily:"inherit"}}>✕</button>}
              </div>
              );
            })}
            <button onClick={()=>{setWPlayers([...wPlayers,""]);setWOrder([]);}} style={{width:"100%",padding:"9px 0",borderRadius:10,background:"rgba(74,222,128,0.08)",border:"1px solid rgba(74,222,128,0.2)",color:"#63b3ed",fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:4}}>+ Agregar jugador</button>
          </>)}

          {!isCR && (<>
            <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:18}}>Carrera</div>
            <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
              {CARRERAS.map(c => <button key={c} onClick={()=>setWCarrera(c)} style={chip(wCarrera===c)}>{c}</button>)}
            </div>
          </>)}
          {isCR && (<>
            <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:18}}>Carrera</div>
            <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
              {[3,5,7,9,11,15].map(r => <button key={r} onClick={()=>setWRondasCR(r)} style={chip(wRondasCR===r)}>{r}</button>)}
            </div>
            <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:18}}>Penalización por falta (segundos)</div>
            <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
              {[5,10,15,20,30,60].map(s => <button key={s} onClick={()=>setWPenaltyTime(s)} style={chip(wPenaltyTime===s)}>{s}s</button>)}
            </div>
          </>)}

          {!isCR ? (<>
            <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:18}}>Primer saque</div>
            <div style={{display:"flex",gap:12,marginTop:8}}>
              {["p1","p2"].map(k => {
                const name = k==="p1"?(wP1||"Jugador 1"):(wP2||"Jugador 2");
                const sel = wServe===k;
                return <button key={k} onClick={()=>setWServe(k)} style={{flex:1,padding:"13px 8px",borderRadius:12,fontFamily:"inherit",fontSize:14,fontWeight:700,cursor:"pointer",background:sel?"linear-gradient(135deg,#1e3a8a,#4ade80)":"rgba(255,255,255,0.06)",border:sel?"none":"1px solid rgba(255,255,255,0.11)",color:sel?"#fff":"#999"}}>{name}</button>;
              })}
            </div>
          </>) : (<>
            <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:8,marginTop:18}}>Orden de turnos</div>
            <div style={{color:"#555",fontSize:11,marginBottom:8}}>Toca los jugadores en el orden que van a jugar</div>
            {(()=>{
              const valid = wPlayers.map((p,i)=>({p,i})).filter(({p})=>p.trim());
              return (<>
                <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:10}}>
                  {valid.map(({p,i}) => {
                    const pos = wOrder.indexOf(i);
                    const sel = pos >= 0;
                    return <button key={i} onClick={()=>{
                      if(sel){setWOrder(wOrder.filter(x=>x!==i));}
                      else{setWOrder([...wOrder,i]);}
                    }} style={{padding:"10px 16px",borderRadius:10,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",background:sel?"linear-gradient(135deg,#1e3a8a,#4ade80)":"rgba(255,255,255,0.06)",border:sel?"none":"1px solid rgba(255,255,255,0.11)",color:sel?"#fff":"#999",position:"relative"}}>
                      {sel && <span style={{position:"absolute",top:-6,right:-6,background:"#f9e04b",color:"#000",borderRadius:"50%",width:18,height:18,fontSize:11,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>{pos+1}</span>}
                      {p}
                    </button>;
                  })}
                </div>
                {wOrder.length > 0 && <div style={{fontSize:11,color:"#63b3ed",marginBottom:4}}>Orden: {wOrder.map(i=>wPlayers[i]).join(" → ")}</div>}
              </>);
            })()}
          </>)}

          <div style={{display:"flex",gap:12,marginTop:20}}>
            <button style={{flex:1,padding:"14px 0",borderRadius:10,background:"linear-gradient(135deg,#1e3a8a,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontSize:15,fontWeight:700,cursor:"pointer",opacity:ready?1:0.4}} onClick={startNewMatch} disabled={!ready}>Iniciar</button>
            <button style={{padding:"14px 16px",borderRadius:10,background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.11)",color:"#aaa",fontFamily:"inherit",fontSize:14,cursor:"pointer"}} onClick={()=>{
              const pj = sessionStorage.getItem("pendingJornadaId");
              if(pj){setJornadaScreenP(pj);}else{setScreenP("lobby");}
            }}>Cancelar</button>
          </div>
        </div>
      </div>
    );
  }

  // ===== PARTIDA =====
  if (screen === "match") {
    if (!activeMatch) {
      if (!fbLoaded) return <div style={{minHeight:"100vh",background:"#081530",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{color:"#63b3ed",fontSize:14,fontFamily:"Georgia,serif",letterSpacing:1}}>Cargando...</div></div>;
      setScreenP("lobby"); return null;
    }
  } else if (!activeMatch) { return null; }
  const isReadOnly = activeMatch.matchClosed;
  const {p1Name, p2Name, currentServe, wins, carrera, modalidad, games, seriesFinished, seriesWinner, seriesWins, seriesCount, seriesHistory} = activeMatch;

  const CELL_W=44, CELL_H=130, NAM_W=290, HDR_H=18;
  const BORDER="2px solid rgba(255,255,255,0.22)";
  const BORDER_THIN="1px solid rgba(255,255,255,0.11)";
  const totalJuegos = carrera*2-1;
  const sw1 = seriesWins.p1+(seriesFinished&&seriesWinner==="p1"?1:0);
  const sw2 = seriesWins.p2+(seriesFinished&&seriesWinner==="p2"?1:0);

  const handleCellClick = (k, ji, ballType) => {
    const gameRecord = games[ji];
    const hasWon = gameRecord && gameRecord.winner === k;
    const isLastGame = ji === games.length-1;
    const isNext = !seriesFinished && ji === games.length;
    const bt = ballType || "normal";
    if (isNext) {
      const newWins = {...wins, [k]: wins[k]+1};
      const nextServe = currentServe==="p1"?"p2":"p1";
      const willFinish = newWins[k] >= carrera;
      updateMatch(activeId, m => ({...m, wins:newWins, games:[...m.games,{winner:k,serve:currentServe,ballType:bt,device:deviceName||undefined}], currentServe:nextServe, seriesFinished:willFinish, seriesWinner:willFinish?k:null}));
      // Marcar turno anotado si la partida pertenece a una jornada activa
      if (jornadaScreen && jornadaScreen!=="list") {
        saveJornadas(jornadas.map(j => j.id===jornadaScreen && j.turnStarted ? {...j, turnScored:true} : j));
        // Marcar en la partida que ya se anotó en este turno
        updateMatch(activeId, mm => ({...mm, jornadaTurnScored:true}));
      }
    } else if (hasWon && isLastGame) {
      updateMatch(activeId, m => {
        if (m.games.length===0) return m;
        const last = m.games[m.games.length-1];
        return {...m, games:m.games.slice(0,-1), wins:{...m.wins,[last.winner]:m.wins[last.winner]-1}, currentServe:last.serve, seriesFinished:false, seriesWinner:null, jornadaTurnScored:false};
      });
      // Resetear turnScored en jornada activa
      if (jornadaScreen && jornadaScreen!=="list") {
        saveJornadas(jornadas.map(j => j.id===jornadaScreen ? {...j, turnScored:false} : j));
      }
    }
    setBallMenu(null);
  };

  const handleCellLongPress = (k, ji) => {
    const isNext = !seriesFinished && ji === games.length;
    if (isNext && !isReadOnly) setBallMenu({k, ji});
  };

  return (
    <div className="app-screen" style={{background:"radial-gradient(ellipse at 50% 35%,#0f2a5a 0%,#081530 55%,#05102a 100%)"}}>

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px 8px",borderBottom:"1px solid rgba(255,255,255,0.07)",background:"rgba(0,0,0,0.4)"}}>
        <button onClick={()=>setScreenP("lobby")} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.11)",color:"#bbb",borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Inicio</button>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <BallIcon modalidad={modalidad} size={26} />
          <div style={{fontSize:9,color:"#777",letterSpacing:1,textTransform:"uppercase"}}>{modalidad} - C{carrera} - S#{seriesCount}</div>
        </div>
        <button onClick={()=>setShowHistoryP(true)} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.11)",color:"#bbb",borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Hist.</button>
      </div>

      {/* Series bar */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 16px",background:"rgba(0,0,0,0.45)",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
          <span style={{fontSize:11,color:"#888",fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,maxWidth:85,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p1Name}</span>
          <span style={{fontSize:30,fontWeight:900,lineHeight:1,color:sw1>sw2?"#f9e04b":"#fff"}}>{sw1}</span>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
          <div style={{fontSize:8,letterSpacing:2,color:"#63b3ed",textTransform:"uppercase"}}>SERIES</div>
          <div style={{fontSize:18,color:"#333",fontWeight:700}}>-</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1,flexDirection:"row-reverse"}}>
          <span style={{fontSize:11,color:"#888",fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,maxWidth:85,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p2Name}</span>
          <span style={{fontSize:30,fontWeight:900,lineHeight:1,color:sw2>sw1?"#f9e04b":"#fff"}}>{sw2}</span>
        </div>
      </div>

      {/* Banner */}
      {seriesFinished
        ? <div style={{textAlign:"center",padding:"7px 0",background:"rgba(249,224,75,0.08)",borderBottom:"1px solid rgba(249,224,75,0.18)",color:"#ddd",fontSize:13,fontWeight:600}}>Serie #{seriesCount} - Ganó: <strong style={{color:"#f9e04b"}}>{seriesWinner==="p1"?p1Name:p2Name}</strong></div>
        : <div style={{textAlign:"center",padding:"6px 0",background:"rgba(249,224,75,0.04)",borderBottom:"1px solid rgba(249,224,75,0.08)",color:"#bbb",fontSize:13}}>Saque: <strong style={{color:"#f9e04b"}}>{currentServe==="p1"?p1Name:p2Name}</strong></div>
      }

      {/* Cuadrícula */}
      <div style={{flex:1,display:"flex",flexDirection:"column",padding:"6px 0",overflow:"hidden"}}>
        <div style={{display:"flex",overflow:"hidden"}}>
          <div style={{flexShrink:0,borderRight:BORDER}}>
            <div style={{height:HDR_H}} />
            {["p1","p2"].map((k,ri) => {
              const sw=k==="p1"?sw1:sw2, name=k==="p1"?p1Name:p2Name;
              const tFS=sw<=5?24:sw<=10?21:sw<=15?18:15;
              return <div key={k} style={{width:NAM_W,height:CELL_H,borderBottom:ri===0?BORDER:"none",background:"rgba(0,0,0,0.25)",display:"flex",flexDirection:"column",alignItems:"flex-start",justifyContent:"flex-start",padding:"8px 8px 6px",overflow:"hidden",boxSizing:"border-box"}}>
                <div style={{fontSize:26,fontWeight:800,color:"#e0e0e0",lineHeight:1.15,width:"100%",wordBreak:"break-word",flexShrink:0,marginBottom:6}}>{name}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:1,width:"100%",overflow:"hidden"}}>
                  {Array.from({length:sw},(_,i)=><span key={i} style={{fontSize:tFS,lineHeight:1.1}}>&#127942;</span>)}
                </div>
              </div>;
            })}
          </div>
          <div style={{flex:1,overflowX:"auto"}}>
            <div style={{minWidth:"max-content"}}>
              <div style={{display:"flex",height:HDR_H}}>
                {Array.from({length:totalJuegos},(_,ji)=><div key={ji} style={{width:CELL_W,textAlign:"center",fontSize:10,color:"#666",fontWeight:700,lineHeight:HDR_H+"px"}}>{ji+1}</div>)}
              </div>
              {["p1","p2"].map((k,ri)=>(
                <div key={k} style={{display:"flex",borderBottom:ri===0?BORDER:"none"}}>
                  {Array.from({length:totalJuegos},(_,ji)=>{
                    const gr=games[ji], hasWon=gr&&gr.winner===k;
                    const isLastGame=ji===games.length-1;
                    const isNext=!seriesFinished&&ji===games.length;
                    const isSaque=isNext&&currentServe===k;
                    // En jornada: bloqueado si no es el turno activo; o si ya se anotó victoria en este turno (turnScored) solo permitir modificar el juego actual
                    // Bloquear nuevas victorias (jornadaBlocked), permitir deshacer si es turno activo
                    // En jornada activa: bloquear agregar si ya se anotó; quitar solo con botón Deshacer
                    // En partida bloqueada (inactiva): bloquear todo
                    // En lobby: libre
                    const scored = jornadaTurnScored === true; // prop local, no Firebase
                    const blockAdd = jornadaBlocked ? true : (jornadaTurnActive ? scored : false);
                    // Permitir quitar victoria SOLO si scored=true Y es el último juego (mismo criterio que botón Deshacer)
                    const scoredThisTurn = scored || (activeMatch.jornadaTurnScored === true);
                    const canUndoByClick = jornadaTurnActive ? (scoredThisTurn && isLastGame) : true;
                    const blockUndo = jornadaBlocked ? true : (jornadaTurnActive ? !canUndoByClick : false);
                    const jornadaBlockCell = isNext ? blockAdd : (hasWon ? blockUndo : false);
                    const clickable=!isReadOnly&&!jornadaBlockCell&&(isNext||(hasWon&&isLastGame));
                    let pressTimer = null; let longPressed = false;
                    const onPressStart = () => { longPressed=false; if(isNext&&!isReadOnly&&!jornadaBlockCell) pressTimer = setTimeout(()=>{ longPressed=true; handleCellLongPress(k,ji); }, 600); };
                    const onPressEnd = () => { clearTimeout(pressTimer); };
                    return <div key={ji}
                       onClick={()=>{ if(!longPressed) { clickable&&handleCellClick(k,ji); } longPressed=false; }}
                      onMouseDown={onPressStart} onMouseUp={onPressEnd} onMouseLeave={onPressEnd}
                       onTouchStart={onPressStart} onTouchEnd={()=>{ onPressEnd(); }}
                      style={{width:CELL_W,height:CELL_H,borderRight:BORDER_THIN,display:"flex",alignItems:"center",justifyContent:"center",background:isNext?"rgba(255,255,255,0.04)":"rgba(255,255,255,0.02)",position:"relative",cursor:clickable?"pointer":"default",boxShadow:(seriesFinished&&hasWon&&isLastGame)?"inset 0 0 0 2px rgba(249,115,22,0.5)":"none"}}>
                       {hasWon && (gr.ballType==="gold" ? <SpecialBall type="gold" size={28}/> : gr.ballType==="diamond" ? <img src={IMG_RUN_OUT} style={{width:28,height:28,objectFit:"contain"}}/> : gr.ballType==="breakrun" ? <img src={IMG_BREAK_AND_RUN} style={{width:28,height:28,objectFit:"contain"}}/> : <BallIcon modalidad={modalidad} size={28}/>)}
                      {isSaque && <div style={{position:"absolute",top:4,left:0,right:0,display:"flex",justifyContent:"center"}}><CueBallSaque size={16} /></div>}
                    </div>;
                  })}
                </div>
              ))}
            </div>
          </div>
        </div>
        <div style={{height:1,background:"rgba(255,255,255,0.06)",margin:"8px 0"}} />
        <div style={{fontSize:10,color:seriesFinished?"#f97316":"#555",textAlign:"center",paddingBottom:2}}>
          {seriesFinished?"Toca la última bola para deshacer - o presiona Siguiente serie":"Toca una casilla para asignar o quitar victoria"}
        </div>
      </div>

      {/* Menú de selección de bola */}
      {ballMenu && (
        <div style={{position:"fixed",inset:0,zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.7)"}} onClick={()=>setBallMenu(null)}>
          <div style={{background:"#0d1a3a",border:"1px solid rgba(99,179,237,0.3)",borderRadius:20,padding:"20px 24px",textAlign:"center"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:13,color:"#888",marginBottom:16}}>Elige el tipo de bola</div>
            <div style={{display:"flex",gap:16,justifyContent:"center"}}>
              <div onClick={()=>handleCellClick(ballMenu.k,ballMenu.ji,"normal")} style={{cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
                <BallIcon modalidad={modalidad} size={44}/>
                <div style={{fontSize:11,color:"#aaa"}}>Normal</div>
              </div>
              <div onClick={()=>handleCellClick(ballMenu.k,ballMenu.ji,"gold")} style={{cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
                <img src="golden_break.png" style={{width:44,height:44,objectFit:"contain"}}/>
                <div style={{fontSize:11,color:"#f5c400"}}>Golden Break</div>
              </div>
              <div onClick={()=>handleCellClick(ballMenu.k,ballMenu.ji,"diamond")} style={{cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
                <img src="run_out.png" style={{width:44,height:44,objectFit:"contain"}}/>
                <div style={{fontSize:11,color:"#a8d8ff"}}>Run Out</div>
              </div>
              <div onClick={()=>handleCellClick(ballMenu.k,ballMenu.ji,"breakrun")} style={{cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
                <img src="break_run.png" style={{width:44,height:44,objectFit:"contain"}}/>
                <div style={{fontSize:11,color:"#ffa500"}}>Break & Run</div>
              </div>
            </div>
            <button onClick={()=>setBallMenu(null)} style={{marginTop:16,padding:"8px 24px",borderRadius:10,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",color:"#aaa",fontFamily:"inherit",fontSize:13,cursor:"pointer"}}>Cancelar</button>
          </div>
        </div>
      )}

      {/* Footer */}
      <div style={{display:"flex",gap:8,padding:"10px 14px",borderTop:"1px solid rgba(255,255,255,0.05)",background:"rgba(0,0,0,0.32)",alignItems:"center"}}>
        {!isReadOnly && seriesFinished
          ? <button style={{flex:2,fontSize:13,padding:"12px 0",borderRadius:14,background:"linear-gradient(135deg,#1e3a8a,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontWeight:800,cursor:"pointer"}} onClick={startNewSeries}>Siguiente serie</button>
          : <div style={{flex:2}} />
        }
        {!isReadOnly && <button style={{padding:"11px 14px",borderRadius:12,background:"rgba(255,80,80,0.12)",border:"1px solid rgba(255,80,80,0.28)",color:"#f87171",fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}} onClick={()=>setShowCloseMatch(true)}>Terminar</button>}
      </div>

      {/* Modal terminar */}
      {showCloseMatch && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{background:"#0f2010",border:"1px solid rgba(74,222,128,0.16)",borderRadius:20,padding:"22px 20px",textAlign:"center",color:"#fff",width:300}}>
            <div style={{fontSize:16,fontWeight:700,marginBottom:10,color:"#e0e0e0"}}>¿Terminar esta partida?</div>
            <div style={{fontSize:13,color:"#aaa",marginBottom:14}}>{p1Name} vs {p2Name} - {modalidad}</div>
            <div style={{display:"flex",gap:10,justifyContent:"center"}}>
              <button style={{padding:"11px 20px",borderRadius:10,background:"rgba(255,80,80,0.12)",border:"1px solid rgba(255,80,80,0.28)",color:"#f87171",fontFamily:"inherit",fontSize:14,fontWeight:700,cursor:"pointer"}} onClick={closeMatch}>Confirmar</button>
              <button style={{padding:"10px 20px",borderRadius:10,background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.11)",color:"#aaa",fontFamily:"inherit",fontSize:14,cursor:"pointer"}} onClick={()=>setShowCloseMatch(false)}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {/* Modal historial editable */}
      {showHistory && activeMatch && activeMatch.modalidad === "Contrarreloj" && (()=>{
        const hm = activeMatch;
        const players = hm.crPlayers||[];
        const order = hm.crOrder||[];
        const roundHistory = hm.crRoundHistory||[];
        const accumTime = hm.crAccumTime||{};
        const validRoundsH = hm.crValidRounds||{};
        const serieWinsH = hm.crSerieWins||{};
        const serieHistoryH = hm.crSerieHistory||[];
        const totalSeriesH = hm.crTotalSeries||1;
        // Sumar rondas de TODAS las series (solo serieHistory, sin duplicar crRoundWins)
        const allRWH = {};
        serieHistoryH.forEach(s => {
          Object.entries(s.roundWins||{}).forEach(([k,v])=>{ allRWH[Number(k)]=(allRWH[Number(k)]||0)+v; });
        });
        // Solo agregar crRoundWins si la partida está en curso (última serie no guardada aún)
        if (serieHistoryH.length < (hm.crTotalSeries||1)) {
          Object.entries(hm.crRoundWins||{}).forEach(([k,v])=>{ allRWH[Number(k)]=(allRWH[Number(k)]||0)+v; });
        }
        const roundWins = allRWH;
        // Promedio: solo rondas válidas (sin forfeit)
        const avgTime = (pidx) => validRoundsH[pidx]>0 ? (accumTime[pidx]||0)/validRoundsH[pidx] : Infinity;
        const standings = [...order].sort((a,b)=>{
          const sw=(serieWinsH[b]||0)-(serieWinsH[a]||0); if(sw!==0) return sw;
          const rw=(roundWins[b]||0)-(roundWins[a]||0); if(rw!==0) return rw;
          return avgTime(a)-avgTime(b);
        });
        return (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:100,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"20px 10px"}}>
            <div style={{background:"#0f2010",border:"1px solid rgba(74,222,128,0.18)",borderRadius:20,padding:"20px 16px",color:"#fff",width:"100%",maxWidth:420}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <div style={{fontSize:15,fontWeight:700}}>Historial · Contrarreloj</div>
                <button onClick={()=>setShowHistoryP(false)} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",color:"#aaa",borderRadius:8,padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✕</button>
              </div>
              {/* Clasificación general */}
              <div style={{fontSize:11,color:"#63b3ed",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Clasificación</div>
              {standings.map((pidx,pos)=>(
                <div key={pidx} style={{display:"flex",justifyContent:"space-between",padding:"7px 10px",borderRadius:9,background:pos===0?"rgba(249,224,75,0.08)":"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",marginBottom:5}}>
                  <span style={{fontWeight:700,color:pos===0?"#f9e04b":"#e0e0e0"}}>{pos===0?"🏆":pos===1?"🥈":"🥉"} {pos+1}. {players[pidx]}</span>
                  <div style={{textAlign:"right"}}><div style={{fontSize:12,color:"#f9e04b",fontWeight:700}}>{serieWinsH[pidx]||0}/{totalSeriesH} series</div><div style={{fontSize:11,color:"#888"}}>{roundWins[pidx]||0} rondas · {validRoundsH[pidx]>0?fmtTime(avgTime(pidx))+" prom":"—"}</div></div>
                </div>
              ))}
              {/* Tabla de rondas */}
              {roundHistory.length>0 && (<>
                <div style={{fontSize:11,color:"#63b3ed",letterSpacing:1,textTransform:"uppercase",margin:"14px 0 8px"}}>Resultados por ronda</div>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                    <thead>
                      <tr>
                        <td style={{padding:"5px 8px",color:"#555",fontWeight:700}}></td>
                        {roundHistory.map((r,ri)=>{
                          const sIdx = Math.floor(ri/(hm.crTotalRounds||1));
                          const rIdx = ri%(hm.crTotalRounds||1);
                          return <td key={r.round} style={{padding:"4px 4px",textAlign:"center",color:"#63b3ed",fontWeight:700,borderLeft:rIdx===0?"1px solid rgba(74,222,128,0.2)":"none",fontSize:10}}>S{sIdx+1}·R{rIdx+1}</td>;
                        })}
                        <td style={{padding:"4px 4px",textAlign:"center",color:"#f9e04b",fontWeight:700,borderLeft:"1px solid rgba(74,222,128,0.2)"}}>🏆S</td>
                        <td style={{padding:"4px 4px",textAlign:"center",color:"#888",fontWeight:700}}>Prom</td>
                      </tr>
                    </thead>
                    <tbody>
                      {order.map(pidx=>(
                        <tr key={pidx} style={{borderTop:"1px solid rgba(255,255,255,0.06)"}}>
                          <td style={{padding:"6px 8px",fontWeight:700,color:"#e0e0e0",whiteSpace:"nowrap"}}>{players[pidx]}</td>
                          {roundHistory.map(r=>{
                            const isW=r.winner===pidx;
                            const t=r.times[pidx];
                            const isF=(r.forfeits||[]).includes(pidx);
                            const riIdx = roundHistory.indexOf(r)%(hm.crTotalRounds||1);
                            return <td key={r.round} style={{padding:"4px 4px",textAlign:"center",
                              borderLeft:riIdx===0?"1px solid rgba(74,222,128,0.15)":"none",
                              background:isW?"rgba(249,224,75,0.1)":isF?"rgba(239,68,68,0.08)":"transparent",
                              color:isW?"#f9e04b":isF?"#f87171":"#888",
                              fontWeight:isW?700:400,fontVariantNumeric:"tabular-nums",fontSize:10}}>
                              {t!==undefined?fmtTime(t):"—"}{isW?" 🏆":""}{isF?" ⚠":""}
                            </td>;
                          })}
                          <td style={{padding:"5px 4px",textAlign:"center",color:"#f9e04b",fontWeight:700,borderLeft:"1px solid rgba(74,222,128,0.15)"}}>{serieWinsH[pidx]||0}</td>
                          <td style={{padding:"6px 8px",textAlign:"center",color:"#888",fontVariantNumeric:"tabular-nums"}}>{accumTime[pidx]?fmtTime(accumTime[pidx]):"—"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </>)}
              <button onClick={()=>setShowHistoryP(false)} style={{width:"100%",marginTop:16,padding:"12px 0",borderRadius:12,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#bbb",fontFamily:"inherit",fontSize:14,fontWeight:600,cursor:"pointer"}}>Cerrar</button>
            </div>
          </div>
        );
      })()}

      {showHistory && activeMatch && activeMatch.modalidad !== "Contrarreloj" && (
        <HistorialEditable
          p1Name={p1Name} p2Name={p2Name}
          modalidad={modalidad} carrera={carrera}
          seriesHistory={seriesHistory} seriesWins={seriesWins}
          games={games} seriesCount={seriesCount}
          seriesFinished={seriesFinished} seriesWinner={seriesWinner}
          matchClosed={isReadOnly} playersList={playersList}
          onClose={()=>setShowHistoryP(false)}
          onEditCurrentGame={(ji, k) => {
            updateMatch(activeId, m => {
              const ng = m.games.map((g,i) => i===ji ? {...g, winner:k} : g);
              const nw = {p1:0, p2:0};
              ng.forEach(g => nw[g.winner]++);
              const sf = nw.p1>=m.carrera||nw.p2>=m.carrera;
              const sw = nw.p1>=m.carrera?"p1":nw.p2>=m.carrera?"p2":null;
              return {...m, games:ng, wins:nw, seriesFinished:sf, seriesWinner:sw};
            });
          }}
          onDeleteLastSeries={() => {
            updateMatch(activeId, m => {
              if (m.seriesHistory.length===0) return m;
              const last = m.seriesHistory[m.seriesHistory.length-1];
              const nh = m.seriesHistory.slice(0,-1);
              const nsw = {p1:0,p2:0};
              nh.forEach(s => { if(s.winner&&!s.partial) nsw[s.winner]++; });
              return {...m, seriesHistory:nh, seriesWins:nsw, seriesCount:last.seriesNum,
                games:last.games||[], wins:{p1:last.p1wins,p2:last.p2wins},
                seriesFinished:true, seriesWinner:last.winner};
            });
          }}
          onEditHistoryGame={(si, ji, k, fallback) => {
            updateMatch(activeId, m => {
              const nh = m.seriesHistory.map((ser,idx) => {
                if(idx!==si) return ser;
                const bg = ser.games||fallback;
                const ng = bg.map((g,i) => i===ji ? {...g,winner:k} : g);
                const p1 = ng.filter(g=>g.winner==="p1").length;
                const p2 = ng.filter(g=>g.winner==="p2").length;
                const nw = p1>=m.carrera?"p1":p2>=m.carrera?"p2":ser.winner;
                return {...ser,games:ng,p1wins:p1,p2wins:p2,winner:nw};
              });
              const nsw = {p1:0,p2:0};
              nh.forEach(s => { if(s.winner&&!s.partial) nsw[s.winner]++; });
              return {...m, seriesHistory:nh, seriesWins:nsw};
            });
          }}
          onRestoreLastSeries={(lastSerie, lastGames) => {
            updateMatch(activeId, m => {
              const nh = m.seriesHistory.slice(0,-1);
              const nsw = {p1:0,p2:0};
              nh.forEach(s => { if(s.winner&&!s.partial) nsw[s.winner]++; });
              const rg = lastSerie.games||lastGames;
              const rw = {p1:rg.filter(g=>g.winner==="p1").length, p2:rg.filter(g=>g.winner==="p2").length};
              const lg = rg[rg.length-1];
              const ns = lg?(lg.serve==="p1"?"p2":"p1"):m.firstServe;
              return {...m, seriesHistory:nh, seriesWins:nsw, seriesCount:lastSerie.seriesNum,
                games:rg, wins:rw, currentServe:ns, seriesFinished:false, seriesWinner:null};
            });
            setShowHistoryP(false);
          }}
          onReactivar={isOperario?() => {
            updateMatch(activeId, m => {
      // Restaurar seriesWins previo al cierre (antes de que closeMatch sumara la última serie)
      const correctedSW = m.closedSeriesWins ? m.closedSeriesWins : m.seriesWins;
      // No tocar seriesFinished — si era true, "Sig. serie" quedará activo para continuar
      return {...m, matchClosed:false, closedAt:null, seriesWins:correctedSW, closedSeriesWins:null};
    });
            setShowHistoryP(false);
          }:null}
        />
      )}
    </div>
  );
}

function HistorialEditable({p1Name, p2Name, modalidad, carrera, seriesHistory, seriesWins,
  games, seriesCount, seriesFinished, seriesWinner, matchClosed,
  onClose, onEditCurrentGame, onDeleteLastSeries, onEditHistoryGame, onRestoreLastSeries, onRestoreAnySeries, onReactivar, playersList=[]}) {
  const getPlayerColor = (name) => {
    const p = playersList.find(pl=>(typeof pl==="string"?pl:pl.name)===name);
    return (p && typeof p!=="string" && p.color) ? p.color : null;
  };

  const sw = seriesWins||{p1:0,p2:0};
  const d1 = sw.p1+(seriesFinished&&!matchClosed&&seriesWinner==="p1"?1:0);
  const d2 = sw.p2+(seriesFinished&&!matchClosed&&seriesWinner==="p2"?1:0);
  const CELL_W=38, CELL_H=60, NAM_W=90;
  const BORDER="1px solid rgba(255,255,255,0.15)";
  const BORDER_THIN="1px solid rgba(255,255,255,0.08)";
  const totalJuegos = carrera*2-1;

  const MiniGrid = ({gamesData, isEditable, onToggle, p1wins, p2wins}) => (
    <div style={{overflowX:"auto",marginTop:6}}>
      <div style={{display:"flex",minWidth:"max-content"}}>
        <div style={{flexShrink:0,borderRight:BORDER}}>
          <div style={{height:16}}/>
          {["p1","p2"].map((k,ri)=>{
            const sw=k==="p1"?p1wins:p2wins;
            const trophyFS=sw<=5?22:sw<=10?19:sw<=15?16:13;
            return <div key={k} style={{width:NAM_W,height:CELL_H,borderBottom:ri===0?BORDER:"none",background:"rgba(0,0,0,0.3)",display:"flex",flexDirection:"column",alignItems:"flex-start",justifyContent:"flex-start",padding:"8px 8px 6px",overflow:"hidden",boxSizing:"border-box"}}>
              {(()=>{ const nm=k==="p1"?p1Name:p2Name; const col=getPlayerColor(nm); return <div style={{fontSize:24,fontWeight:800,color:col||"#e0e0e0",lineHeight:1.2,wordBreak:"break-word",marginBottom:5}}>{nm}</div>; })()}
              <div style={{display:"flex",flexWrap:"wrap",gap:1}}>
                {Array.from({length:sw},(_,i)=><span key={i} style={{fontSize:trophyFS,lineHeight:1.1}}>&#127942;</span>)}
              </div>
            </div>;
          })}
        </div>
        <div style={{flex:1,overflowX:"auto"}}>
          <div style={{minWidth:"max-content"}}>
            <div style={{display:"flex",height:16}}>
              {Array.from({length:totalJuegos},(_,ji)=><div key={ji} style={{width:CELL_W,textAlign:"center",fontSize:9,color:"#555",fontWeight:700,lineHeight:"16px"}}>{ji+1}</div>)}
            </div>
            {["p1","p2"].map((k,ri)=>(
              <div key={k} style={{display:"flex",borderBottom:ri===0?BORDER:"none"}}>
                {Array.from({length:totalJuegos},(_,ji)=>{
                  const g=gamesData?gamesData[ji]:null;
                  const hasWon=g&&g.winner===k;
                  const clickable=isEditable&&g;
                  return <div key={ji} onClick={()=>clickable&&onToggle(ji,k)}
                    style={{width:CELL_W,height:CELL_H,borderRight:BORDER_THIN,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,0.01)",cursor:clickable?"pointer":"default"}}>
                    {hasWon&&(g.ballType==="gold"?<SpecialBall type="gold" size={22}/>:g.ballType==="diamond"?<img src={IMG_RUN_OUT} style={{width:22,height:22,objectFit:"contain"}}/>:g.ballType==="breakrun"?<img src={IMG_BREAK_AND_RUN} style={{width:22,height:22,objectFit:"contain"}}/>:<BallIcon modalidad={modalidad} size={22}/>)}
                  </div>;
                })}
              </div>
            ))}
          </div>
        </div>
      </div>
      {isEditable&&<div style={{fontSize:9,color:"#555",marginTop:4,textAlign:"center"}}>Toca una bola para cambiar el ganador</div>}
    </div>
  );

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:100,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"20px 10px"}}>
      <div style={{background:"#0f2010",border:"1px solid rgba(74,222,128,0.18)",borderRadius:20,padding:"20px 16px",color:"#fff",width:"100%",maxWidth:380}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div style={{fontSize:15,fontWeight:700,color:"#e0e0e0"}}>Historial</div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",color:"#aaa",borderRadius:8,padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✕</button>
        </div>

        {/* Resumen general de la partida */}
        <div style={{background:"rgba(0,0,0,0.3)",border:"1px solid rgba(74,222,128,0.15)",borderRadius:14,padding:"14px 12px",marginBottom:14}}>
          {/* Nombres y bola */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
            <div style={{fontSize:18,fontWeight:900,color:getPlayerColor(p1Name)||"#fff",flex:1}}>{p1Name}</div>
            <BallIcon modalidad={modalidad} size={32}/>
            <div style={{fontSize:18,fontWeight:900,color:getPlayerColor(p2Name)||"#fff",flex:1,textAlign:"right"}}>{p2Name}</div>
          </div>
          {/* Trofeos y marcador */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(0,0,0,0.2)",borderRadius:10,padding:"8px 10px"}}>
            <div style={{display:"flex",flexWrap:"wrap",gap:2,flex:1}}>
              {Array.from({length:d1},(_,i)=><span key={i} style={{fontSize:16}}>🏆</span>)}
            </div>
            <div style={{fontSize:28,fontWeight:900,padding:"0 10px",textAlign:"center",letterSpacing:2}}>
              <span style={{color:d1>d2?"#f9e04b":"#fff"}}>{d1}</span>
              <span style={{color:"#444",margin:"0 6px"}}>-</span>
              <span style={{color:d2>d1?"#f9e04b":"#fff"}}>{d2}</span>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:2,flex:1,justifyContent:"flex-end"}}>
              {Array.from({length:d2},(_,i)=><span key={i} style={{fontSize:16}}>🏆</span>)}
            </div>
          </div>
          {/* Serie actual resumida */}
          {(()=>{
            const p1w=(games||[]).filter(g=>g.winner==="p1").length;
            const p2w=(games||[]).filter(g=>g.winner==="p2").length;
            return (
              <div style={{marginTop:10,background:"rgba(255,255,255,0.04)",borderRadius:10,padding:"8px 10px"}}>
                <div style={{fontSize:11,color:"#f9e04b",fontWeight:700,marginBottom:6}}>
                  Serie {seriesFinished?"concluida":"inconclusa"} #{seriesCount}
                </div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:6}}>
                  <div style={{display:"flex",flexWrap:"wrap",gap:3,flex:1}}>

 function fmtTime(totalSecs) {
  if (totalSecs == null || isNaN(totalSecs)) return "—";
  const m = Math.floor(totalSecs / 60);
  const s = Math.floor(totalSecs % 60);
  const ms = Math.floor((totalSecs % 1) * 100);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(ms).padStart(2,"0")}`;
}

function CrTimer({ startTs, base=0, big=false }) {
  const [now, setNow] = React.useState(Date.now());
  React.useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 30);
    return () => clearInterval(id);
  }, [startTs]);
  const elapsed = (now - startTs) / 1000 + base;
  const display = fmtTime(elapsed);
  if (big) return <span style={{fontVariantNumeric:"tabular-nums"}}>{display}</span>;
  return <span style={{color:"#f9e04b",fontVariantNumeric:"tabular-nums"}}>{display}</span>;
}

function LobbyCard({m, onOpen, onDelete, onReplay, onUpdateMatch, onLobbyBallMenu, onOpenHistory, onNextSeries, onUndo, onReactivar, onTerminar, onMoveUp, onMoveDown, isFirst, isLast, onEditName, editingNameKey, jornadaTurnActive=false, onJornadaScore, jornadaBlocked=false, jornadaPaused=false, onPauseToggle, jornadaTurnScored=false, deviceName=null, playersList=[], isAdminMode=false}) {
  const getPlayerColor = (name) => {
    const p = playersList.find(pl=>(typeof pl==="string"?pl:pl.name)===name);
    return (p && typeof p!=="string" && p.color) ? p.color : null;
  };
  const isOpen = !m.matchClosed;

  // ── Contrarreloj en lobby ──
  if (m.modalidad === "Contrarreloj" && isOpen) {
    const players = m.crPlayers || [];
    const order = m.crOrder || [];
    const times = m.crTimes || {};
    const currentIdx = m.crCurrentIdx ?? 0;
    const running = m.crRunning || false;
    const startTs = m.crStartTs || null;
    const totalRounds = m.crTotalRounds || 1;
    const currentRound = m.crRound || 1;
    // Sumar rondas de TODAS las series (serieHistory ya guarda las rondas de cada serie)
    const _allRW = {};
    (m.crSerieHistory||[]).forEach(s => {
      Object.entries(s.roundWins||{}).forEach(([k,v])=>{ _allRW[Number(k)]=(_allRW[Number(k)]||0)+v; });
    });
    // Solo agregar crRoundWins si la serie actual aún no está en serieHistory
    if ((m.crSerieHistory||[]).length < (m.crCurrentSerie||1)) {
      Object.entries(m.crRoundWins||{}).forEach(([k,v])=>{ _allRW[Number(k)]=(_allRW[Number(k)]||0)+v; });
    }
    const roundWins = _allRW;
    const accumTime = m.crAccumTime || {};
    const roundHistory = m.crRoundHistory || [];
    const penaltyTime = m.crPenaltyTime || 10;
    const crFaults = m.crFaults || {};
    const totalSeries = m.crTotalSeries || 1;
    const currentSerie = m.crCurrentSerie || 1;
    const serieWins = m.crSerieWins || {};
    const serieHistory = m.crSerieHistory || [];
    const accumTime2 = m.crAccumTime||{};
    const validRounds2 = m.crValidRounds||{};
    const standings = [...order].sort((a,b)=>(roundWins[b]||0)-(roundWins[a]||0)||(accumTime[a]||0)-(accumTime[b]||0));
    const allDone = order.every(i => times[i] !== undefined);

    // Posiciones actuales por tiempo (solo los que ya jugaron esta ronda)
    const played = order.filter(i => times[i] !== undefined);
    const sorted = [...played].sort((a,b) => times[a]-times[b]);
    const posMap = {}; sorted.forEach((i,p) => posMap[i]=p+1);

    // Ganador de ronda = menor tiempo
    const roundWinner = allDone ? sorted[0] : null;

    const carreraTarget = m.crTotalRounds||1;
    const crRoundWins = m.crRoundWins||{};
    const matchOver = m.crMatchOver || (m.crRoundWins && Object.values(m.crRoundWins).some(v=>v>=carreraTarget));

    // Iniciar/Detener cronómetro
    const handleCrTap = () => {
      onUpdateMatch(m.id, mm => {
        if (mm.crCurrentIdx >= mm.crOrder.length) return mm;
        if (!mm.crRunning) {
          return {...mm, crRunning:true, crStartTs:Date.now()};
        } else {
          // Solo pausa, guarda tiempo parcial
          const elapsed = parseFloat(((Date.now()-mm.crStartTs)/1000).toFixed(2)) + (mm.crPausedTime||0);
          return {...mm, crRunning:false, crStartTs:null, crPausedTime:elapsed};
        }
      });
    };

    // Reiniciar (long press en detener)
    const handleCrReset = () => {
      onUpdateMatch(m.id, mm => ({...mm, crRunning:false, crStartTs:null, crPausedTime:0}));
    };

    // Registrar tiempo y pasar al siguiente (con lógica de 3 faltas = ronda perdida)
    const handleRegister = (forfeit=false) => {
      onUpdateMatch(m.id, mm => {
        if (mm.crCurrentIdx >= mm.crOrder.length) return mm;
        const pidx = mm.crOrder[mm.crCurrentIdx];
        const fKey = `${mm.crRound||1}_${pidx}`;
        const fCount = ((mm.crFaults||{})[fKey])||0;
        // Forfeit solo si se llama explícitamente con forfeit=true
        const isForfeit = forfeit === true;
        const FORFEIT_TIME = 30;
        const base = isForfeit ? 0 : (mm.crRunning
          ? parseFloat(((Date.now()-mm.crStartTs)/1000).toFixed(2)) + (mm.crPausedTime||0)
          : (mm.crPausedTime||0));
        const faultPenalty = isForfeit ? FORFEIT_TIME : parseFloat((fCount*(mm.crPenaltyTime||10)).toFixed(2));
        const total = parseFloat((base + faultPenalty).toFixed(2));
        const newTimes = {...(mm.crTimes||{}), [pidx]: total};
        const newFaultTimes = {...(mm.crFaultTimes||{}), [pidx]: faultPenalty};
        const nextIdx = mm.crCurrentIdx + 1;
        const isLast = nextIdx >= mm.crOrder.length;
        const baseState = {...mm, crRunning:false, crStartTs:null, crPausedTime:0, crTimes:newTimes, crCurrentIdx:nextIdx, crFaultTimes:newFaultTimes, crRoundDone:false};
        if (isLast) {
          const ord = mm.crOrder||[];
          // Ganador de ronda: menor tiempo entre rondas válidas (forfeit no compite)
          const fRef = mm.crFaults||{};
          const validPlayers = ord.filter(i => ((fRef[`${mm.crRound||1}_${i}`])||0) < 3);
          const rw = validPlayers.length > 0
            ? validPlayers.reduce((best,i)=> newTimes[i]<newTimes[best]?i:best, validPlayers[0])
            : null;
          const newRW = rw!==null ? {...(mm.crRoundWins||{}), [rw]:((mm.crRoundWins||{})[rw]||0)+1} : {...(mm.crRoundWins||{})};
          // Acumular tiempo total (válidas + penalización forfeit)
          const newAcc = {...(mm.crAccumTime||{})};
          ord.forEach(i=>{ if(newTimes[i]!==undefined) newAcc[i]=(newAcc[i]||0)+newTimes[i]; });
          // Contar solo rondas válidas (sin forfeit) para dividir el promedio
          const faultsRef = mm.crFaults||{};
          const newValidRounds = {...(mm.crValidRounds||{})};
          ord.forEach(i=>{
            const fk = `${mm.crRound||1}_${i}`;
            const fc = (faultsRef[fk])||0;
            if(newTimes[i]!==undefined && fc < 3) newValidRounds[i]=(newValidRounds[i]||0)+1;
          });
          // Guardar qué jugadores tuvieron forfeit en esta ronda
          const forfeitPlayers = ord.filter(i => ((fRef[`${mm.crRound||1}_${i}`])||0) >= 3);
          const newRH = [...(mm.crRoundHistory||[]), {round:mm.crRound||1, winner:rw, times:{...newTimes}, faultTimes:{...newFaultTimes}, forfeits:forfeitPlayers}];
          const currentRound = mm.crRound||1;
          // Carrera: termina cuando alguien alcanza crTotalRounds victorias
          const carrera = mm.crTotalRounds||1;
          const someoneReachedCarrera = ord.some(i => (newRW[i]||0) >= carrera);

          // Si terminó la serie (alguien llegó a la carrera)
          if (someoneReachedCarrera) {
            // Ganador de serie: más rondas ganadas; empate → mejor promedio (solo rondas válidas)
            const serieWinner = ord.reduce((best,i) => {
              const bw = newRW[best]||0, iw = newRW[i]||0;
              if (iw > bw) return i;
              if (iw < bw) return best;
              // Empate: mejor promedio
              const bAvg = (newAcc[best]||0)/(newValidRounds[best]||1);
              const iAvg = (newAcc[i]||0)/(newValidRounds[i]||1);
              return iAvg < bAvg ? i : best;
            }, ord[0]);
            const newSW = {...(mm.crSerieWins||{}), [serieWinner]:((mm.crSerieWins||{})[serieWinner]||0)+1};
            const newSH = [...(mm.crSerieHistory||[]), {serie:mm.crCurrentSerie||1, winner:serieWinner, roundWins:{...newRW}, accumTime:{...newAcc}, rounds:[...newRH], validRounds:{...(mm.crValidRounds||{})}}];
            const isMatchOver = (mm.crCurrentSerie||1) >= (mm.crTotalSeries||1);
            return {...baseState, crRoundWins:newRW, crAccumTime:newAcc, crValidRounds:newValidRounds, crRoundHistory:newRH, crRoundDone:true,
              crSerieWins:newSW, crSerieHistory:newSH,
              crMatchOver:isMatchOver,
              crSerieOver:true};
          }
          return {...baseState, crRoundWins:newRW, crAccumTime:newAcc, crValidRounds:newValidRounds, crRoundHistory:newRH, crRoundDone:true, crMatchOver:false, crSerieOver:false};
        }
        return baseState;
      });
    };

    // Auto-forfeit si llega a 3 faltas
    const currentFaultsNow = (crFaults[currentFaultKey])||0;
    const autoForfeit = currentFaultsNow >= 3;

    // Faltas (auto-forfeit a 3)
    const handleFault = (delta) => {
      onUpdateMatch(m.id, mm => {
        const pidx = mm.crOrder[mm.crCurrentIdx];
        const key = `${mm.crRound||1}_${pidx}`;
        const cur = ((mm.crFaults||{})[key])||0;
        const newVal = Math.max(0, cur+delta);
        return {...mm, crFaults:{...(mm.crFaults||{}), [key]:newVal}};
      });
    };

    // Nueva serie (después de terminar todas las rondas de una serie)
    const handleNewSerie = () => {
      onUpdateMatch(m.id, mm => ({
        ...mm,
        crTimes:{}, crCurrentIdx:0, crRunning:false, crStartTs:null, crPausedTime:0,
        crRound:1, crRoundWins:{},
        // NO resetear crAccumTime ni crValidRounds — acumulan a través de todas las series
        crRoundHistory:[],
        crFaults:{}, crFaultTimes:{},
        crCurrentSerie:(mm.crCurrentSerie||1)+1,
        crRoundDone:false, crSerieOver:false
      }));
    };

    const currentPidx = order[currentIdx];
    const currentFaultKey = `${currentRound}_${currentPidx}`;
    const currentFaults = (crFaults[currentFaultKey])||0;
    const pausedTime = m.crPausedTime || 0;
    const serieOver = m.crSerieOver || false;
    const matchOver2 = m.crMatchOver || false;

    const handleNewRound = () => {
      onUpdateMatch(m.id, mm => {
        const t = mm.crTimes||{};
        const ord = mm.crOrder||[];
        // Ganador = menor tiempo
        const rw = ord.reduce((best,i)=> t[i]!==undefined && (t[best]===undefined || t[i]<t[best]) ? i : best, ord[0]);
        // Acumular wins
        const newRoundWins = {...(mm.crRoundWins||{})};
        newRoundWins[rw] = (newRoundWins[rw]||0)+1;
        // Acumular tiempos
        const newAccum = {...(mm.crAccumTime||{})};
        ord.forEach(i=>{ if(t[i]!==undefined) newAccum[i]=(newAccum[i]||0)+t[i]; });
        // Guardar historial de rondas: quién ganó cada ronda y los tiempos
        const newRoundHistory = [...(mm.crRoundHistory||[]), {round: mm.crRound||1, winner:rw, times:{...t}}];
        return {...mm, crTimes:{}, crCurrentIdx:0, crRunning:false, crStartTs:null,
          crRound:(mm.crRound||1)+1, crRoundWins:newRoundWins, crAccumTime:newAccum, crRoundHistory:newRoundHistory};
      });
    };

    return (
      <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(74,222,128,0.18)",borderRadius:16,padding:"12px 14px",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>

            <span style={{fontSize:18}}>⏱</span>
            <div>
              <div style={{fontSize:11,color:"#aaa"}}>{m.createdAt ? (()=>{const d=new Date(m.createdAt);return ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"][d.getDay()]+" "+d.getDate()+" "+["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][d.getMonth()]+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");})() : ""}</div>
              <div style={{fontSize:13,fontWeight:700,color:"#63b3ed"}}>Serie {currentSerie}/{totalSeries} · Ronda {currentRound}/{totalRounds}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button style={{padding:"4px 10px",borderRadius:8,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.13)",color:"#bbb",fontFamily:"inherit",fontSize:11,cursor:"pointer"}} onClick={e=>{e.stopPropagation();onOpenHistory(m.id);}}>Hist.</button>
            {onDelete && <button style={{width:28,height:28,borderRadius:8,background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.3)",color:"#f87171",fontFamily:"inherit",fontSize:13,fontWeight:900,cursor:"pointer"}} onClick={e=>{e.stopPropagation();onDelete(m.id);}}>✕</button>}
          </div>

        {/* Tabla de rondas */}
        {roundHistory.length > 0 && (()=>{
          return (
            <div style={{marginBottom:10,overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                <thead>
                  <tr>
                    <td style={{padding:"4px 6px",color:"#555",fontWeight:700}}></td>

                      <td key={r.round} style={{padding:"4px 6px",textAlign:"center",color:"#666",fontWeight:700}}>R{r.round}</td>
                    ))}

                  {order.map(pidx=>(
                    <tr key={pidx} style={{borderTop:"1px solid rgba(255,255,255,0.06)"}}>
                      <td style={{padding:"5px 6px",fontWeight:700,color:"#e0e0e0",whiteSpace:"nowrap"}}>{players[pidx]}</td>

                        const isW = r.winner===pidx;

                      <td style={{padding:"5px 6px",textAlign:"center",color:"#888",fontVariantNumeric:"tabular-nums"}}>{(m.crValidRounds||{})[pidx]>0?fmtTime((accumTime[pidx]||0)/((m.crValidRounds||{})[pidx])):"—"}</td>
