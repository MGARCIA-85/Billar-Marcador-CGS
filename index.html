function BallIcon({ modalidad, size = 38 }) {
  if (modalidad === "Contrarreloj") {
    return <span style={{fontSize:size*0.85,lineHeight:1,flexShrink:0}}>⏱</span>;
  }
  const b = BALL_COLORS[modalidad]; if (!b) return null;
  const r = size / 2;
  const fs = size < 32 ? 9 : size < 44 ? 11 : 13;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
      <circle cx={r} cy={r+1.5} r={r-1} fill="rgba(0,0,0,0.35)" />
      <circle cx={r} cy={r} r={r-1} fill={b.bg} />
      <ellipse cx={r*0.65} cy={r*0.52} rx={r*0.28} ry={r*0.18} fill="rgba(255,255,255,0.35)" />
      <circle cx={r} cy={r} r={r*0.38} fill="white" />
      <text x={r} y={r+fs*0.38} textAnchor="middle" fontSize={fs} fontWeight="bold" fill="#222" fontFamily="Arial,sans-serif">{b.num}</text>
    </svg>
  );
}

function CueBallSaque({ size }) {
  const r = size / 2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={r} cy={r} r={r-0.5} fill="#f0ede0" />
      <circle cx={r*0.65} cy={r*0.78} r={r*0.13} fill="#bb1f00" />
      <circle cx={r*1.12} cy={r*0.62} r={r*0.11} fill="#bb1f00" />
      <circle cx={r*0.88} cy={r*1.15} r={r*0.12} fill="#bb1f00" />
    </svg>
  );
}

function createMatch(p1, p2, firstServe, carrera, modalidad, extraData={}) {
  return {
    id: uid(), p1Name: p1, p2Name: p2, firstServe,
    carrera, modalidad, games: [], currentServe: firstServe,
    wins: {p1:0, p2:0}, seriesFinished: false, seriesWinner: null,
    seriesHistory: [], seriesWins: {p1:0, p2:0}, ...extraData, seriesCount: 1,
    matchClosed: false, closedAt: null, createdAt: Date.now(),
  };
}

function formatDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const dias = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return dias[d.getDay()] + " " + d.getDate() + " " + meses[d.getMonth()] + " " + d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
}

function Acceso({ ok }) {
  const [c, setC] = useState("");
  const [err, setErr] = useState(false);
  const [loading, setLoading] = useState(false);

  const go = async () => {
    if (!c.trim()) return;
    setLoading(true);
    try {
      const snap = await db.collection("config").doc("acceso").get();
      if (snap.exists && snap.data().codigo === c.trim()) {
        localStorage.setItem("bg","1"); ok();
      } else { setErr(true); setTimeout(()=>setErr(false),2000); }
    } catch(e) { setErr(true); setTimeout(()=>setErr(false),2000); }
    setLoading(false);
  };

  return (
    <div style={{minHeight:"100vh",background:"radial-gradient(ellipse at 50% 35%,#0f2a5a,#081530)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{fontSize:11,color:"#c9a227",letterSpacing:4,textTransform:"uppercase"}}>Billares</div>
      <div style={{fontSize:34,fontWeight:900,color:"#fff",letterSpacing:2,lineHeight:1,marginBottom:6}}>García</div>
      <div style={{fontSize:10,color:"#2a4a8a",letterSpacing:2,marginBottom:36}}>Control de partidas</div>
      <div style={{width:"100%",maxWidth:300}}>
        <input type="password" value={c} onChange={e=>setC(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&!loading&&go()} placeholder="Código de acceso" autoFocus
          style={{width:"100%",padding:"13px 16px",borderRadius:12,background:err?"rgba(255,80,80,0.1)":"rgba(255,255,255,0.07)",border:err?"1px solid rgba(255,80,80,0.5)":"1px solid rgba(255,255,255,0.15)",color:"#fff",fontFamily:"inherit",fontSize:16,outline:"none",textAlign:"center",letterSpacing:4,boxSizing:"border-box"}}/>
        {err && <div style={{color:"#f87171",fontSize:12,textAlign:"center",marginTop:6}}>Código incorrecto</div>}
        <button onClick={go} disabled={loading}
          style={{marginTop:12,width:"100%",padding:"13px 0",borderRadius:12,background:"linear-gradient(135deg,#1e3a8a,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontSize:15,fontWeight:800,cursor:"pointer",opacity:loading?0.7:1}}>
          {loading?"Verificando...":"Entrar"}
        </button>
      </div>
    </div>
  );
}

function BillarApp() {
  const [matches, setMatches] = useState([]);
  const [activeId, setActiveId] = useState(()=>localStorage.getItem("bg_activeId")||null);
  const [screen, setScreen] = useState(()=>{ const s=localStorage.getItem("bg_screen"); if(!s) localStorage.setItem("bg_screen","lobby"); return s||"lobby"; });
  const [playersList, setPlayersList] = useState(()=>{
    try { return JSON.parse(localStorage.getItem("bg_players")||"[]"); } catch{return [];}
  });
  const cleanUndef = (obj) => JSON.parse(JSON.stringify(obj, (k,v) => v === undefined ? null : v));
  const saveDispositivosMap = (map) => {
    setDispositivosMap(map);
    db.collection("billar").doc("dispositivos").set(cleanUndef(map)).catch(e=>console.error(e));
  };
  // Obtener devices de un jugador (por id o nombre)
  const getJugadorDevices = (p) => {
    if (typeof p === "string") return dispositivosMap[p] || [];
    // Buscar por id y por nombre para cubrir registros antiguos
    const byId = p.id ? (dispositivosMap[p.id] || []) : [];
    const byName = dispositivosMap[p.name] || [];
    const combined = [...new Set([...byId, ...byName])];
    return combined;
  };
  const getPlayerColor = (name) => {
    const p = playersList.find(pl=>(typeof pl==="string"?pl:pl.name)===name);
    return (p && typeof p!=="string" && p.color) ? p.color : null;
  };
  const saveJornadas = (list) => {
    setJornadas(list);
    try { localStorage.setItem("bg_jornadas", JSON.stringify(list)); } catch{}
    db.collection("billar").doc("jornadas").set({jornadas: cleanUndef(list)}).catch(e=>console.error(e));
  };

  const savePlayersList = (list) => {
    setPlayersList(list);
    try { localStorage.setItem("bg_players", JSON.stringify(list)); } catch{}
    db.collection("billar").doc("jugadores").set({list}).catch(e=>console.error(e));
  };

  const renamePlayer = (oldName, newName) => {
    if (!newName.trim() || oldName === newName.trim()) return;
    const n = newName.trim();
    // Actualizar lista de jugadores
    savePlayersList(playersList.map(p => {
      const pn=typeof p==="string"?p:p.name;
      return pn===oldName?(typeof p==="string"?n:{...p,name:n}):p;
    }).sort((a,b)=>{const na=typeof a==="string"?a:a.name;const nb=typeof b==="string"?b:b.name;return na.localeCompare(nb);}));
    // Actualizar TODAS las partidas donde aparece ese nombre
    const updated = matches.map(m => {
      let changed = false;
      let nm = {...m};
      // Partidas normales
      if (nm.p1Name === oldName) { nm.p1Name = n; changed = true; }
      if (nm.p2Name === oldName) { nm.p2Name = n; changed = true; }
      // Historial de series
      if (nm.seriesHistory) {
        nm.seriesHistory = nm.seriesHistory.map(s => ({...s})); // shallow copy ok
      }
      // Contrarreloj
      if (nm.crPlayers) {
        const np = nm.crPlayers.map(p => p === oldName ? n : p);
        if (np.some((p,i) => p !== nm.crPlayers[i])) { nm.crPlayers = np; changed = true; }
      }
      if (nm.crSerieHistory) {
        nm.crSerieHistory = nm.crSerieHistory.map(s => ({...s,
          winnerName: s.winnerName === oldName ? n : s.winnerName
        }));
        changed = true;
      }
      return changed ? nm : m;
    });
    saveMatches(updated);

  const addPlayerToList = (input) => {

      return na.localeCompare(nb);
    });
    savePlayersList(newList);
  };

  const [deviceName, setDeviceName] = useState(()=>localStorage.getItem("bg_device")||null);

      const pid = typeof pl==="string"?"":pl.id||"";
      return pn===deviceName || pid===deviceName;

    return p.role||"jugador";
  }, [deviceName, playersList]);
  const isAdmin = deviceRole==="admin";
  const isOperario = deviceRole==="operario" || isAdmin;
  const isJugador = deviceRole==="jugador" || isOperario;

  const [devDialog, setDevDialog] = useState(null); // {jugKey, jugName, existingDevs, newDev}
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [newPId, setNewPId] = useState("");
  const [ballMenu, setBallMenu] = useState(null); // {k, ji} posición del menú
  const [lobbyBallMenu, setLobbyBallMenu] = useState(null); // {matchId, k, ji}

  // Persistir navegación en sessionStorage para sobrevivir refrescos

  const setActiveIdP = (id) => { setActiveId(id); if(id) localStorage.setItem("bg_activeId", id); else localStorage.removeItem("bg_activeId"); };
  const setJornadaScreenP = (s) => { setJornadaScreen(s); if(s) localStorage.setItem("bg_jornadaScreen", s); else localStorage.removeItem("bg_jornadaScreen"); };

  const [fbLoaded, setFbLoaded] = useState(false);
  const [showRegisterPrompt, setShowRegisterPrompt] = useState(()=>!localStorage.getItem("bg_device")&&!localStorage.getItem("bg_skipRegister"));
  const [registroBorrado, setRegistroBorrado] = useState(false);
  const [pinPrompt, setPinPrompt] = useState(null);
  const [saqueModal, setSaqueModal] = useState(null);
  const [jornadaFinModal, setJornadaFinModal] = useState(null);
  const [jornadaResumenId, setJornadaResumenId] = useState(null); // {jornadaId, matches} // {matchId, p1Name, p2Name} // {jugKey,jugName,pin,existingDevs,newDev,onSuccess}
  const [isOnline, setIsOnline] = useState(()=>navigator.onLine);
  useEffect(() => {
    const onOn = () => setIsOnline(true);
    const onOff = () => setIsOnline(false);
    window.addEventListener('online', onOn);
    window.addEventListener('offline', onOff);
    return () => { window.removeEventListener('online', onOn); window.removeEventListener('offline', onOff); };
  }, []);

  useEffect(() => {
    const unsub1 = db.collection("billar").doc("partidas").onSnapshot(snap => {
      if (snap.exists) { const d = snap.data(); if (d && d.matches) setMatches(d.matches); }
      setFbLoaded(true);
    });
    const unsub2 = db.collection("billar").doc("jornadas").onSnapshot(snap => {
      if (snap.exists) { const d = snap.data(); if (d && Array.isArray(d.jornadas)) {
        setJornadas(d.jornadas);
        try { localStorage.setItem("bg_jornadas", JSON.stringify(d.jornadas)); } catch{}
      }}
    });
    const unsub3 = db.collection("billar").doc("jugadores").onSnapshot(snap => {
      if (snap.exists) { const d = snap.data(); if (d && Array.isArray(d.list)) {
        setPlayersList(d.list);
        try { localStorage.setItem("bg_players", JSON.stringify(d.list)); } catch{}
      }}
    });
    const unsub4 = db.collection("billar").doc("dispositivos").onSnapshot(snap => {
      if (snap.exists) {
        const d = snap.data();
        if (d) {
          setDispositivosMap(d);
          // Detectar si el registro del dispositivo actual fue borrado remotamente
          const localDev = localStorage.getItem("bg_device");
          if (localDev) {
            const devKeys = Object.values(d).flat();
            const stillRegistered = Object.entries(d).some(([k,v]) =>
              Array.isArray(v) ? v.includes(localDev) : v===localDev
            ) || d[localDev];
            if (!stillRegistered) {
              localStorage.removeItem("bg_device");
              setDeviceName(null);
              setRegistroBorrado(true);
            }
          }
        }
      }
    });
    return () => { unsub1(); unsub2(); unsub3(); unsub4(); };
  }, []);

  const moveMatch = (id, dir) => {
    const ids = activeMatches.map(m=>m.id);
    const i = ids.indexOf(id);
    if(dir===-1 && i===0) return;
    if(dir===1 && i===ids.length-1) return;
    const newIds = [...ids];
    [newIds[i], newIds[i+dir]] = [newIds[i+dir], newIds[i]];
    setMatchOrder(newIds);
  };

  const saveMatches = async (nm) => {
    setMatches(nm);
    try {
      function stripUndef(obj) {
        if (Array.isArray(obj)) return obj.map(stripUndef);
        if (obj && typeof obj === 'object') {
          var r = {};
          Object.keys(obj).forEach(function(k){ if(obj[k]!==undefined) r[k]=stripUndef(obj[k]); });
          return r;
        }
        return obj;
      }
      db.collection("billar").doc("partidas").set({matches: stripUndef(nm)});
    }
    catch(e) { console.error("Error Firebase:", e); }
  };

  const updateMatch = (id, fn) => {
    setMatches(prev => {
      const nm = prev.map(m => m.id === id ? fn(m) : m);
      db.collection("billar").doc("partidas").set({matches: cleanUndef(nm)}).catch(e => console.error(e));
      return nm;
    });
  };

  const activeMatch = matches.find(m => m.id === activeId);

  const startNewMatch = () => {
    if (wModalidad === "Contrarreloj") {
      const validPlayers = wPlayers.filter(p => p.trim());
      if (validPlayers.length < 2 || wOrder.length < validPlayers.length) return;
      const m = createMatch(validPlayers[0], validPlayers[1], "p1", wCarrera, wModalidad, {
        crPlayers: validPlayers,
        crOrder: wOrder,
        crTimes: {},
        crRound: 1,
        crTotalRounds: wRondasCR,
        crTotalSeries: 1,
        crCurrentSerie: 1,
        crSerieWins: {},
        crSerieHistory: [],
        crPenaltyTime: wPenaltyTime,
        crCurrentIdx: 0,
        crRunning: false,
        crStartTs: null,
        crRoundWins: {},
        crAccumTime: {},
      });
      const pendingJId = sessionStorage.getItem("pendingJornadaId")||null;
      sessionStorage.removeItem("pendingJornadaId");
      const mWithJ = pendingJId ? {...m, jornadaId:pendingJId} : m;
      saveMatches([...matches, mWithJ]);
      if(pendingJId) {
        saveJornadas(jornadas.map(j=>j.id===pendingJId?{...j,matchOrder:[...(j.matchOrder||[]),mWithJ.id]}:j));
        setJornadaScreenP(pendingJId);
      } else {
        setActiveId(mWithJ.id); setScreenP("lobby"); setLobbyTab("active");
      }
      setWPlayers(["",""]); setWOrder([]); setWCarrera(5); setWModalidad("Bola 8"); setWRondasCR(3); setWSeriesCR(1); setWPenaltyTime(10);
    } else {
      if (!wP1.trim() || !wP2.trim() || !wServe) return;
      const pendingJId2 = sessionStorage.getItem("pendingJornadaId")||null;
      sessionStorage.removeItem("pendingJornadaId");
      const m = createMatch(wP1.trim(), wP2.trim(), wServe, wCarrera, wModalidad);
      const mWithJ2 = pendingJId2 ? {...m, jornadaId:pendingJId2} : m;
      saveMatches([...matches, mWithJ2]);
      if(pendingJId2) {
        saveJornadas(jornadas.map(j=>j.id===pendingJId2?{...j,matchOrder:[...(j.matchOrder||[]),mWithJ2.id]}:j));
        setJornadaScreenP(pendingJId2);
      } else {
        setActiveId(mWithJ2.id); setScreenP("lobby"); setLobbyTab("active");
      }
      setWP1(""); setWP2(""); setWServe(null); setWCarrera(5); setWModalidad("Bola 8");
    }
  };

  const startNewSeries = () => {
    updateMatch(activeId, m => {
      const sw = m.seriesWinner;
      return {
        ...m,
        seriesHistory: [...m.seriesHistory, {winner:sw, p1wins:m.wins.p1, p2wins:m.wins.p2, seriesNum:m.seriesCount, games:[...m.games]}],
        seriesWins: {...m.seriesWins, [sw]: m.seriesWins[sw]+1},
        seriesCount: m.seriesCount+1,
        games: [], wins: {p1:0, p2:0},
        seriesFinished: false, seriesWinner: null,
      };
    });
  };

  const closeMatch = () => {
    setShowCloseMatch(false);
    updateMatch(activeId, m => {
      const shouldSum2 = (!m.matchClosed && m.seriesFinished && m.seriesWinner);
      const finalSeriesWins = shouldSum2
        ? {...m.seriesWins, [m.seriesWinner]: m.seriesWins[m.seriesWinner]+1}
        : m.seriesWins;
      return {...m, matchClosed:true, closedAt:Date.now(), seriesWins:finalSeriesWins, closedSeriesWins:shouldSum2?m.seriesWins:null};
    });
    setScreenP("lobby");
  };

  const deleteMatch = (id) => { setConfirmDeleteId(id); };
  const confirmDeleteMatch = async (id) => {
    const nm = matches.filter(m => m.id !== id);
    await saveMatches(nm);
    if (activeId === id) { setActiveIdP(null); setScreenP("lobby"); }
    setConfirmDeleteId(null);
  };

  const replayMatch = (m) => {
    setWModalidad(m.modalidad);
    setWCarrera(m.carrera);
    if (m.modalidad === "Contrarreloj") {
      setWPlayers(m.crPlayers && m.crPlayers.length ? [...m.crPlayers] : ["",""]);
      setWOrder([]);
      setWRondasCR(m.crTotalRounds || 3);
    } else {
      setWP1(m.p1Name); setWP2(m.p2Name);
      setWServe(null);
    }
    setScreenP("newMatch");
  };

  const activeMatchesRaw = matches.filter(m => !m.matchClosed && !m.jornadaId);
  const activeMatches = matchOrder.length
    ? [...activeMatchesRaw].sort((a,b) => {
        const ai = matchOrder.indexOf(a.id);
        const bi = matchOrder.indexOf(b.id);
        if(ai===-1&&bi===-1) return (b.createdAt||0)-(a.createdAt||0);
        if(ai===-1) return 1;
        if(bi===-1) return -1;
        return ai-bi;
      })
    : activeMatchesRaw.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const closedMatches = matches.filter(m => m.matchClosed && !m.jornadaId).sort((a,b) => (b.closedAt||b.createdAt||0)-(a.closedAt||a.createdAt||0));

  const chip = (sel) => ({
    padding:"8px 14px", borderRadius:20, fontFamily:"inherit", fontSize:13, fontWeight:600,
    cursor:"pointer", background:sel?"linear-gradient(135deg,#1e3a8a,#4ade80)":"rgba(255,255,255,0.05)",
    border:sel?"none":"1px solid rgba(255,255,255,0.1)", color:sel?"#fff":"#999",
    boxShadow:sel?"0 3px 10px rgba(74,222,128,0.28)":"none"
  });

  // ===== LOBBY =====
  // ===== JORNADAS =====
  if (jornadaScreen) {
    const jornadaMatches = matches.filter(m => m.jornadaId === jornadaScreen && jornadaScreen !== "list");
    const currentJ = jornadas.find(j => j.id === jornadaScreen);

    // ── Lista de jornadas ──
    if (jornadaScreen === "list") {
      return (
        <div className="app-screen" style={{background:"radial-gradient(ellipse at 50% 35%,#0f2a5a 0%,#081530 55%,#05102a 100%)"}}>
          <div className="app-scroll"
          onTouchStart={e=>{ptrRef.current.startY=e.touches[0].clientY;ptrRef.current.active=false;}}
          onTouchMove={e=>{if(e.currentTarget.scrollTop===0&&e.touches[0].clientY-ptrRef.current.startY>70){ptrRef.current.active=true;setPtrActive(true);}else if(e.currentTarget.scrollTop>0){ptrRef.current.active=false;setPtrActive(false);}}}
          onTouchEnd={e=>{if(ptrRef.current.active){ptrRef.current.active=false;setPtrActive(false);window.location.reload();}else{setPtrActive(false);}}}
          style={{padding:"20px 14px"}}>
          <div className={"ptr-indicator"+(ptrActive?" ptr-visible":"")}>↓ Suelta para actualizar</div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>

            </div>
            {isJugador && <button onClick={()=>{
              const newJNombre = prompt("Nombre para la jornada:", "Jornada "+(jornadas.length+1));
              if(!newJNombre?.trim()) return;
              const newJ = {id:"j_"+Date.now(), name:newJNombre.trim(), currentTurn:0, turnStarted:false, turnScored:false, matchOrder:[], finished:false, createdAt:Date.now()};
              saveJornadas([...jornadas, newJ]);
              setJornadaScreenP(newJ.id);
            }} style={{width:"100%",padding:"14px 0",borderRadius:12,border:"none",fontFamily:"inherit",fontSize:15,fontWeight:800,marginBottom:16,background:"linear-gradient(135deg,#1e3a8a,#4ade80)",color:"#fff",cursor:"pointer"}}>
              + Nueva jornada
            </button>}
            {/* Lista de jornadas existentes */}
            {jornadas.length===0
              ? <div style={{color:"#444",textAlign:"center",padding:"40px 0",fontSize:13}}>No hay jornadas creadas</div>
              : jornadas.slice().reverse().map(j => {
                  const jms = matches.filter(m=>m.jornadaId===j.id);
                  const done = jms.filter(m=>m.matchClosed).length;
                  return (
                    <div key={j.id} style={{padding:"12px 14px",borderRadius:12,background:j.finished?"rgba(255,255,255,0.01)":"rgba(249,224,75,0.04)",border:`1px solid ${j.finished?"rgba(255,255,255,0.05)":"rgba(249,224,75,0.3)"}`,marginBottom:8,opacity:j.finished?0.45:1}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                        <div onClick={()=>setJornadaScreenP(j.id)} style={{flex:1,cursor:"pointer"}}>

                          <span style={{fontSize:11,color:"#888",marginLeft:8}}>{done}/{jms.length} partidas</span>

                            const newName = prompt("Nuevo nombre:", j.name);

                          }} style={{fontSize:11,padding:"4px 8px",borderRadius:6,background:"rgba(74,222,128,0.08)",border:"1px solid rgba(74,222,128,0.2)",color:"#63b3ed",fontFamily:"inherit",cursor:"pointer"}}>✏️</button>
                          {isAdmin && <button onClick={()=>{

                              saveMatches(matches.filter(m=>m.jornadaId!==j.id));
                              saveJornadas(jornadas.filter(x=>x.id!==j.id));
                            }
                          }} style={{fontSize:11,padding:"4px 8px",borderRadius:6,background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.2)",color:"#f87171",fontFamily:"inherit",cursor:"pointer"}}>🗑</button>}
                        </div>
                      </div>
                      <div onClick={()=>setJornadaScreenP(j.id)} style={{fontSize:11,color:"#666",cursor:"pointer"}}>{j.finished?"✅ Finalizada":"🟡 En curso"} · Toca para abrir</div>
                      {j.createdAt && <div style={{fontSize:10,color:"#444",marginTop:2}}>📅 {new Date(j.createdAt).toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"})}</div>}
                      <button onClick={()=>setJornadaResumenId(j.id)}
                        style={{marginTop:6,width:"100%",padding:"7px 0",borderRadius:9,background:"rgba(249,224,75,0.06)",border:"1px solid rgba(249,224,75,0.2)",color:"#f9e04b",fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                        📊 Resumen
                      </button>
                      <button onClick={()=>{
                        if(!window.confirm(`¿Re-crear "${j.name}" como nueva jornada? Se copiarán las partidas con los mismos jugadores.`)) return;
                        const jornadaMtchs = matches.filter(m=>m.jornadaId===j.id&&m.modalidad!=="Contrarreloj");
                        if(jornadaMtchs.length===0){alert("No hay partidas para re-crear.");return;}
                        const newJName = prompt("Nombre para la nueva jornada:", j.name);
                        if(!newJName?.trim()) return;
                        const newJId = "j_"+Date.now();
                        const newJ = {id:newJId, name:newJName.trim(), currentTurn:0, turnStarted:false, turnScored:false, matchOrder:[], finished:false, createdAt:Date.now()};
                        const newMs = jornadaMtchs.map(m=>{
                          const nm = createMatch(m.p1Name, m.p2Name, null, m.carrera, m.modalidad);
                          return {...nm, jornadaId:newJId, needsServeSelection:true};
                        });
                        saveMatches([...matches, ...newMs]);
                        saveJornadas([...jornadas, {...newJ, matchOrder:newMs.map(m=>m.id)}]);
                        setJornadaScreenP(newJId);
                      }} style={{marginTop:8,width:"100%",padding:"8px 0",borderRadius:9,background:"rgba(74,222,128,0.08)",border:"1px solid rgba(74,222,128,0.2)",color:"#63b3ed",fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                        ↺ Re-crear jornada
                      </button>
                    </div>
                  );
                })
            }
          </div>
        {jornadaResumenId && (()=>{
          const jR = jornadas.find(j=>j.id===jornadaResumenId);
          const jRMs = matches.filter(m=>m.jornadaId===jornadaResumenId&&m.modalidad!=="Contrarreloj");
          if(!jR) return null;
          return (
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:999,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"20px 12px",overflowY:"auto"}}>
              <div style={{background:"#0f1f0f",borderRadius:18,padding:"20px 16px",border:"1px solid rgba(74,222,128,0.3)",maxWidth:420,width:"100%"}}>
                <div style={{fontSize:28,textAlign:"center",marginBottom:6}}>📊</div>
                <div style={{fontSize:17,fontWeight:800,color:"#f9e04b",textAlign:"center",marginBottom:4}}>{jR.name}</div>
                <div style={{fontSize:12,color:"#888",textAlign:"center",marginBottom:16}}>{jR.finished?"✅ Finalizada":"🟡 En curso"} · {jRMs.length} partidas</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:18}}>
                  {jRMs.map(m=>{
                    const sw1=m.seriesWins?.p1||0, sw2=m.seriesWins?.p2||0;
                    const winner=sw1>sw2?"p1":sw2>sw1?"p2":null;
                    const ig=m.games||[];
                    const p1w=ig.filter(g=>g.winner==="p1").length;
                    const p2w=ig.filter(g=>g.winner==="p2").length;
                    return (
                      <div key={m.id} style={{background:"rgba(255,255,255,0.04)",borderRadius:10,padding:"10px 8px",border:"1px solid rgba(255,255,255,0.08)"}}>
                        <div style={{fontSize:9,color:"#555",marginBottom:6,textAlign:"center"}}>{m.modalidad} · C{m.carrera}</div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:4,marginBottom:ig.length>0?6:0}}>
                          <div style={{flex:1,textAlign:"center"}}>
                            <div style={{fontSize:11,fontWeight:800,color:getPlayerColor(m.p1Name)||"#e0e0e0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{winner==="p1"?"👑 ":""}{m.p1Name}</div>
                            <div style={{display:"flex",justifyContent:"center",flexWrap:"wrap",gap:1,marginTop:4}}>{Array.from({length:sw1},(_,i)=><span key={i} style={{fontSize:13}}>🏆</span>)}{sw1===0&&<span style={{fontSize:11,color:"#555"}}>—</span>}</div>
                          </div>
                          <div style={{fontSize:11,color:"#444",fontWeight:700}}>-</div>
                          <div style={{flex:1,textAlign:"center"}}>
                            <div style={{fontSize:11,fontWeight:800,color:getPlayerColor(m.p2Name)||"#e0e0e0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{winner==="p2"?"👑 ":""}{m.p2Name}</div>
                            <div style={{display:"flex",justifyContent:"center",flexWrap:"wrap",gap:1,marginTop:4}}>{Array.from({length:sw2},(_,i)=><span key={i} style={{fontSize:13}}>🏆</span>)}{sw2===0&&<span style={{fontSize:11,color:"#555"}}>—</span>}</div>
                          </div>
                        </div>
                        {ig.length>0&&(()=>{ return (
                          <div style={{background:"rgba(255,255,255,0.03)",borderRadius:6,padding:"5px 6px"}}>
                            <div style={{fontSize:9,color:"#f9e04b",fontWeight:700,marginBottom:4}}>Serie {m.seriesFinished?"concluida":"inconclusa"} #{m.seriesCount}</div>
                            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:4}}>
                              <div style={{display:"flex",flexWrap:"wrap",gap:2,flex:1}}>
                                {ig.filter(g=>g.winner==="p1").map((g,j)=><BallIcon key={j} modalidad={m.modalidad} size={16}/>)}
                                {p1w===0&&<span style={{fontSize:9,color:"#333"}}>—</span>}
                              </div>
                              <div style={{fontSize:9,color:"#333",fontWeight:700}}>vs</div>
                              <div style={{display:"flex",flexWrap:"wrap",gap:2,flex:1,justifyContent:"flex-end"}}>
                                {ig.filter(g=>g.winner==="p2").map((g,j)=><BallIcon key={j} modalidad={m.modalidad} size={16}/>)}
                                {p2w===0&&<span style={{fontSize:9,color:"#333"}}>—</span>}
                              </div>
                            </div>
                          </div>
                        ); })()}
                      </div>
                    );
                  })}
                </div>
                <button onClick={()=>setJornadaResumenId(null)}
                  style={{width:"100%",padding:"13px",borderRadius:12,background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.12)",color:"#aaa",fontFamily:"inherit",fontSize:14,fontWeight:700,cursor:"pointer"}}>
                  ✕ Cerrar
                </button>
              </div>
            </div>
          );
        })()}
        </div>

          />;
        })()}
      {/* Modal historial CR desde lobby */}
      {showHistory && activeMatch && activeMatch.modalidad === "Contrarreloj" && (()=>{
        const hm = activeMatch;
        const players = hm.crPlayers||[];
        const order = hm.crOrder||[];
        const roundHistory = hm.crRoundHistory||[];
        const accumTime = hm.crAccumTime||{};
        const validRoundsH = hm.crValidRounds||{};
        const serieWinsH = hm.crSerieWins||{};
        const serieHistoryH = hm.crSerieHistory||[];
        const totalSeriesH = hm.crTotalSeries||1;
        // Sumar rondas de TODAS las series (solo serieHistory, sin duplicar crRoundWins)
        const allRWH = {};
        serieHistoryH.forEach(s => {
          Object.entries(s.roundWins||{}).forEach(([k,v])=>{ allRWH[Number(k)]=(allRWH[Number(k)]||0)+v; });
        });
        // Solo agregar crRoundWins si la partida está en curso (última serie no guardada aún)
        if (serieHistoryH.length < (hm.crTotalSeries||1)) {
          Object.entries(hm.crRoundWins||{}).forEach(([k,v])=>{ allRWH[Number(k)]=(allRWH[Number(k)]||0)+v; });
        }
        const roundWins = allRWH;
        // Promedio: solo rondas válidas (sin forfeit)
        const avgTime = (pidx) => validRoundsH[pidx]>0 ? (accumTime[pidx]||0)/validRoundsH[pidx] : Infinity;
        const standings = [...order].sort((a,b)=>{
          const sw=(serieWinsH[b]||0)-(serieWinsH[a]||0); if(sw!==0) return sw;
          const rw=(roundWins[b]||0)-(roundWins[a]||0); if(rw!==0) return rw;
          return avgTime(a)-avgTime(b);
        });
        return (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"20px 10px"}}>
            <div style={{background:"#0f2010",border:"1px solid rgba(74,222,128,0.18)",borderRadius:20,padding:"20px 16px",color:"#fff",width:"100%",maxWidth:420}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <div style={{fontSize:15,fontWeight:700}}>⏱ Historial · Contrarreloj</div>
                <button onClick={()=>setShowHistoryP(false)} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",color:"#aaa",borderRadius:8,padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✕</button>
              </div>
              {/* Clasificación */}
              <div style={{fontSize:11,color:"#63b3ed",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Clasificación final</div>
              {standings.map((pidx,pos)=>(
                <div key={pidx} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderRadius:9,background:pos===0?"rgba(249,224,75,0.08)":"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",marginBottom:6}}>
                  <span style={{fontWeight:700,fontSize:15,color:pos===0?"#f9e04b":pos===1?"#ccc":"#888"}}>{pos===0?"🏆":pos===1?"🥈":"🥉"} {pos+1}. {players[pidx]}</span>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:12,color:"#f9e04b",fontWeight:700}}>{serieWinsH[pidx]||0}/{totalSeriesH} series</div>
                    <div style={{fontSize:11,color:"#888"}}>{roundWins[pidx]||0} rondas · {validRoundsH[pidx]>0?fmtTime(avgTime(pidx))+" prom":"—"}</div>
                  </div>
                </div>
              ))}
              {/* Tabla rondas */}
              {serieHistoryH.length>0 && (()=>{
                return (<>
                  <div style={{fontSize:11,color:"#63b3ed",letterSpacing:1,textTransform:"uppercase",margin:"14px 0 8px"}}>Resultados por serie</div>
                  {serieHistoryH.map((s,gi)=>{
                    // Compatibilidad: usar s.rounds si existe, si no reconstruir del roundHistory global
                    const roundsPerSH = hm.crTotalRounds || 1;
                    const sRounds = s.rounds && s.rounds.length > 0
                      ? s.rounds
                      : roundHistory.slice((gi) * roundsPerSH, (gi+1) * roundsPerSH);
                    const sValidRounds = s.validRounds || {};
                    // Promedio de la serie: tiempo acumulado de rondas válidas / rondas válidas
                    const serieAvg = (pidx) => {
                      const validR = sRounds.filter(r => !(r.forfeits||[]).includes(pidx)).length;
                      const totalT = sRounds.reduce((sum,r) => {
                        const t = r.times[pidx];
                        return t !== undefined ? sum + t : sum;
                      }, 0);
                      return validR > 0 ? totalT / validR : null;
                    };
                    return (
                      <div key={gi} style={{marginBottom:12,background:"rgba(255,255,255,0.02)",borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.06)"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 10px",background:"rgba(74,222,128,0.06)",borderBottom:"1px solid rgba(74,222,128,0.12)"}}>
                          <span style={{fontSize:13,fontWeight:700,color:"#63b3ed"}}>Serie {gi+1}</span>
                          <span style={{fontSize:12,color:"#f9e04b",fontWeight:700}}>{s.winner!==null?`🏆 ${players[s.winner]}`:"Sin ganador"}</span>
                        </div>
                        <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                          <thead>
                            <tr style={{borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
                              <td style={{padding:"5px 8px",color:"#555",fontWeight:700}}></td>
                              {sRounds.map((r,ri)=><td key={ri} style={{padding:"5px 6px",textAlign:"center",color:"#888",fontWeight:700}}>Ronda {ri+1}</td>)}
                              <td style={{padding:"5px 6px",textAlign:"center",color:"#888",fontWeight:700,borderLeft:"1px solid rgba(255,255,255,0.06)"}}>Prom</td>
                            </tr>
                          </thead>
                          <tbody>
                            {standings.map(pidx=>(
                              <tr key={pidx} style={{borderTop:"1px solid rgba(255,255,255,0.04)"}}>
                                <td style={{padding:"6px 8px",fontWeight:700,color:"#e0e0e0",whiteSpace:"nowrap"}}>{players[pidx]}</td>
                                {sRounds.map((r,ri)=>{
                                  const isW=r.winner===pidx;
                                  const t=r.times[pidx];
                                  const isF=(r.forfeits||[]).includes(pidx);
                                  return <td key={ri} style={{padding:"6px 6px",textAlign:"center",
                                    background:isW?"rgba(249,224,75,0.12)":isF?"rgba(239,68,68,0.12)":"transparent",
                                    color:isW?"#f9e04b":isF?"#f87171":"#aaa",
                                    fontWeight:isW||isF?700:400,fontVariantNumeric:"tabular-nums",fontSize:12}}>
                                    {t!==undefined?fmtTime(t):"—"}{isW?" 🏆":""}{isF?" ⚠":""}
                                  </td>;
                                })}
                                <td style={{padding:"6px 6px",textAlign:"center",color:"#888",fontVariantNumeric:"tabular-nums",fontSize:11,borderLeft:"1px solid rgba(255,255,255,0.06)"}}>
                                  {serieAvg(pidx)!==null?fmtTime(serieAvg(pidx)):"—"}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    );
                  })}
                </>);
              })()}
              <button onClick={()=>setShowHistoryP(false)} style={{width:"100%",marginTop:16,padding:"12px 0",borderRadius:12,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#bbb",fontFamily:"inherit",fontSize:14,fontWeight:600,cursor:"pointer"}}>Cerrar</button>
            </div>
          </div>
        );
      })()}
      </div>
    );
  }

  // ===== ESTADÍSTICAS =====
  if (screen === "stats") {
    const closed = matches.filter(m => m.matchClosed);
    const allMods = [...new Set(closed.map(m=>m.modalidad))].sort();
    const allPlayers = [...new Set(closed.flatMap(m=>m.modalidad==="Contrarreloj"?(m.crPlayers||[]):[m.p1Name,m.p2Name]).filter(Boolean))].sort();
    const plNames = playersList.map(p=>typeof p==="string"?p:p.name);

    // Toggle helpers
    const toggleMod = (m) => setSfModalidades(prev => prev.includes(m)?prev.filter(x=>x!==m):[...prev,m]);
    const toggleJug = (j) => setSfJugadores(prev => prev.includes(j)?prev.filter(x=>x!==j):[...prev,j]);

    // Filtrar partidas por período/fechas/modalidad/jugadores (duelos directos)
    const filtered = closed.filter(m => {
      // Modalidad
      if (sfModalidades.length>0 && !sfModalidades.includes(m.modalidad)) return false;
      // Período o rango
      const ts = m.closedAt||m.createdAt||0;
      const d = new Date(ts);
      if (sfPeriod === "Rango") {
        if (sfFechaDesde) {
          const [yy,mm,dd] = sfFechaDesde.split("-").map(Number);
          const fd = new Date(yy,mm-1,dd,0,0,0,0);
          if(d<fd) return false;
        }
        if (sfFechaHasta) {
          const [yy,mm,dd] = sfFechaHasta.split("-").map(Number);
          const fh = new Date(yy,mm-1,dd,23,59,59,999);
          if(d>fh) return false;
        }
      } else {
        const now2=Date.now();
        if (sfPeriod === "Hoy") {
          const hoy = new Date(); hoy.setHours(0,0,0,0);
          if (new Date(ts) < hoy) return false;
        } else {
          const ms={"Esta semana":604800000,"Este mes":2592000000,"Todo":Infinity};
          if (now2-ts > (ms[sfPeriod]||Infinity)) return false;
        }
      }
      // Duelos directos: si hay jugadores seleccionados, la partida debe incluir SOLO a esos jugadores
      if (sfJugadores.length > 0) {
        if (m.modalidad === "Contrarreloj") {
          const players = (m.crPlayers||[]).filter(p=>p?.trim());
          // Todos los jugadores de la partida deben estar en la selección
          const allInSelection = players.every(p => sfJugadores.includes(p));
          // Al menos uno de los seleccionados debe estar en la partida
          const anySelected = players.some(p => sfJugadores.includes(p));
          if (!allInSelection || !anySelected) return false;
        } else {
          // Partida normal: ambos jugadores deben estar en la selección
          const p1in = sfJugadores.includes(m.p1Name);
          const p2in = sfJugadores.includes(m.p2Name);
          if (!p1in || !p2in) return false;
        }
      }
      return true;
    });

    // Calcular stats por jugador
    const statsMap = {};
    const ensurePlayer = (name) => {
      if (!statsMap[name]) statsMap[name] = {
        name, partidas:0, partidasW:0, series:0, seriesW:0,
        juegos:0, juegosW:0, rachaMejor:0, rachaActual:0,
        goldenBreaks:0, mesas:0, breakRuns:0,
        crRondas:0, crRondasW:0, crTimes:[]
      };
    };

    filtered.forEach(m => {
      if (m.modalidad === "Contrarreloj") {
        const players = m.crPlayers||[];
        const order = m.crOrder||[];
        const serieWinsCR = m.crSerieWins||{};
        const roundWinsCR = m.crRoundWins||{};
        const accumTime = m.crAccumTime||{};
        const validRoundsCR = m.crValidRounds||{};
        const totalSeriesCR = m.crTotalSeries||1;
        const totalRoundsCR = m.crTotalRounds||1;
        // Ganador = más series; empate = mejor promedio
        const crStandings = [...order].sort((a,b)=>{
          const sw=(serieWinsCR[b]||0)-(serieWinsCR[a]||0); if(sw!==0) return sw;
          const aAvg=validRoundsCR[a]>0?(accumTime[a]||0)/validRoundsCR[a]:Infinity;
          const bAvg=validRoundsCR[b]>0?(accumTime[b]||0)/validRoundsCR[b]:Infinity;
          return aAvg-bAvg;
        });
        players.forEach((name,i) => {
          if (!name?.trim()) return;
          ensurePlayer(name);
          const s = statsMap[name];
          // CR no cuenta en partidas (👑), solo en series y juegos
          // Series = partidas CR ganadas (para columna 🏆)
          s.seriesW += (serieWinsCR[i]||0);
          s.series += totalSeriesCR;
          // JG = rondas ganadas en CR
          s.juegosW += (roundWinsCR[i]||0);
          // JG total = rondas realmente jugadas (no fijas)
          const totalRoundsPlayed = Object.values(roundWinsCR).reduce((a,b)=>a+b,0) || (totalSeriesCR * totalRoundsCR);
          s.juegos += totalRoundsPlayed;
          const vr = validRoundsCR[i];
          if (accumTime[i] && vr > 0) s.crTimes.push(accumTime[i]/vr);
        });
      } else {
        const history = m.seriesHistory||[];
        const sw1 = m.seriesWins?.p1||0;
        const sw2 = m.seriesWins?.p2||0;
        const pWinner = sw1>sw2?"p1":sw2>sw1?"p2":null;

        [m.p1Name, m.p2Name].forEach((name,pi) => {
          if (!name?.trim()) return;
          const key = pi===0?"p1":"p2";
          ensurePlayer(name);
          const s = statsMap[name];
          s.partidas++;
          if (pWinner===key) s.partidasW++;

          history.forEach(ser => {
            s.series++;
            const won = ser.winner===key;
            if (won) s.seriesW++;
            const serGames = ser.games||[];
            serGames.forEach(g => {
              s.juegos++;
              if (g.winner===key) s.juegosW++;
            });
            // Golden break: juegos donde este jugador tiene bola dorada
            serGames.filter(g=>g.winner===key && g.ballType==="gold").forEach(()=>s.goldenBreaks++);
            serGames.filter(g=>g.winner===key && g.ballType==="breakrun").forEach(()=>s.breakRuns++);
            // Mesa limpia/barrida: juegos donde este jugador tiene diamante
            serGames.filter(g=>g.winner===key && g.ballType==="diamond").forEach(()=>s.mesas++);
            // Racha
            if (won) { s.rachaActual++; if(s.rachaActual>s.rachaMejor) s.rachaMejor=s.rachaActual; }
            else s.rachaActual=0;
          });
          (m.games||[]).forEach(g => {
            s.juegos++;
            if (g.winner===key) s.juegosW++;
          });
        });
      }
    });

    let rows = Object.values(statsMap);
    rows.sort((a,b)=>(b.partidasW-a.partidasW)||(b.seriesW-a.seriesW)||(b.juegosW-a.juegosW)||(b.crRondasW-a.crRondasW));

    const isCRonly = sfModalidades.length===1 && sfModalidades[0]==="Contrarreloj";
    const showCR = sfModalidades.includes("Contrarreloj") || sfModalidades.length===0;

    const chipS = (active) => ({
      padding:"5px 12px",borderRadius:20,fontFamily:"inherit",fontSize:11,fontWeight:600,cursor:"pointer",
      background:active?"linear-gradient(135deg,#1e3a8a,#4ade80)":"rgba(255,255,255,0.06)",
      border:active?"none":"1px solid rgba(255,255,255,0.11)",color:active?"#fff":"#999"
    });

    return (
      <div className="app-screen" style={{background:"radial-gradient(ellipse at 50% 35%,#0f2a5a 0%,#081530 55%,#05102a 100%)"}}>
        <div className="app-scroll"
          onTouchStart={e=>{ptrRef.current.startY=e.touches[0].clientY;ptrRef.current.active=false;}}
          onTouchMove={e=>{if(e.currentTarget.scrollTop===0&&e.touches[0].clientY-ptrRef.current.startY>70){ptrRef.current.active=true;setPtrActive(true);}else if(e.currentTarget.scrollTop>0){ptrRef.current.active=false;setPtrActive(false);}}}
          onTouchEnd={e=>{if(ptrRef.current.active){ptrRef.current.active=false;setPtrActive(false);window.location.reload();}else{setPtrActive(false);}}}
          style={{padding:"20px 14px"}}>
          <div className={"ptr-indicator"+(ptrActive?" ptr-visible":"")}>↓ Suelta para actualizar</div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <div style={{fontSize:22,fontWeight:800,color:"#63b3ed"}}>📊 Estadísticas</div>
            <button onClick={()=>setScreenP("lobby")} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.13)",color:"#ccc",borderRadius:10,padding:"7px 13px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>← Volver</button>
          </div>

          {/* Filtros */}
          <div style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:12,padding:"12px",marginBottom:14}}>

            {/* Período */}
            <div style={{fontSize:10,color:"#555",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Período</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:sfPeriod==="Rango"?10:14}}>
              {["Hoy","Esta semana","Este mes","Todo","Rango"].map(p=>(
                <button key={p} onClick={()=>setSfPeriod(p)} style={chipS(sfPeriod===p)}>{p}</button>
              ))}
            </div>
            {sfPeriod==="Rango" && (
              <div style={{display:"flex",gap:10,marginBottom:14,alignItems:"center"}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:9,color:"#555",marginBottom:4}}>DESDE</div>
                  <input type="date" value={sfFechaDesde} onChange={e=>setSfFechaDesde(e.target.value)}
                    style={{width:"100%",padding:"8px 10px",borderRadius:8,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",fontFamily:"inherit",fontSize:13,outline:"none",boxSizing:"border-box",colorScheme:"dark"}}/>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:9,color:"#555",marginBottom:4}}>HASTA</div>
                  <input type="date" value={sfFechaHasta} onChange={e=>setSfFechaHasta(e.target.value)}
                    style={{width:"100%",padding:"8px 10px",borderRadius:8,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",fontFamily:"inherit",fontSize:13,outline:"none",boxSizing:"border-box",colorScheme:"dark"}}/>
                </div>
              </div>
            )}

            {/* Modalidad (multi-select) */}
            <div style={{fontSize:10,color:"#555",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Modalidad <span style={{color:"#333",fontWeight:400}}>(toca para filtrar)</span></div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
              {allMods.map(m=>(
                <button key={m} onClick={()=>toggleMod(m)} style={chipS(sfModalidades.includes(m))}>{m}</button>
              ))}
              {sfModalidades.length>0 && <button onClick={()=>setSfModalidades([])} style={{...chipS(false),color:"#f87171",borderColor:"rgba(248,113,113,0.3)"}}>✕ Limpiar</button>}
            </div>

            {/* Jugador (multi-select) */}
            <div style={{fontSize:10,color:"#555",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Jugador <span style={{color:"#333",fontWeight:400}}>(toca para filtrar)</span></div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {allPlayers.map(j=>(
                <button key={j} onClick={()=>toggleJug(j)} style={chipS(sfJugadores.includes(j))}>{j}</button>
              ))}
              {sfJugadores.length>0 && <button onClick={()=>setSfJugadores([])} style={{...chipS(false),color:"#f87171",borderColor:"rgba(248,113,113,0.3)"}}>✕ Limpiar</button>}
            </div>
          </div>

          {/* Resultados */}
          {rows.length===0
            ? <div style={{color:"#444",textAlign:"center",padding:"40px 0",fontSize:13}}>No hay datos para los filtros seleccionados</div>
            : (<>
              {/* Título Ranking */}
              {(()=>{
                const now = new Date();
                const meses=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
                const tituloRanking = sfPeriod==="Hoy"?`Ranking · Hoy ${now.getDate()} ${meses[now.getMonth()]}`:sfPeriod==="Esta semana"?`Ranking · Esta semana`:sfPeriod==="Este mes"?`Ranking · ${meses[now.getMonth()]} ${now.getFullYear()}`:sfPeriod==="Rango"?`Ranking · Rango personalizado`:`Ranking · Todo el tiempo`;
                return <div style={{textAlign:"center",marginBottom:12}}>
                  <div style={{fontSize:15,fontWeight:800,color:"#63b3ed",letterSpacing:1}}>{tituloRanking}</div>
                  <div style={{height:3,borderRadius:2,background:"linear-gradient(90deg,transparent,#06b6d4,transparent)",marginTop:6}}></div>
                </div>;
              })()}
              {/* Podio */}
              <div style={{display:"flex",gap:8,marginBottom:14}}>
                {rows.slice(0,3).map((r,i)=>(
                  <div key={r.name} style={{flex:1,background:i===0?"rgba(249,224,75,0.08)":i===1?"rgba(180,180,180,0.06)":"rgba(100,60,20,0.08)",border:`1px solid ${i===0?"rgba(249,224,75,0.2)":i===1?"rgba(200,200,200,0.1)":"rgba(150,100,50,0.15)"}`,borderRadius:12,padding:"10px 8px",textAlign:"center"}}>
                    <div style={{fontSize:20}}>{i===0?"🥇":i===1?"🥈":"🥉"}</div>
                    <div style={{fontSize:12,fontWeight:800,color:i===0?"#f9e04b":"#e0e0e0",marginTop:4,wordBreak:"break-word"}}>{r.name}</div>
                    <div style={{fontSize:10,color:"#888",marginTop:2}}>{r.partidasW}P · {r.seriesW}S · {r.juegosW}J</div>
                  </div>
                ))}
              </div>

              {/* Tabla */}
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                  {(()=>{
                    const colMap = {partidasW:"👑",seriesW:"🏆",juegosW:"JG",breakRuns:"⭐BR",mesas:"⭐RO",goldenBreaks:"⭐GB",juegos:"JJ",pct:"%"};
                    const rowsConPct = rows.map(r=>({...r, pct:r.juegos>0?r.juegosW/r.juegos:0, crAvg:r.crTimes.length>0?r.crTimes.reduce((a,b)=>a+b,0)/r.crTimes.length:Infinity}));
                    const sortedRows = [...rowsConPct].sort((a,b)=>{ const v=sortCol==="crAvg"?((a.crAvg===Infinity?9e9:a.crAvg)-(b.crAvg===Infinity?9e9:b.crAvg)):(a[sortCol]||0)-(b[sortCol]||0); return sortDir==="desc"?-v:v; });
                    const thStyle = (col) => ({padding:"4px 3px",textAlign:"center",fontWeight:700,cursor:"pointer",userSelect:"none",
                      color:sortCol===col?"#fff":"#f9e04b",
                      background:sortCol===col?"rgba(74,222,128,0.15)":"transparent",
                      borderRadius:4,fontSize:18,lineHeight:"26px",height:34,verticalAlign:"middle"});
                    const toggleSort = (col) => { if(sortCol===col){setSortDir(d=>d==="desc"?"asc":"desc");}else{setSortCol(col);setSortDir("desc");} };
                    const arrow = (col) => sortCol===col?(sortDir==="desc"?"↓":"↑"):"";
                    return (<>
                      <thead>
                        <tr style={{borderBottom:"1px solid rgba(74,222,128,0.2)"}}>
                          <td style={{padding:"7px 4px",color:"#63b3ed",fontWeight:700}}>#</td>

                            color:(p.role||"jugador")===r?r==="admin"?"#f9e04b":r==="operario"?"#4ade80":"#ccc":"#555"}}>
                            {r==="admin"?"👑":r==="operario"?"⚙️":"🎱"} {r.charAt(0).toUpperCase()+r.slice(1)}

                      </div>
                    </div>
                  )}
                  <div style={{display:"flex",gap:6}}>
                    {(()=>{
                      const jugKey = p.id||p.name;

                              localStorage.setItem("bg_device",dn);
                              setDeviceName(dn);
                              saveDispositivosMap({...dispositivosMap, [jugKey]: [dn]});

                          }

                            color:isThisDevice?"#4ade80":hasOtherDevs?"#888":"#4ade80",
                            fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:isThisDevice?"default":"pointer"}}>
                          {isThisDevice?"✓ Registrado":hasOtherDevs?`📱 Registrado (${existingDevs.length})`:"📱 Registrar celular"}
                        </button>
                        {isAdmin && existingDevs.length > 0 && (
                          <button onClick={()=>{
                            if(window.confirm(`¿Eliminar registro de dispositivo de ${p.name}?`)) {
                              const newMap = {...dispositivosMap};

                              saveDispositivosMap(newMap);
                              if(deviceName===jugKey){setDeviceName(null);localStorage.removeItem("bg_device");}

                            📵
                          </button>
                        )}
                      </>);
                    })()}
