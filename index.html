            onDeleteLastSeries={()=>{updateMatch(activeId,(m)=>{if(m.seriesHistory.length===0)return m;const last=m.seriesHistory[m.seriesHistory.length-1];const nh=m.seriesHistory.slice(0,-1);const nsw={p1:0,p2:0};nh.forEach(s=>{if(s.winner&&!s.partial)nsw[s.winner]++;});return{...m,seriesHistory:nh,seriesWins:nsw,seriesCount:last.seriesNum,games:last.games||[],wins:{p1:last.p1wins,p2:last.p2wins},seriesFinished:true,seriesWinner:last.winner};});}}
            onEditHistoryGame={(si,ji,k,fb)=>{updateMatch(activeId,(m)=>{const nh=m.seriesHistory.map((ser,idx)=>{if(idx!==si)return ser;const bg=ser.games||fb;const ng=bg.map((g,i)=>i===ji?{...g,winner:k}:g);const p1=ng.filter(g=>g.winner==="p1").length;const p2=ng.filter(g=>g.winner==="p2").length;const nww=p1>=m.carrera?"p1":p2>=m.carrera?"p2":ser.winner;return{...ser,games:ng,p1wins:p1,p2wins:p2,winner:nww};});const nsw={p1:0,p2:0};nh.forEach(s=>{if(s.winner&&!s.partial)nsw[s.winner]++;});return{...m,seriesHistory:nh,seriesWins:nsw};});}}
            onRestoreLastSeries={(ls,lg)=>{updateMatch(activeId,(m)=>{const nh=m.seriesHistory.slice(0,-1);const nsw={p1:0,p2:0};nh.forEach(s=>{if(s.winner&&!s.partial)nsw[s.winner]++;});const rg=ls.games||lg;const rw={p1:rg.filter(g=>g.winner==="p1").length,p2:rg.filter(g=>g.winner==="p2").length};const llg=rg[rg.length-1];const ns=llg?(llg.serve==="p1"?"p2":"p1"):m.firstServe;return{...m,seriesHistory:nh,seriesWins:nsw,seriesCount:ls.seriesNum,games:rg,wins:rw,currentServe:ns,seriesFinished:false,seriesWinner:null};});setShowHistory(false);}}
            onRestoreAnySeries={(si,ls,lg)=>{updateMatch(activeId,(m)=>{const rg=ls.games||lg;const rw={p1:rg.filter(g=>g.winner==="p1").length,p2:rg.filter(g=>g.winner==="p2").length};const llg=rg[rg.length-1];const ns=llg?(llg.serve==="p1"?"p2":"p1"):m.firstServe;const nh=m.seriesHistory.slice(0,si);const nsw={p1:0,p2:0};nh.forEach(s=>{if(s.winner&&!s.partial)nsw[s.winner]++;});return{...m,seriesHistory:nh,seriesWins:nsw,seriesCount:ls.seriesNum,games:rg,wins:rw,currentServe:ns,seriesFinished:false,seriesWinner:null};});setShowHistory(false);}}
            onReactivar={()=>{updateMatch(activeId,m=>({...m,matchClosed:false,closedAt:null}));setShowHistory(false);}}
          />;
        })()}
      {/* Modal historial CR desde lobby */}
      {showHistory && activeMatch && activeMatch.modalidad === "Contrarreloj" && (()=>{
        const hm = activeMatch;
        const players = hm.crPlayers||[];
        const order = hm.crOrder||[];
        const roundHistory = hm.crRoundHistory||[];
        const accumTime = hm.crAccumTime||{};
        const validRoundsH = hm.crValidRounds||{};
        const serieWinsH = hm.crSerieWins||{};
        const serieHistoryH = hm.crSerieHistory||[];
        const totalSeriesH = hm.crTotalSeries||1;
        // Sumar rondas de TODAS las series (solo serieHistory, sin duplicar crRoundWins)
        const allRWH = {};
        serieHistoryH.forEach(s => {
          Object.entries(s.roundWins||{}).forEach(([k,v])=>{ allRWH[Number(k)]=(allRWH[Number(k)]||0)+v; });
        });
        // Solo agregar crRoundWins si la partida está en curso (última serie no guardada aún)
        if (serieHistoryH.length < (hm.crTotalSeries||1)) {
          Object.entries(hm.crRoundWins||{}).forEach(([k,v])=>{ allRWH[Number(k)]=(allRWH[Number(k)]||0)+v; });
        }
        const roundWins = allRWH;
        // Promedio: solo rondas válidas (sin forfeit)
        const avgTime = (pidx) => validRoundsH[pidx]>0 ? (accumTime[pidx]||0)/validRoundsH[pidx] : Infinity;
        const standings = [...order].sort((a,b)=>{
          const sw=(serieWinsH[b]||0)-(serieWinsH[a]||0); if(sw!==0) return sw;
          const rw=(roundWins[b]||0)-(roundWins[a]||0); if(rw!==0) return rw;
          return avgTime(a)-avgTime(b);
        });
        return (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"20px 10px"}}>
            <div style={{background:"#0f2010",border:"1px solid rgba(74,222,128,0.18)",borderRadius:20,padding:"20px 16px",color:"#fff",width:"100%",maxWidth:420}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <div style={{fontSize:15,fontWeight:700}}>⏱ Historial · Contrarreloj</div>
                <button onClick={()=>setShowHistory(false)} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",color:"#aaa",borderRadius:8,padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✕</button>
              </div>
              {/* Clasificación */}
              <div style={{fontSize:11,color:"#4ade80",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Clasificación final</div>
              {standings.map((pidx,pos)=>(
                <div key={pidx} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderRadius:9,background:pos===0?"rgba(249,224,75,0.08)":"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",marginBottom:6}}>
                  <span style={{fontWeight:700,fontSize:15,color:pos===0?"#f9e04b":pos===1?"#ccc":"#888"}}>{pos===0?"👑":pos===1?"🥈":"🥉"} {pos+1}. {players[pidx]}</span>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:12,color:"#f9e04b",fontWeight:700}}>{serieWinsH[pidx]||0}/{totalSeriesH} series</div>
                    <div style={{fontSize:11,color:"#888"}}>{roundWins[pidx]||0} rondas · {validRoundsH[pidx]>0?fmtTime(avgTime(pidx))+" prom":"—"}</div>
                  </div>
                </div>
              ))}
              {/* Tabla rondas */}
              {serieHistoryH.length>0 && (()=>{
                return (<>
                  <div style={{fontSize:11,color:"#4ade80",letterSpacing:1,textTransform:"uppercase",margin:"14px 0 8px"}}>Resultados por serie</div>
                  {serieHistoryH.map((s,gi)=>{
                    // Compatibilidad: usar s.rounds si existe, si no reconstruir del roundHistory global
                    const roundsPerSH = hm.crTotalRounds || 1;
                    const sRounds = s.rounds && s.rounds.length > 0
                      ? s.rounds
                      : roundHistory.slice((gi) * roundsPerSH, (gi+1) * roundsPerSH);
                    const sValidRounds = s.validRounds || {};
                    // Promedio de la serie: tiempo acumulado de rondas válidas / rondas válidas
                    const serieAvg = (pidx) => {
                      const validR = sRounds.filter(r => !(r.forfeits||[]).includes(pidx)).length;
                      const totalT = sRounds.reduce((sum,r) => {
                        const t = r.times[pidx];
                        return t !== undefined ? sum + t : sum;
                      }, 0);
                      return validR > 0 ? totalT / validR : null;
                    };
                    return (
                      <div key={gi} style={{marginBottom:12,background:"rgba(255,255,255,0.02)",borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.06)"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 10px",background:"rgba(74,222,128,0.06)",borderBottom:"1px solid rgba(74,222,128,0.12)"}}>
                          <span style={{fontSize:13,fontWeight:700,color:"#4ade80"}}>Serie {gi+1}</span>
                          <span style={{fontSize:12,color:"#f9e04b",fontWeight:700}}>{s.winner!==null?`🏆 ${players[s.winner]}`:"Sin ganador"}</span>
                        </div>
                        <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                          <thead>
                            <tr style={{borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
                              <td style={{padding:"5px 8px",color:"#555",fontWeight:700}}></td>
                              {sRounds.map((r,ri)=><td key={ri} style={{padding:"5px 6px",textAlign:"center",color:"#888",fontWeight:700}}>Ronda {ri+1}</td>)}
                              <td style={{padding:"5px 6px",textAlign:"center",color:"#888",fontWeight:700,borderLeft:"1px solid rgba(255,255,255,0.06)"}}>Prom</td>
                            </tr>
                          </thead>
                          <tbody>
                            {standings.map(pidx=>(
                              <tr key={pidx} style={{borderTop:"1px solid rgba(255,255,255,0.04)"}}>
                                <td style={{padding:"6px 8px",fontWeight:700,color:"#e0e0e0",whiteSpace:"nowrap"}}>{players[pidx]}</td>
                                {sRounds.map((r,ri)=>{
                                  const isW=r.winner===pidx;
                                  const t=r.times[pidx];
                                  const isF=(r.forfeits||[]).includes(pidx);
                                  return <td key={ri} style={{padding:"6px 6px",textAlign:"center",
                                    background:isW?"rgba(249,224,75,0.12)":isF?"rgba(239,68,68,0.12)":"transparent",
                                    color:isW?"#f9e04b":isF?"#f87171":"#aaa",
                                    fontWeight:isW||isF?700:400,fontVariantNumeric:"tabular-nums",fontSize:12}}>
                                    {t!==undefined?fmtTime(t):"—"}{isW?" 🏆":""}{isF?" ⚠":""}
                                  </td>;
                                })}
                                <td style={{padding:"6px 6px",textAlign:"center",color:"#888",fontVariantNumeric:"tabular-nums",fontSize:11,borderLeft:"1px solid rgba(255,255,255,0.06)"}}>
                                  {serieAvg(pidx)!==null?fmtTime(serieAvg(pidx)):"—"}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    );
                  })}
                </>);
              })()}
              <button onClick={()=>setShowHistory(false)} style={{width:"100%",marginTop:16,padding:"12px 0",borderRadius:12,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#bbb",fontFamily:"inherit",fontSize:14,fontWeight:600,cursor:"pointer"}}>Cerrar</button>
            </div>
          </div>
        );
      })()}
      </div>
    );
  }

  // ===== ESTADÍSTICAS =====
  if (screen === "stats") {
    const closed = matches.filter(m => m.matchClosed && !m.jornadaId);
    const allMods = [...new Set(closed.map(m=>m.modalidad))].sort();
    const allPlayers = [...new Set(closed.flatMap(m=>m.modalidad==="Contrarreloj"?(m.crPlayers||[]):[m.p1Name,m.p2Name]).filter(Boolean))].sort();

    // Toggle helpers
    const toggleMod = (m) => setSfModalidades(prev => prev.includes(m)?prev.filter(x=>x!==m):[...prev,m]);
    const toggleJug = (j) => setSfJugadores(prev => prev.includes(j)?prev.filter(x=>x!==j):[...prev,j]);

    // Filtrar partidas por período/fechas/modalidad/jugadores (duelos directos)
    const filtered = closed.filter(m => {
      // Modalidad
      if (sfModalidades.length>0 && !sfModalidades.includes(m.modalidad)) return false;
      // Período o rango
      const ts = m.closedAt||m.createdAt||0;
      const d = new Date(ts);
      if (sfPeriod === "Rango") {
        if (sfFechaDesde) { const fd=new Date(sfFechaDesde); fd.setHours(0,0,0,0); if(d<fd) return false; }
        if (sfFechaHasta) { const fh=new Date(sfFechaHasta); fh.setHours(23,59,59,999); if(d>fh) return false; }
      } else {
        const now2=Date.now();
        const ms={"Hoy":86400000,"Esta semana":604800000,"Este mes":2592000000,"Todo":Infinity};
        if (now2-ts > (ms[sfPeriod]||Infinity)) return false;
      }
      // Duelos directos: si hay jugadores seleccionados, la partida debe incluir SOLO a esos jugadores
      if (sfJugadores.length > 0) {
        if (m.modalidad === "Contrarreloj") {
          const players = (m.crPlayers||[]).filter(p=>p?.trim());
          // Todos los jugadores de la partida deben estar en la selección
          const allInSelection = players.every(p => sfJugadores.includes(p));
          // Al menos uno de los seleccionados debe estar en la partida
          const anySelected = players.some(p => sfJugadores.includes(p));
          if (!allInSelection || !anySelected) return false;
        } else {
          // Partida normal: ambos jugadores deben estar en la selección
          const p1in = sfJugadores.includes(m.p1Name);
          const p2in = sfJugadores.includes(m.p2Name);
          if (!p1in || !p2in) return false;
        }
      }
      return true;
    });

    // Calcular stats por jugador
    const statsMap = {};
    const ensurePlayer = (name) => {
      if (!statsMap[name]) statsMap[name] = {
        name, partidas:0, partidasW:0, series:0, seriesW:0,
        juegos:0, juegosW:0, rachaMejor:0, rachaActual:0,
        goldenBreaks:0, mesas:0,
        crRondas:0, crRondasW:0, crTimes:[]
      };
    };

    filtered.forEach(m => {
      if (m.modalidad === "Contrarreloj") {
        const players = m.crPlayers||[];
        const order = m.crOrder||[];
        const serieWinsCR = m.crSerieWins||{};
        const roundWinsCR = m.crRoundWins||{};
        const accumTime = m.crAccumTime||{};
        const validRoundsCR = m.crValidRounds||{};
        const totalSeriesCR = m.crTotalSeries||1;
        const totalRoundsCR = m.crTotalRounds||1;
        // Ganador = más series; empate = mejor promedio
        const crStandings = [...order].sort((a,b)=>{
          const sw=(serieWinsCR[b]||0)-(serieWinsCR[a]||0); if(sw!==0) return sw;
          const aAvg=validRoundsCR[a]>0?(accumTime[a]||0)/validRoundsCR[a]:Infinity;
          const bAvg=validRoundsCR[b]>0?(accumTime[b]||0)/validRoundsCR[b]:Infinity;
          return aAvg-bAvg;
        });
        players.forEach((name,i) => {
          if (!name?.trim()) return;
          ensurePlayer(name);
          const s = statsMap[name];
          s.partidas++;
          if (crStandings[0]===i) s.partidasW++;
          // Series = partidas CR ganadas (para columna 🏆)
          s.seriesW += (serieWinsCR[i]||0);
          s.series += totalSeriesCR;
          // JG = rondas ganadas en CR
          s.juegosW += (roundWinsCR[i]||0);
          s.juegos += totalSeriesCR * totalRoundsCR;
          const vr = validRoundsCR[i];
          if (accumTime[i] && vr > 0) s.crTimes.push(accumTime[i]/vr);
        });
      } else {
        const history = m.seriesHistory||[];
        const sw1 = m.seriesWins?.p1||0;
        const sw2 = m.seriesWins?.p2||0;
        const pWinner = sw1>sw2?"p1":sw2>sw1?"p2":null;

        [m.p1Name, m.p2Name].forEach((name,pi) => {
          if (!name?.trim()) return;
          const key = pi===0?"p1":"p2";
          ensurePlayer(name);
          const s = statsMap[name];
          s.partidas++;
          if (pWinner===key) s.partidasW++;

          history.forEach(ser => {
            s.series++;
            const won = ser.winner===key;
            if (won) s.seriesW++;
            const serGames = ser.games||[];
            serGames.forEach(g => {
              s.juegos++;
              if (g.winner===key) s.juegosW++;
            });
            // Golden break: juegos donde este jugador tiene bola dorada
            serGames.filter(g=>g.winner===key && g.ballType==="gold").forEach(()=>s.goldenBreaks++);
            // Mesa limpia/barrida: juegos donde este jugador tiene diamante
            serGames.filter(g=>g.winner===key && g.ballType==="diamond").forEach(()=>s.mesas++);
            // Racha
            if (won) { s.rachaActual++; if(s.rachaActual>s.rachaMejor) s.rachaMejor=s.rachaActual; }
            else s.rachaActual=0;
          });
          (m.games||[]).forEach(g => {
            s.juegos++;
            if (g.winner===key) s.juegosW++;
          });
        });
      }
    });

    let rows = Object.values(statsMap);
    rows.sort((a,b)=>(b.partidasW-a.partidasW)||(b.seriesW-a.seriesW)||(b.juegosW-a.juegosW)||(b.crRondasW-a.crRondasW));

    const isCRonly = sfModalidades.length===1 && sfModalidades[0]==="Contrarreloj";
    const showCR = sfModalidades.includes("Contrarreloj") || sfModalidades.length===0;

    const chipS = (active) => ({
      padding:"5px 12px",borderRadius:20,fontFamily:"inherit",fontSize:11,fontWeight:600,cursor:"pointer",
      background:active?"linear-gradient(135deg,#166534,#4ade80)":"rgba(255,255,255,0.06)",
      border:active?"none":"1px solid rgba(255,255,255,0.11)",color:active?"#fff":"#999"
    });

    return (
      <div className="app-screen" style={{background:"radial-gradient(ellipse at 50% 35%,#1a4a1a 0%,#0a1f0a 55%,#060f06 100%)"}}>
        <div className="app-scroll" style={{padding:"20px 14px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <div style={{fontSize:22,fontWeight:800,color:"#4ade80"}}>📊 Estadísticas</div>
            <button onClick={()=>setScreen("lobby")} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.13)",color:"#ccc",borderRadius:10,padding:"7px 13px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>← Volver</button>
          </div>

          {/* Filtros */}
          <div style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:12,padding:"12px",marginBottom:14}}>

            {/* Período */}
            <div style={{fontSize:10,color:"#555",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Período</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:sfPeriod==="Rango"?10:14}}>
              {["Hoy","Esta semana","Este mes","Todo","Rango"].map(p=>(
                <button key={p} onClick={()=>setSfPeriod(p)} style={chipS(sfPeriod===p)}>{p}</button>
              ))}
            </div>
            {sfPeriod==="Rango" && (
              <div style={{display:"flex",gap:10,marginBottom:14,alignItems:"center"}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:9,color:"#555",marginBottom:4}}>DESDE</div>
                  <input type="date" value={sfFechaDesde} onChange={e=>setSfFechaDesde(e.target.value)}
                    style={{width:"100%",padding:"8px 10px",borderRadius:8,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",fontFamily:"inherit",fontSize:13,outline:"none",boxSizing:"border-box",colorScheme:"dark"}}/>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:9,color:"#555",marginBottom:4}}>HASTA</div>
                  <input type="date" value={sfFechaHasta} onChange={e=>setSfFechaHasta(e.target.value)}
                    style={{width:"100%",padding:"8px 10px",borderRadius:8,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",fontFamily:"inherit",fontSize:13,outline:"none",boxSizing:"border-box",colorScheme:"dark"}}/>
                </div>
              </div>
            )}

            {/* Modalidad (multi-select) */}
            <div style={{fontSize:10,color:"#555",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Modalidad <span style={{color:"#333",fontWeight:400}}>(toca para filtrar)</span></div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
              {allMods.map(m=>(
                <button key={m} onClick={()=>toggleMod(m)} style={chipS(sfModalidades.includes(m))}>{m}</button>
              ))}
              {sfModalidades.length>0 && <button onClick={()=>setSfModalidades([])} style={{...chipS(false),color:"#f87171",borderColor:"rgba(248,113,113,0.3)"}}>✕ Limpiar</button>}
            </div>

            {/* Jugador (multi-select) */}
            <div style={{fontSize:10,color:"#555",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Jugador <span style={{color:"#333",fontWeight:400}}>(toca para filtrar)</span></div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {allPlayers.map(j=>(
                <button key={j} onClick={()=>toggleJug(j)} style={chipS(sfJugadores.includes(j))}>{j}</button>
              ))}
              {sfJugadores.length>0 && <button onClick={()=>setSfJugadores([])} style={{...chipS(false),color:"#f87171",borderColor:"rgba(248,113,113,0.3)"}}>✕ Limpiar</button>}
            </div>
          </div>

          {/* Resultados */}
          {rows.length===0
            ? <div style={{color:"#444",textAlign:"center",padding:"40px 0",fontSize:13}}>No hay datos para los filtros seleccionados</div>
            : (<>
              {/* Podio */}
              <div style={{display:"flex",gap:8,marginBottom:14}}>
                {rows.slice(0,3).map((r,i)=>(
                  <div key={r.name} style={{flex:1,background:i===0?"rgba(249,224,75,0.08)":i===1?"rgba(180,180,180,0.06)":"rgba(100,60,20,0.08)",border:`1px solid ${i===0?"rgba(249,224,75,0.2)":i===1?"rgba(200,200,200,0.1)":"rgba(150,100,50,0.15)"}`,borderRadius:12,padding:"10px 8px",textAlign:"center"}}>
                    <div style={{fontSize:20}}>{i===0?"🥇":i===1?"🥈":"🥉"}</div>
                    <div style={{fontSize:12,fontWeight:800,color:i===0?"#f9e04b":"#e0e0e0",marginTop:4,wordBreak:"break-word"}}>{r.name}</div>
                    <div style={{fontSize:10,color:"#888",marginTop:2}}>{r.partidasW}P · {r.seriesW}S · {r.juegosW}J</div>
                  </div>
                ))}
              </div>

              {/* Tabla */}
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                  <thead>
                    <tr style={{borderBottom:"1px solid rgba(74,222,128,0.2)"}}>
                      <td style={{padding:"7px 4px",color:"#4ade80",fontWeight:700}}>#</td>
                      <td style={{padding:"7px 4px",color:"#4ade80",fontWeight:700}}>Jugador</td>
                      <td style={{padding:"7px 3px",textAlign:"center",color:"#f9e04b",fontWeight:700}} title="Partidas Ganadas">👑</td>
                      <td style={{padding:"7px 3px",textAlign:"center",color:"#f9e04b",fontWeight:700}} title="Series Ganadas">🏆</td>
                      <td style={{padding:"7px 3px",textAlign:"center",color:"#f9e04b",fontWeight:700}} title="Juegos Ganados">JG</td>
                      <td style={{padding:"7px 3px",textAlign:"center",color:"#f9e04b",fontWeight:700}} title="Golden Breaks">🟡</td>
                      <td style={{padding:"7px 3px",textAlign:"center",color:"#4ade80",fontWeight:700}} title="Barridas">🧹</td>
                      {showCR&&<td style={{padding:"7px 3px",textAlign:"center",color:"#4ade80",fontWeight:700}} title="Tiempo promedio CR por ronda">⏱</td>}
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((r,i)=>(
                      <tr key={r.name} style={{borderBottom:"1px solid rgba(255,255,255,0.05)",background:i%2===0?"transparent":"rgba(255,255,255,0.01)"}}>
                        <td style={{padding:"8px 4px",color:i===0?"#f9e04b":i===1?"#ccc":i===2?"#cd7f32":"#555",fontWeight:700}}>{i+1}</td>
                        <td style={{padding:"8px 4px",fontWeight:700,color:"#e0e0e0",whiteSpace:"nowrap"}}>{r.name}</td>
                        <td style={{padding:"8px 3px",textAlign:"center",color:"#4ade80",fontWeight:700}}>{r.partidasW}</td>
                        <td style={{padding:"8px 3px",textAlign:"center",color:"#4ade80",fontWeight:600}}>{r.seriesW}</td>
                        <td style={{padding:"8px 3px",textAlign:"center",color:"#4ade80",fontWeight:600}}>{r.juegosW}</td>
                        <td style={{padding:"8px 3px",textAlign:"center",color:"#4ade80",fontWeight:700}}>{r.goldenBreaks}</td>
                        <td style={{padding:"8px 3px",textAlign:"center",color:"#4ade80",fontWeight:700}}>{r.mesas}</td>
                        {showCR&&<td style={{padding:"8px 3px",textAlign:"center",color:"#888",fontSize:10,fontVariantNumeric:"tabular-nums"}}>{r.crTimes.length>0?fmtTime(r.crTimes.reduce((a,b)=>a+b,0)/r.crTimes.length):"—"}</td>}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:12,fontSize:11,color:"#888"}}>
                <span style={{color:"#4ade80",fontWeight:600}}>👑</span><span>=Partidas</span>
                <span style={{color:"#4ade80",fontWeight:600}}>🏆</span><span>=Series</span>
                <span style={{color:"#4ade80",fontWeight:600}}>JG</span><span>=Juegos</span>
                <span style={{color:"#4ade80",fontWeight:600}}>🟡</span><span>=Golden Break</span>
                <span style={{color:"#4ade80",fontWeight:600}}>🧹</span><span>=Barrida</span>
                {showCR&&<><span style={{color:"#4ade80",fontWeight:600}}>⏱</span><span>=T.prom CR</span></>}
              </div>
            </>)
          }
        </div>
      </div>
    );
  }


  // ===== JUGADORES =====
  if (screen === "players") {
    return (
      <div className="app-screen" style={{background:"radial-gradient(ellipse at 50% 35%,#1a4a1a 0%,#0a1f0a 55%,#060f06 100%)"}}>
        <div className="app-scroll" style={{padding:"20px 18px"}}>
          <button onClick={()=>setScreen("lobby")} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.13)",color:"#ccc",borderRadius:10,padding:"8px 14px",fontSize:13,cursor:"pointer",fontFamily:"inherit",marginBottom:18}}>← Volver</button>
          <div style={{fontSize:22,fontWeight:800,color:"#4ade80",marginBottom:20}}>👥 Jugadores</div>

          {/* Agregar nuevo */}
          <div style={{display:"flex",gap:8,marginBottom:20}}>
            <input
              style={{flex:1,padding:"11px 14px",borderRadius:10,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",fontFamily:"inherit",fontSize:15,outline:"none"}}
              value={newPlayerName} onChange={e=>setNewPlayerName(e.target.value)}
              placeholder="Nombre del jugador"
              onKeyDown={e=>{if(e.key==="Enter"&&newPlayerName.trim()){addPlayerToList(newPlayerName);setNewPlayerName("");}}}
            />
            <button
              onClick={()=>{if(newPlayerName.trim()){addPlayerToList(newPlayerName);setNewPlayerName("");}}}
              style={{padding:"11px 16px",borderRadius:10,background:"linear-gradient(135deg,#166534,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontSize:14,fontWeight:700,cursor:"pointer"}}>
              + Agregar
            </button>
          </div>

          {/* Lista */}
          {playersList.length === 0
            ? <div style={{color:"#444",fontSize:13,textAlign:"center",padding:"30px 0"}}>No hay jugadores guardados aún</div>
            : playersList.map((p,i) => {
              if (editingNameKey===("player:"+i)) return (
                <div key={i} style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
                  <input autoFocus
                    style={{flex:1,padding:"11px 14px",borderRadius:10,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(74,222,128,0.3)",color:"#fff",fontFamily:"inherit",fontSize:14,outline:"none"}}
                    defaultValue={p}
                    onBlur={e=>{const v=e.target.value.trim();if(v&&v!==p)renamePlayer(p,v);setEditingNameKey(null);}}
                    onKeyDown={e=>{if(e.key==="Enter")e.target.blur();if(e.key==="Escape")setEditingNameKey(null);}}
                  />
                  <button onClick={()=>setEditingNameKey(null)} style={{padding:"10px 12px",borderRadius:10,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.13)",color:"#bbb",fontFamily:"inherit",fontSize:12,cursor:"pointer"}}>✕</button>
                </div>
              );
              return (
                <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",borderRadius:12,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",marginBottom:8}}>
                  <span style={{fontSize:15,fontWeight:600,color:"#e0e0e0"}}>🎱 {p}</span>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>setEditingNameKey("player:"+i)}
                      style={{background:"rgba(74,222,128,0.08)",border:"1px solid rgba(74,222,128,0.2)",color:"#4ade80",borderRadius:8,padding:"6px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
                      ✏️ Editar
                    </button>
                    <button onClick={()=>savePlayersList(playersList.filter((_,j)=>j!==i))}
                      style={{background:"rgba(255,80,80,0.12)",border:"1px solid rgba(255,80,80,0.25)",color:"#f87171",borderRadius:8,padding:"6px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
                      Eliminar
                    </button>
                  </div>
                </div>
              );
            })
          }
        </div>
      </div>
    );
  }

  // ===== NUEVA PARTIDA =====
  if (screen === "newMatch") {
    const isCR = wModalidad === "Contrarreloj";
    const validPlayers = wPlayers.filter(p => p.trim());
    const ready = isCR
      ? validPlayers.length >= 2 && wOrder.length === validPlayers.length
      : wP1.trim() && wP2.trim() && wServe;
    return (
      <div className="app-screen" style={{background:"radial-gradient(ellipse at 50% 35%,#1a4a1a 0%,#0a1f0a 55%,#060f06 100%)"}}>
        <div className="app-scroll" style={{padding:"24px 22px"}}>
          <button onClick={()=>setScreen("lobby")} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.11)",color:"#bbb",borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit",marginBottom:16}}>← Volver</button>
          <div style={{fontSize:20,fontWeight:800,color:"#4ade80",marginBottom:18}}>Nueva Partida</div>

          {!isCR ? (<>
            {["Jugador 1","Jugador 2"].map((label,pi) => {
              const val = pi===0?wP1:wP2;
              const setVal = pi===0?setWP1:setWP2;
              return (<React.Fragment key={pi}>
                <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:pi===1?14:0}}>{label}</div>
                <input style={{width:"100%",padding:"11px 14px",borderRadius:10,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",fontFamily:"inherit",fontSize:15,outline:"none",boxSizing:"border-box",marginBottom:6}}
                  value={val} onChange={e=>{setVal(e.target.value);}} placeholder="Escribe o selecciona abajo"
                  onBlur={e=>{if(e.target.value.trim()) addPlayerToList(e.target.value.trim());}}
                />
                {playersList.length>0 && (
                  <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:4}}>
                    {playersList.map((p,i)=>(
                      <button key={i} onClick={()=>setVal(p)}
                        style={{padding:"5px 12px",borderRadius:20,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer",
                          background:val===p?"linear-gradient(135deg,#166534,#4ade80)":"rgba(255,255,255,0.06)",
                          border:val===p?"none":"1px solid rgba(255,255,255,0.11)",
                          color:val===p?"#fff":"#aaa"}}>
                        {p}
                      </button>
                    ))}
                  </div>
                )}
              </React.Fragment>);
            })}
          </>) : (<>
            <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Jugadores</div>
            {wPlayers.map((p,i) => (
              <div key={i} style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
                <div style={{flex:1}}>
                  <input style={{width:"100%",padding:"10px 12px",borderRadius:10,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",fontFamily:"inherit",fontSize:14,outline:"none",boxSizing:"border-box",marginBottom:4}}
                    value={p} onChange={e=>{const n=[...wPlayers];n[i]=e.target.value;setWPlayers(n);setWOrder([]);}}
                    onBlur={e=>{if(e.target.value.trim()) addPlayerToList(e.target.value.trim());}}
                    placeholder={`Jugador ${i+1}`} />
                  {playersList.length>0 && (
                    <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                      {playersList.filter(pl=>!wPlayers.some((wp,wi)=>wp===pl&&wi!==i)).map((pl,pi)=>(
                        <button key={pi} onClick={()=>{const n=[...wPlayers];n[i]=pl;setWPlayers(n);setWOrder([]);addPlayerToList(pl);}}
                          style={{padding:"3px 10px",borderRadius:20,fontFamily:"inherit",fontSize:11,fontWeight:600,cursor:"pointer",
                            background:p===pl?"linear-gradient(135deg,#166534,#4ade80)":"rgba(255,255,255,0.06)",
                            border:p===pl?"none":"1px solid rgba(255,255,255,0.11)",
                            color:p===pl?"#fff":"#aaa"}}>
                          {pl}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
                {wPlayers.length > 2 && <button onClick={()=>{const n=wPlayers.filter((_,j)=>j!==i);setWPlayers(n);setWOrder([]);}} style={{background:"rgba(255,80,80,0.15)",border:"1px solid rgba(255,80,80,0.3)",color:"#f87171",borderRadius:8,padding:"8px 12px",cursor:"pointer",fontSize:14,fontFamily:"inherit"}}>✕</button>}
              </div>
            ))}
            <button onClick={()=>{setWPlayers([...wPlayers,""]);setWOrder([]);}} style={{width:"100%",padding:"9px 0",borderRadius:10,background:"rgba(74,222,128,0.08)",border:"1px solid rgba(74,222,128,0.2)",color:"#4ade80",fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:4}}>+ Agregar jugador</button>
          </>)}

          <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:18}}>Modalidad</div>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            {MODALIDADES.map(mod => {
              const sel = wModalidad === mod;
              return <button key={mod} onClick={()=>setWModalidad(mod)} style={{flex:1,padding:"10px 4px",borderRadius:14,fontFamily:"inherit",fontSize:10,fontWeight:700,cursor:"pointer",background:sel?"linear-gradient(160deg,#1a3a1a,#2d6a2d)":"rgba(255,255,255,0.05)",border:sel?"1px solid rgba(74,222,128,0.5)":"1px solid rgba(255,255,255,0.09)",color:sel?"#fff":"#888",display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
                <BallIcon modalidad={mod} size={30} />{mod}
              </button>;
            })}
          </div>

          {!isCR && (<>
            <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:18}}>Carrera</div>
            <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
              {CARRERAS.map(c => <button key={c} onClick={()=>setWCarrera(c)} style={chip(wCarrera===c)}>{c}</button>)}
            </div>
          </>)}
          {isCR && (<>
            <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:18}}>Número de series</div>
            <div style={{color:"#555",fontSize:10,marginBottom:6}}>Una serie = {wRondasCR} ronda{wRondasCR!==1?"s":""} · Gana el que gane más series</div>
            <div style={{display:"flex",gap:8,marginTop:4,flexWrap:"wrap",marginBottom:6}}>
              {[1,2,3,5,7].map(s => <button key={s} onClick={()=>setWSeriesCR(s)} style={chip(wSeriesCR===s)}>{s}</button>)}
            </div>
            <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:18}}>Rondas por serie</div>
            <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
              {[1,2,3,5,7,10].map(r => <button key={r} onClick={()=>setWRondasCR(r)} style={chip(wRondasCR===r)}>{r}</button>)}
            </div>
            <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:18}}>Penalización por falta (segundos)</div>
            <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
              {[5,10,15,20,30,60].map(s => <button key={s} onClick={()=>setWPenaltyTime(s)} style={chip(wPenaltyTime===s)}>{s}s</button>)}
            </div>
          </>)}

          {!isCR ? (<>
            <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:18}}>Primer saque</div>
            <div style={{display:"flex",gap:12,marginTop:8}}>
              {["p1","p2"].map(k => {
                const name = k==="p1"?(wP1||"Jugador 1"):(wP2||"Jugador 2");
                const sel = wServe===k;
                return <button key={k} onClick={()=>setWServe(k)} style={{flex:1,padding:"13px 8px",borderRadius:12,fontFamily:"inherit",fontSize:14,fontWeight:700,cursor:"pointer",background:sel?"linear-gradient(135deg,#166534,#4ade80)":"rgba(255,255,255,0.06)",border:sel?"none":"1px solid rgba(255,255,255,0.11)",color:sel?"#fff":"#999"}}>{name}</button>;
              })}
            </div>
          </>) : (<>
            <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:8,marginTop:18}}>Orden de turnos</div>
            <div style={{color:"#555",fontSize:11,marginBottom:8}}>Toca los jugadores en el orden que van a jugar</div>
            {(()=>{
              const valid = wPlayers.map((p,i)=>({p,i})).filter(({p})=>p.trim());
              return (<>
                <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:10}}>
                  {valid.map(({p,i}) => {
                    const pos = wOrder.indexOf(i);
                    const sel = pos >= 0;
                    return <button key={i} onClick={()=>{
                      if(sel){setWOrder(wOrder.filter(x=>x!==i));}
                      else{setWOrder([...wOrder,i]);}
                    }} style={{padding:"10px 16px",borderRadius:10,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",background:sel?"linear-gradient(135deg,#166534,#4ade80)":"rgba(255,255,255,0.06)",border:sel?"none":"1px solid rgba(255,255,255,0.11)",color:sel?"#fff":"#999",position:"relative"}}>
                      {sel && <span style={{position:"absolute",top:-6,right:-6,background:"#f9e04b",color:"#000",borderRadius:"50%",width:18,height:18,fontSize:11,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>{pos+1}</span>}
                      {p}
                    </button>;
                  })}
                </div>
                {wOrder.length > 0 && <div style={{fontSize:11,color:"#4ade80",marginBottom:4}}>Orden: {wOrder.map(i=>wPlayers[i]).join(" → ")}</div>}
              </>);
            })()}
          </>)}

          <div style={{display:"flex",gap:12,marginTop:20}}>
            <button style={{flex:1,padding:"14px 0",borderRadius:10,background:"linear-gradient(135deg,#166534,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontSize:15,fontWeight:700,cursor:"pointer",opacity:ready?1:0.4}} onClick={startNewMatch} disabled={!ready}>Iniciar</button>
            <button style={{padding:"14px 16px",borderRadius:10,background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.11)",color:"#aaa",fontFamily:"inherit",fontSize:14,cursor:"pointer"}} onClick={()=>{
              const pj = sessionStorage.getItem("pendingJornadaId");
              if(pj){setJornadaScreen(pj);}else{setScreen("lobby");}
            }}>Cancelar</button>
          </div>
        </div>
      </div>
    );
  }

  // ===== PARTIDA =====
  if (!activeMatch) { setScreen("lobby"); return null; }
  const isReadOnly = activeMatch.matchClosed;
  const {p1Name, p2Name, currentServe, wins, carrera, modalidad, games, seriesFinished, seriesWinner, seriesWins, seriesCount, seriesHistory} = activeMatch;

  const CELL_W=44, CELL_H=130, NAM_W=290, HDR_H=18;
  const BORDER="2px solid rgba(255,255,255,0.22)";
  const BORDER_THIN="1px solid rgba(255,255,255,0.11)";
  const totalJuegos = carrera*2-1;
  const sw1 = seriesWins.p1+(seriesFinished&&seriesWinner==="p1"?1:0);
  const sw2 = seriesWins.p2+(seriesFinished&&seriesWinner==="p2"?1:0);

  const handleCellClick = (k, ji, ballType) => {
    const gameRecord = games[ji];
    const hasWon = gameRecord && gameRecord.winner === k;
    const isLastGame = ji === games.length-1;
    const isNext = !seriesFinished && ji === games.length;
    const bt = ballType || "normal";
    if (isNext) {
      const newWins = {...wins, [k]: wins[k]+1};
      const nextServe = currentServe==="p1"?"p2":"p1";
      const willFinish = newWins[k] >= carrera;
      updateMatch(activeId, m => ({...m, wins:newWins, games:[...m.games,{winner:k,serve:currentServe,ballType:bt}], currentServe:nextServe, seriesFinished:willFinish, seriesWinner:willFinish?k:null}));
      // Marcar turno anotado si la partida pertenece a una jornada activa
      if (jornadaScreen && jornadaScreen!=="list") {
        saveJornadas(jornadas.map(j => j.id===jornadaScreen && j.turnStarted ? {...j, turnScored:true} : j));
        // Marcar en la partida que ya se anotó en este turno
        updateMatch(activeId, mm => ({...mm, jornadaTurnScored:true}));
      }
    } else if (hasWon && isLastGame) {
      updateMatch(activeId, m => {
        if (m.games.length===0) return m;
        const last = m.games[m.games.length-1];
        return {...m, games:m.games.slice(0,-1), wins:{...m.wins,[last.winner]:m.wins[last.winner]-1}, currentServe:last.serve, seriesFinished:false, seriesWinner:null};
      });
    }
    setBallMenu(null);
  };

  const handleCellLongPress = (k, ji) => {
    const isNext = !seriesFinished && ji === games.length;
    if (isNext && !isReadOnly) setBallMenu({k, ji});
  };

  return (
    <div className="app-screen" style={{background:"radial-gradient(ellipse at 50% 35%,#1a4a1a 0%,#0a1f0a 55%,#060f06 100%)"}}>

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px 8px",borderBottom:"1px solid rgba(255,255,255,0.07)",background:"rgba(0,0,0,0.4)"}}>
        <button onClick={()=>setScreen("lobby")} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.11)",color:"#bbb",borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Inicio</button>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <BallIcon modalidad={modalidad} size={26} />
          <div style={{fontSize:9,color:"#777",letterSpacing:1,textTransform:"uppercase"}}>{modalidad} - C{carrera} - S#{seriesCount}</div>
        </div>
        <button onClick={()=>setShowHistory(true)} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.11)",color:"#bbb",borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Hist.</button>
      </div>

      {/* Series bar */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 16px",background:"rgba(0,0,0,0.45)",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
          <span style={{fontSize:11,color:"#888",fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,maxWidth:85,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p1Name}</span>
          <span style={{fontSize:30,fontWeight:900,lineHeight:1,color:sw1>sw2?"#f9e04b":"#fff"}}>{sw1}</span>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
          <div style={{fontSize:8,letterSpacing:2,color:"#4ade80",textTransform:"uppercase"}}>SERIES</div>
          <div style={{fontSize:18,color:"#333",fontWeight:700}}>-</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1,flexDirection:"row-reverse"}}>
          <span style={{fontSize:11,color:"#888",fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,maxWidth:85,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p2Name}</span>
          <span style={{fontSize:30,fontWeight:900,lineHeight:1,color:sw2>sw1?"#f9e04b":"#fff"}}>{sw2}</span>
        </div>
      </div>

      {/* Banner */}
      {seriesFinished
        ? <div style={{textAlign:"center",padding:"7px 0",background:"rgba(249,224,75,0.08)",borderBottom:"1px solid rgba(249,224,75,0.18)",color:"#ddd",fontSize:13,fontWeight:600}}>Serie #{seriesCount} - Ganó: <strong style={{color:"#f9e04b"}}>{seriesWinner==="p1"?p1Name:p2Name}</strong></div>
        : <div style={{textAlign:"center",padding:"6px 0",background:"rgba(249,224,75,0.04)",borderBottom:"1px solid rgba(249,224,75,0.08)",color:"#bbb",fontSize:13}}>Saque: <strong style={{color:"#f9e04b"}}>{currentServe==="p1"?p1Name:p2Name}</strong></div>
      }

      {/* Cuadrícula */}
      <div style={{flex:1,display:"flex",flexDirection:"column",padding:"6px 0",overflow:"hidden"}}>
        <div style={{display:"flex",overflow:"hidden"}}>
          <div style={{flexShrink:0,borderRight:BORDER}}>
            <div style={{height:HDR_H}} />
            {["p1","p2"].map((k,ri) => {
              const sw=k==="p1"?sw1:sw2, name=k==="p1"?p1Name:p2Name;
              const tFS=sw<=5?24:sw<=10?21:sw<=15?18:15;
              return <div key={k} style={{width:NAM_W,height:CELL_H,borderBottom:ri===0?BORDER:"none",background:"rgba(0,0,0,0.25)",display:"flex",flexDirection:"column",alignItems:"flex-start",justifyContent:"flex-start",padding:"8px 8px 6px",overflow:"hidden",boxSizing:"border-box"}}>
                <div style={{fontSize:26,fontWeight:800,color:"#e0e0e0",lineHeight:1.15,width:"100%",wordBreak:"break-word",flexShrink:0,marginBottom:6}}>{name}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:1,width:"100%",overflow:"hidden"}}>
                  {Array.from({length:sw},(_,i)=><span key={i} style={{fontSize:tFS,lineHeight:1.1}}>&#127942;</span>)}
                </div>
              </div>;
            })}
          </div>
          <div style={{flex:1,overflowX:"auto"}}>
            <div style={{minWidth:"max-content"}}>
              <div style={{display:"flex",height:HDR_H}}>
                {Array.from({length:totalJuegos},(_,ji)=><div key={ji} style={{width:CELL_W,textAlign:"center",fontSize:10,color:"#666",fontWeight:700,lineHeight:HDR_H+"px"}}>{ji+1}</div>)}
              </div>
              {["p1","p2"].map((k,ri)=>(
                <div key={k} style={{display:"flex",borderBottom:ri===0?BORDER:"none"}}>
                  {Array.from({length:totalJuegos},(_,ji)=>{
                    const gr=games[ji], hasWon=gr&&gr.winner===k;
                    const isLastGame=ji===games.length-1;
                    const isNext=!seriesFinished&&ji===games.length;
                    const isSaque=isNext&&currentServe===k;
                    // En jornada: bloqueado si no es el turno activo; o si ya se anotó victoria en este turno (turnScored) solo permitir modificar el juego actual
                    // Solo bloquear nuevas victorias (isNext), nunca deshacer (hasWon&&isLastGame)
                    const jornadaBlockNew = jornadaBlocked;
                    const jornadaBlockCell = isNext ? jornadaBlockNew : false;
                    const clickable=!isReadOnly&&!jornadaBlockCell&&(isNext||(hasWon&&isLastGame));
                    let pressTimer = null; let longPressed = false;
                    const onPressStart = () => { longPressed=false; if(isNext&&!isReadOnly&&!jornadaBlockCell) pressTimer = setTimeout(()=>{ longPressed=true; handleCellLongPress(k,ji); }, 600); };
                    const onPressEnd = () => { clearTimeout(pressTimer); };
                    return <div key={ji}
                       onClick={()=>{ if(!longPressed) { clickable&&handleCellClick(k,ji); } longPressed=false; }}
                      onMouseDown={onPressStart} onMouseUp={onPressEnd} onMouseLeave={onPressEnd}
                       onTouchStart={onPressStart} onTouchEnd={()=>{ onPressEnd(); }}
                      style={{width:CELL_W,height:CELL_H,borderRight:BORDER_THIN,display:"flex",alignItems:"center",justifyContent:"center",background:isNext?"rgba(255,255,255,0.04)":"rgba(255,255,255,0.02)",position:"relative",cursor:clickable?"pointer":"default",boxShadow:(seriesFinished&&hasWon&&isLastGame)?"inset 0 0 0 2px rgba(249,115,22,0.5)":"none"}}>
                       {hasWon && (gr.ballType==="gold" ? <SpecialBall type="gold" size={28}/> : gr.ballType==="diamond" ? <SpecialBall type="diamond" size={28}/> : <BallIcon modalidad={modalidad} size={28}/>)}
                      {isSaque && <div style={{position:"absolute",top:4,left:4}}><CueBallSaque size={16} /></div>}
                    </div>;
                  })}
                </div>
              ))}
            </div>
          </div>
        </div>
        <div style={{height:1,background:"rgba(255,255,255,0.06)",margin:"8px 0"}} />
        <div style={{fontSize:10,color:seriesFinished?"#f97316":"#555",textAlign:"center",paddingBottom:2}}>
          {seriesFinished?"Toca la última bola para deshacer - o presiona Siguiente serie":"Toca una casilla para asignar o quitar victoria"}
        </div>
      </div>

      {/* Menú de selección de bola */}
      {ballMenu && (
        <div style={{position:"fixed",inset:0,zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.7)"}} onClick={()=>setBallMenu(null)}>
          <div style={{background:"#0f2010",border:"1px solid rgba(74,222,128,0.3)",borderRadius:20,padding:"20px 24px",textAlign:"center"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:13,color:"#888",marginBottom:16}}>Elige el tipo de bola</div>
            <div style={{display:"flex",gap:16,justifyContent:"center"}}>
              <div onClick={()=>handleCellClick(ballMenu.k,ballMenu.ji,"normal")} style={{cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
                <BallIcon modalidad={modalidad} size={44}/>
                <div style={{fontSize:11,color:"#aaa"}}>Normal</div>
              </div>
              <div onClick={()=>handleCellClick(ballMenu.k,ballMenu.ji,"gold")} style={{cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
                <SpecialBall type="gold" size={44}/>
                <div style={{fontSize:11,color:"#f5c400"}}>Dorada</div>
              </div>
              <div onClick={()=>handleCellClick(ballMenu.k,ballMenu.ji,"diamond")} style={{cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
                <SpecialBall type="diamond" size={44}/>
                <div style={{fontSize:11,color:"#a8d8ff"}}>Barrida</div>
              </div>
            </div>
            <button onClick={()=>setBallMenu(null)} style={{marginTop:16,padding:"8px 24px",borderRadius:10,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",color:"#aaa",fontFamily:"inherit",fontSize:13,cursor:"pointer"}}>Cancelar</button>
          </div>
        </div>
      )}

      {/* Footer */}
      <div style={{display:"flex",gap:8,padding:"10px 14px",borderTop:"1px solid rgba(255,255,255,0.05)",background:"rgba(0,0,0,0.32)",alignItems:"center"}}>
        {!isReadOnly && seriesFinished
          ? <button style={{flex:2,fontSize:13,padding:"12px 0",borderRadius:14,background:"linear-gradient(135deg,#166534,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontWeight:800,cursor:"pointer"}} onClick={startNewSeries}>Siguiente serie</button>
          : <div style={{flex:2}} />
        }
        {!isReadOnly && <button style={{padding:"11px 14px",borderRadius:12,background:"rgba(255,80,80,0.12)",border:"1px solid rgba(255,80,80,0.28)",color:"#f87171",fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}} onClick={()=>setShowCloseMatch(true)}>Terminar</button>}
      </div>

      {/* Modal terminar */}
      {showCloseMatch && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{background:"#0f2010",border:"1px solid rgba(74,222,128,0.16)",borderRadius:20,padding:"22px 20px",textAlign:"center",color:"#fff",width:300}}>
            <div style={{fontSize:16,fontWeight:700,marginBottom:10,color:"#e0e0e0"}}>¿Terminar esta partida?</div>
            <div style={{fontSize:13,color:"#aaa",marginBottom:14}}>{p1Name} vs {p2Name} - {modalidad}</div>
            <div style={{display:"flex",gap:10,justifyContent:"center"}}>
              <button style={{padding:"11px 20px",borderRadius:10,background:"rgba(255,80,80,0.12)",border:"1px solid rgba(255,80,80,0.28)",color:"#f87171",fontFamily:"inherit",fontSize:14,fontWeight:700,cursor:"pointer"}} onClick={closeMatch}>Confirmar</button>
              <button style={{padding:"10px 20px",borderRadius:10,background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.11)",color:"#aaa",fontFamily:"inherit",fontSize:14,cursor:"pointer"}} onClick={()=>setShowCloseMatch(false)}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {/* Modal historial editable */}
      {showHistory && activeMatch && activeMatch.modalidad === "Contrarreloj" && (()=>{
        const hm = activeMatch;
        const players = hm.crPlayers||[];
        const order = hm.crOrder||[];
        const roundHistory = hm.crRoundHistory||[];
        const accumTime = hm.crAccumTime||{};
        const validRoundsH = hm.crValidRounds||{};
        const serieWinsH = hm.crSerieWins||{};
        const serieHistoryH = hm.crSerieHistory||[];
        const totalSeriesH = hm.crTotalSeries||1;
        // Sumar rondas de TODAS las series (solo serieHistory, sin duplicar crRoundWins)
        const allRWH = {};
        serieHistoryH.forEach(s => {
          Object.entries(s.roundWins||{}).forEach(([k,v])=>{ allRWH[Number(k)]=(allRWH[Number(k)]||0)+v; });
        });
        // Solo agregar crRoundWins si la partida está en curso (última serie no guardada aún)
        if (serieHistoryH.length < (hm.crTotalSeries||1)) {
          Object.entries(hm.crRoundWins||{}).forEach(([k,v])=>{ allRWH[Number(k)]=(allRWH[Number(k)]||0)+v; });
        }
        const roundWins = allRWH;
        // Promedio: solo rondas válidas (sin forfeit)
        const avgTime = (pidx) => validRoundsH[pidx]>0 ? (accumTime[pidx]||0)/validRoundsH[pidx] : Infinity;
        const standings = [...order].sort((a,b)=>{
          const sw=(serieWinsH[b]||0)-(serieWinsH[a]||0); if(sw!==0) return sw;
          const rw=(roundWins[b]||0)-(roundWins[a]||0); if(rw!==0) return rw;
          return avgTime(a)-avgTime(b);
        });
        return (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:100,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"20px 10px"}}>
            <div style={{background:"#0f2010",border:"1px solid rgba(74,222,128,0.18)",borderRadius:20,padding:"20px 16px",color:"#fff",width:"100%",maxWidth:420}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <div style={{fontSize:15,fontWeight:700}}>Historial · Contrarreloj</div>
                <button onClick={()=>setShowHistory(false)} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",color:"#aaa",borderRadius:8,padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✕</button>
              </div>
              {/* Clasificación general */}
              <div style={{fontSize:11,color:"#4ade80",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Clasificación</div>
              {standings.map((pidx,pos)=>(
                <div key={pidx} style={{display:"flex",justifyContent:"space-between",padding:"7px 10px",borderRadius:9,background:pos===0?"rgba(249,224,75,0.08)":"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",marginBottom:5}}>
                  <span style={{fontWeight:700,color:pos===0?"#f9e04b":"#e0e0e0"}}>{pos===0?"👑":pos===1?"🥈":"🥉"} {pos+1}. {players[pidx]}</span>
                  <div style={{textAlign:"right"}}><div style={{fontSize:12,color:"#f9e04b",fontWeight:700}}>{serieWinsH[pidx]||0}/{totalSeriesH} series</div><div style={{fontSize:11,color:"#888"}}>{roundWins[pidx]||0} rondas · {validRoundsH[pidx]>0?fmtTime(avgTime(pidx))+" prom":"—"}</div></div>
                </div>
              ))}
              {/* Tabla de rondas */}
              {roundHistory.length>0 && (<>
                <div style={{fontSize:11,color:"#4ade80",letterSpacing:1,textTransform:"uppercase",margin:"14px 0 8px"}}>Resultados por ronda</div>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                    <thead>
                      <tr>
                        <td style={{padding:"5px 8px",color:"#555",fontWeight:700}}></td>
                        {roundHistory.map((r,ri)=>{
                          const sIdx = Math.floor(ri/(hm.crTotalRounds||1));
                          const rIdx = ri%(hm.crTotalRounds||1);
                          return <td key={r.round} style={{padding:"4px 4px",textAlign:"center",color:"#4ade80",fontWeight:700,borderLeft:rIdx===0?"1px solid rgba(74,222,128,0.2)":"none",fontSize:10}}>S{sIdx+1}·R{rIdx+1}</td>;
                        })}
                        <td style={{padding:"4px 4px",textAlign:"center",color:"#f9e04b",fontWeight:700,borderLeft:"1px solid rgba(74,222,128,0.2)"}}>🏆S</td>
                        <td style={{padding:"4px 4px",textAlign:"center",color:"#888",fontWeight:700}}>Prom</td>
                      </tr>
                    </thead>
                    <tbody>
                      {order.map(pidx=>(
                        <tr key={pidx} style={{borderTop:"1px solid rgba(255,255,255,0.06)"}}>
                          <td style={{padding:"6px 8px",fontWeight:700,color:"#e0e0e0",whiteSpace:"nowrap"}}>{players[pidx]}</td>
                          {roundHistory.map(r=>{
                            const isW=r.winner===pidx;
                            const t=r.times[pidx];
                            const isF=(r.forfeits||[]).includes(pidx);
                            const riIdx = roundHistory.indexOf(r)%(hm.crTotalRounds||1);
                            return <td key={r.round} style={{padding:"4px 4px",textAlign:"center",
                              borderLeft:riIdx===0?"1px solid rgba(74,222,128,0.15)":"none",
                              background:isW?"rgba(249,224,75,0.1)":isF?"rgba(239,68,68,0.08)":"transparent",
                              color:isW?"#f9e04b":isF?"#f87171":"#888",
                              fontWeight:isW?700:400,fontVariantNumeric:"tabular-nums",fontSize:10}}>
                              {t!==undefined?fmtTime(t):"—"}{isW?" 🏆":""}{isF?" ⚠":""}
                            </td>;
                          })}
                          <td style={{padding:"5px 4px",textAlign:"center",color:"#f9e04b",fontWeight:700,borderLeft:"1px solid rgba(74,222,128,0.15)"}}>{serieWinsH[pidx]||0}</td>
                          <td style={{padding:"6px 8px",textAlign:"center",color:"#888",fontVariantNumeric:"tabular-nums"}}>{accumTime[pidx]?fmtTime(accumTime[pidx]):"—"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </>)}
              <button onClick={()=>setShowHistory(false)} style={{width:"100%",marginTop:16,padding:"12px 0",borderRadius:12,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#bbb",fontFamily:"inherit",fontSize:14,fontWeight:600,cursor:"pointer"}}>Cerrar</button>
            </div>
          </div>
        );
      })()}

      {showHistory && activeMatch && activeMatch.modalidad !== "Contrarreloj" && (
        <HistorialEditable
          p1Name={p1Name} p2Name={p2Name}
          modalidad={modalidad} carrera={carrera}
          seriesHistory={seriesHistory} seriesWins={seriesWins}
          games={games} seriesCount={seriesCount}
          seriesFinished={seriesFinished} seriesWinner={seriesWinner}
          matchClosed={isReadOnly}
          onClose={()=>setShowHistory(false)}
          onEditCurrentGame={(ji, k) => {
            updateMatch(activeId, m => {
              const ng = m.games.map((g,i) => i===ji ? {...g, winner:k} : g);
              const nw = {p1:0, p2:0};
              ng.forEach(g => nw[g.winner]++);
              const sf = nw.p1>=m.carrera||nw.p2>=m.carrera;
              const sw = nw.p1>=m.carrera?"p1":nw.p2>=m.carrera?"p2":null;
              return {...m, games:ng, wins:nw, seriesFinished:sf, seriesWinner:sw};
            });
          }}
          onDeleteLastSeries={() => {
            updateMatch(activeId, m => {
              if (m.seriesHistory.length===0) return m;
              const last = m.seriesHistory[m.seriesHistory.length-1];
              const nh = m.seriesHistory.slice(0,-1);
              const nsw = {p1:0,p2:0};
              nh.forEach(s => { if(s.winner&&!s.partial) nsw[s.winner]++; });
              return {...m, seriesHistory:nh, seriesWins:nsw, seriesCount:last.seriesNum,
                games:last.games||[], wins:{p1:last.p1wins,p2:last.p2wins},
                seriesFinished:true, seriesWinner:last.winner};
            });
          }}
          onEditHistoryGame={(si, ji, k, fallback) => {
            updateMatch(activeId, m => {
              const nh = m.seriesHistory.map((ser,idx) => {
                if(idx!==si) return ser;
                const bg = ser.games||fallback;
                const ng = bg.map((g,i) => i===ji ? {...g,winner:k} : g);
                const p1 = ng.filter(g=>g.winner==="p1").length;
                const p2 = ng.filter(g=>g.winner==="p2").length;
                const nw = p1>=m.carrera?"p1":p2>=m.carrera?"p2":ser.winner;
                return {...ser,games:ng,p1wins:p1,p2wins:p2,winner:nw};
              });
              const nsw = {p1:0,p2:0};
              nh.forEach(s => { if(s.winner&&!s.partial) nsw[s.winner]++; });
              return {...m, seriesHistory:nh, seriesWins:nsw};
            });
          }}
          onRestoreLastSeries={(lastSerie, lastGames) => {
            updateMatch(activeId, m => {
              const nh = m.seriesHistory.slice(0,-1);
              const nsw = {p1:0,p2:0};
              nh.forEach(s => { if(s.winner&&!s.partial) nsw[s.winner]++; });
              const rg = lastSerie.games||lastGames;
              const rw = {p1:rg.filter(g=>g.winner==="p1").length, p2:rg.filter(g=>g.winner==="p2").length};
              const lg = rg[rg.length-1];
              const ns = lg?(lg.serve==="p1"?"p2":"p1"):m.firstServe;
              return {...m, seriesHistory:nh, seriesWins:nsw, seriesCount:lastSerie.seriesNum,
                games:rg, wins:rw, currentServe:ns, seriesFinished:false, seriesWinner:null};
            });
            setShowHistory(false);
          }}
          onReactivar={() => {
            updateMatch(activeId, m => ({...m, matchClosed:false, closedAt:null}));
            setShowHistory(false);
          }}
        />
      )}
    </div>
  );
}

function HistorialEditable({p1Name, p2Name, modalidad, carrera, seriesHistory, seriesWins,
  games, seriesCount, seriesFinished, seriesWinner, matchClosed,
  onClose, onEditCurrentGame, onDeleteLastSeries, onEditHistoryGame, onRestoreLastSeries, onRestoreAnySeries, onReactivar}) {

  const sw = seriesWins||{p1:0,p2:0};
  const d1 = sw.p1+(seriesFinished&&seriesWinner==="p1"?1:0);
  const d2 = sw.p2+(seriesFinished&&seriesWinner==="p2"?1:0);
  const CELL_W=38, CELL_H=60, NAM_W=90;
  const BORDER="1px solid rgba(255,255,255,0.15)";
  const BORDER_THIN="1px solid rgba(255,255,255,0.08)";
  const totalJuegos = carrera*2-1;

  const MiniGrid = ({gamesData, isEditable, onToggle, p1wins, p2wins}) => (
    <div style={{overflowX:"auto",marginTop:6}}>
      <div style={{display:"flex",minWidth:"max-content"}}>
        <div style={{flexShrink:0,borderRight:BORDER}}>
          <div style={{height:16}}/>
          {["p1","p2"].map((k,ri)=>{
            const sw=k==="p1"?p1wins:p2wins;
            const trophyFS=sw<=5?22:sw<=10?19:sw<=15?16:13;
            return <div key={k} style={{width:NAM_W,height:CELL_H,borderBottom:ri===0?BORDER:"none",background:"rgba(0,0,0,0.3)",display:"flex",flexDirection:"column",alignItems:"flex-start",justifyContent:"flex-start",padding:"8px 8px 6px",overflow:"hidden",boxSizing:"border-box"}}>
              <div style={{fontSize:24,fontWeight:800,color:"#e0e0e0",lineHeight:1.2,wordBreak:"break-word",marginBottom:5}}>{k==="p1"?p1Name:p2Name}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:1}}>
                {Array.from({length:sw},(_,i)=><span key={i} style={{fontSize:trophyFS,lineHeight:1.1}}>&#127942;</span>)}
              </div>
            </div>;
          })}
        </div>
        <div style={{flex:1,overflowX:"auto"}}>
          <div style={{minWidth:"max-content"}}>
            <div style={{display:"flex",height:16}}>
              {Array.from({length:totalJuegos},(_,ji)=><div key={ji} style={{width:CELL_W,textAlign:"center",fontSize:9,color:"#555",fontWeight:700,lineHeight:"16px"}}>{ji+1}</div>)}
            </div>
            {["p1","p2"].map((k,ri)=>(
              <div key={k} style={{display:"flex",borderBottom:ri===0?BORDER:"none"}}>
                {Array.from({length:totalJuegos},(_,ji)=>{
                  const g=gamesData?gamesData[ji]:null;
                  const hasWon=g&&g.winner===k;
                  const clickable=isEditable&&g;
                  return <div key={ji} onClick={()=>clickable&&onToggle(ji,k)}
                    style={{width:CELL_W,height:CELL_H,borderRight:BORDER_THIN,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,0.01)",cursor:clickable?"pointer":"default"}}>
                    {hasWon&&(g.ballType==="gold"?<SpecialBall type="gold" size={22}/>:g.ballType==="diamond"?<SpecialBall type="diamond" size={22}/>:<BallIcon modalidad={modalidad} size={22}/>)}
                  </div>;
                })}
              </div>
            ))}
          </div>
        </div>
      </div>
      {isEditable&&<div style={{fontSize:9,color:"#555",marginTop:4,textAlign:"center"}}>Toca una bola para cambiar el ganador</div>}
    </div>
  );

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:100,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"20px 10px"}}>
      <div style={{background:"#0f2010",border:"1px solid rgba(74,222,128,0.18)",borderRadius:20,padding:"20px 16px",color:"#fff",width:"100%",maxWidth:380}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div style={{fontSize:15,fontWeight:700,color:"#e0e0e0"}}>Historial</div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",color:"#aaa",borderRadius:8,padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✕</button>
        </div>

        {/* Resumen general de la partida */}
        <div style={{background:"rgba(0,0,0,0.3)",border:"1px solid rgba(74,222,128,0.15)",borderRadius:14,padding:"14px 12px",marginBottom:14}}>
          {/* Nombres y bola */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
            <div style={{fontSize:18,fontWeight:900,color:"#fff",flex:1}}>{p1Name}</div>
            <BallIcon modalidad={modalidad} size={32}/>
            <div style={{fontSize:18,fontWeight:900,color:"#fff",flex:1,textAlign:"right"}}>{p2Name}</div>
          </div>
          {/* Trofeos y marcador */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(0,0,0,0.2)",borderRadius:10,padding:"8px 10px"}}>
            <div style={{display:"flex",flexWrap:"wrap",gap:2,flex:1}}>
              {Array.from({length:d1},(_,i)=><span key={i} style={{fontSize:16}}>🏆</span>)}
            </div>
            <div style={{fontSize:28,fontWeight:900,padding:"0 10px",textAlign:"center",letterSpacing:2}}>
              <span style={{color:d1>d2?"#f9e04b":"#fff"}}>{d1}</span>
