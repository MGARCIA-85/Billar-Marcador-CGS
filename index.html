<script>
  var _splashStart = Date.now();
  var _minTime = 2500; // mínimo 2.5 segundos visible
  function _hideSplash() {
    var s = document.getElementById('splash');
    if (s) { s.style.opacity='0'; setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 700); }
  }
  var _splashCheck = setInterval(function() {
    var root = document.getElementById('root');
    if (root && root.children.length > 0) {
      clearInterval(_splashCheck);
      var elapsed = Date.now() - _splashStart;
      var wait = Math.max(0, _minTime - elapsed);
      setTimeout(_hideSplash, wait);
    }
  }, 150);
  // Máximo 10 segundos
  setTimeout(function() { clearInterval(_splashCheck); _hideSplash(); }, 10000);
</script>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// Firebase
firebase.initializeApp({
  apiKey: "AIzaSyBvIZaGoMLL7YmLdz0j7dKxvwoxWj-Yw7s",
  authDomain: "billar-marcadorcgs.firebaseapp.com",
  projectId: "billar-marcadorcgs",
  storageBucket: "billar-marcadorcgs.firebasestorage.app",
  messagingSenderId: "390194364006",
  appId: "1:390194364006:web:4c1ee811253423f77437a7"
});
const db = firebase.firestore();

const uid = () => Math.random().toString(36).slice(2, 8);
const MODALIDADES = ["Bola 7", "Bola 8", "Bola 9", "Bola 10"];
const CARRERAS = [3, 5, 7, 9, 11, 15];
const BALL_COLORS = {
  "Bola 7":  { bg: "#a8230a", num: "7" },
  "Bola 8":  { bg: "#1a1a1a", num: "8" },
  "Bola 9":  { bg: "#f5c400", num: "9" },
  "Bola 10": { bg: "#1a6ec7", num: "10" },
};

function BallIcon({ modalidad, size = 38 }) {
  const b = BALL_COLORS[modalidad]; if (!b) return null;
  const r = size / 2;
  const fs = size < 32 ? 9 : size < 44 ? 11 : 13;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
      <circle cx={r} cy={r+1.5} r={r-1} fill="rgba(0,0,0,0.35)" />
      <circle cx={r} cy={r} r={r-1} fill={b.bg} />
      <ellipse cx={r*0.65} cy={r*0.52} rx={r*0.28} ry={r*0.18} fill="rgba(255,255,255,0.35)" />
      <circle cx={r} cy={r} r={r*0.38} fill="white" />
      <text x={r} y={r+fs*0.38} textAnchor="middle" fontSize={fs} fontWeight="bold" fill="#222" fontFamily="Arial,sans-serif">{b.num}</text>
    </svg>
  );
}

function CueBallSaque({ size }) {
  const r = size / 2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={r} cy={r} r={r-0.5} fill="#f0ede0" />
      <circle cx={r*0.65} cy={r*0.78} r={r*0.13} fill="#bb1f00" />
      <circle cx={r*1.12} cy={r*0.62} r={r*0.11} fill="#bb1f00" />
      <circle cx={r*0.88} cy={r*1.15} r={r*0.12} fill="#bb1f00" />
    </svg>
  );
}

function createMatch(p1, p2, firstServe, carrera, modalidad) {
  return {
    id: uid(), p1Name: p1, p2Name: p2, firstServe,
    carrera, modalidad, games: [], currentServe: firstServe,
    wins: {p1:0, p2:0}, seriesFinished: false, seriesWinner: null,
    seriesHistory: [], seriesWins: {p1:0, p2:0}, seriesCount: 1,
    matchClosed: false, closedAt: null, createdAt: Date.now(),
  };
}

function formatDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const dias = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return dias[d.getDay()] + " " + d.getDate() + " " + meses[d.getMonth()] + " " + d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
}

function Acceso({ ok }) {
  const [c, setC] = useState("");
  const [err, setErr] = useState(false);
  const [loading, setLoading] = useState(false);

  const go = async () => {
    if (!c.trim()) return;
    setLoading(true);
    try {
      const snap = await db.collection("config").doc("acceso").get();
      if (snap.exists && snap.data().codigo === c.trim()) {
        localStorage.setItem("bg","1"); ok();
      } else { setErr(true); setTimeout(()=>setErr(false),2000); }
    } catch(e) { setErr(true); setTimeout(()=>setErr(false),2000); }
    setLoading(false);
  };

  return (
    <div style={{minHeight:"100vh",background:"radial-gradient(ellipse at 50% 35%,#1a4a1a,#0a1f0a)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{fontSize:11,color:"#c9a227",letterSpacing:4,textTransform:"uppercase"}}>Billares</div>
      <div style={{fontSize:34,fontWeight:900,color:"#fff",letterSpacing:2,lineHeight:1,marginBottom:6}}>García</div>
      <div style={{fontSize:10,color:"#3a6a3a",letterSpacing:2,marginBottom:36}}>Control de partidas</div>
      <div style={{width:"100%",maxWidth:300}}>
        <input type="password" value={c} onChange={e=>setC(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&!loading&&go()} placeholder="Código de acceso" autoFocus
          style={{width:"100%",padding:"13px 16px",borderRadius:12,background:err?"rgba(255,80,80,0.1)":"rgba(255,255,255,0.07)",border:err?"1px solid rgba(255,80,80,0.5)":"1px solid rgba(255,255,255,0.15)",color:"#fff",fontFamily:"inherit",fontSize:16,outline:"none",textAlign:"center",letterSpacing:4,boxSizing:"border-box"}}/>
        {err && <div style={{color:"#f87171",fontSize:12,textAlign:"center",marginTop:6}}>Código incorrecto</div>}
        <button onClick={go} disabled={loading}
          style={{marginTop:12,width:"100%",padding:"13px 0",borderRadius:12,background:"linear-gradient(135deg,#166534,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontSize:15,fontWeight:800,cursor:"pointer",opacity:loading?0.7:1}}>
          {loading?"Verificando...":"Entrar"}
        </button>
      </div>
    </div>
  );
}

function BillarApp() {
  const [matches, setMatches] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [screen, setScreen] = useState("lobby");
  const [wP1, setWP1] = useState("");
  const [wP2, setWP2] = useState("");
  const [wServe, setWServe] = useState(null);
  const [wCarrera, setWCarrera] = useState(5);
  const [wModalidad, setWModalidad] = useState("Bola 8");
  const [showHistory, setShowHistory] = useState(false);
  const [showCloseMatch, setShowCloseMatch] = useState(false);
  const [lobbyTab, setLobbyTab] = useState("active");

  useEffect(() => {
    const unsub = db.collection("billar").doc("partidas").onSnapshot(snap => {
      if (snap.exists) { const d = snap.data(); if (d && d.matches) setMatches(d.matches); }
    });
    return () => unsub();
  }, []);

  const saveMatches = async (nm) => {
    setMatches(nm);
    try { await db.collection("billar").doc("partidas").set({matches: nm}); }
    catch(e) { console.error("Error Firebase:", e); }
  };

  const updateMatch = (id, fn) => {
    setMatches(prev => {
      const nm = prev.map(m => m.id === id ? fn(m) : m);
      db.collection("billar").doc("partidas").set({matches: nm}).catch(e => console.error(e));
      return nm;
    });
  };

  const activeMatch = matches.find(m => m.id === activeId);

  const startNewMatch = () => {
    if (!wP1.trim() || !wP2.trim() || !wServe) return;
    const m = createMatch(wP1.trim(), wP2.trim(), wServe, wCarrera, wModalidad);
    saveMatches([...matches, m]);
    setActiveId(m.id); setScreen("match");
    setWP1(""); setWP2(""); setWServe(null); setWCarrera(5); setWModalidad("Bola 8");
  };

  const startNewSeries = () => {
    updateMatch(activeId, m => {
      const sw = m.seriesWinner;
      return {
        ...m,
        seriesHistory: [...m.seriesHistory, {winner:sw, p1wins:m.wins.p1, p2wins:m.wins.p2, seriesNum:m.seriesCount, games:[...m.games]}],
        seriesWins: {...m.seriesWins, [sw]: m.seriesWins[sw]+1},
        seriesCount: m.seriesCount+1,
        games: [], wins: {p1:0, p2:0},
        seriesFinished: false, seriesWinner: null,
      };
    });
  };

  const closeMatch = () => {
    setShowCloseMatch(false);
    updateMatch(activeId, m => {
      const finalSeriesWins = m.seriesFinished
        ? {...m.seriesWins, [m.seriesWinner]: m.seriesWins[m.seriesWinner]+1}
        : m.seriesWins;
      return {...m, matchClosed:true, closedAt:Date.now(), seriesWins:finalSeriesWins};
    });
    setScreen("lobby");
  };

  const deleteMatch = async (id) => {
    const nm = matches.filter(m => m.id !== id);
    await saveMatches(nm);
    if (activeId === id) { setActiveId(null); setScreen("lobby"); }
  };

  const replayMatch = (m) => {
    setWP1(m.p1Name); setWP2(m.p2Name);
    setWCarrera(m.carrera); setWModalidad(m.modalidad);
    setWServe(null); setScreen("newMatch");
  };

  const activeMatches = matches.filter(m => !m.matchClosed).sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
  const closedMatches = matches.filter(m => m.matchClosed).sort((a,b) => (b.closedAt||b.createdAt||0)-(a.closedAt||a.createdAt||0));

  const chip = (sel) => ({
    padding:"8px 14px", borderRadius:20, fontFamily:"inherit", fontSize:13, fontWeight:600,
    cursor:"pointer", background:sel?"linear-gradient(135deg,#166534,#4ade80)":"rgba(255,255,255,0.05)",
    border:sel?"none":"1px solid rgba(255,255,255,0.1)", color:sel?"#fff":"#999",
    boxShadow:sel?"0 3px 10px rgba(74,222,128,0.28)":"none"
  });

  // ===== LOBBY =====
  if (screen === "lobby") {
    const list = lobbyTab === "active" ? activeMatches : closedMatches;
    return (
      <div className="app-screen" style={{background:"radial-gradient(ellipse at 50% 35%,#1a4a1a 0%,#0a1f0a 55%,#060f06 100%)"}}>
        <div style={{padding:"24px 20px 0",position:"relative",zIndex:10}}>
          <div style={{fontSize:24,fontWeight:800,color:"#4ade80",letterSpacing:1}}>Billares García</div>
          <div style={{fontSize:11,color:"#555",marginTop:1}}>Control de partidas</div>
        </div>
        <div style={{display:"flex",padding:"12px 16px 0",gap:8}}>
          {["active","closed"].map(tab => (
            <button key={tab} onClick={()=>setLobbyTab(tab)} style={{flex:1,padding:"9px 0",borderRadius:"10px 10px 0 0",border:lobbyTab===tab?"1px solid rgba(74,222,128,0.25)":"1px solid rgba(255,255,255,0.07)",borderBottom:"none",background:lobbyTab===tab?"rgba(74,222,128,0.1)":"rgba(255,255,255,0.04)",color:lobbyTab===tab?"#4ade80":"#777",fontFamily:"inherit",fontSize:13,fontWeight:600,cursor:"pointer"}}>
              {tab==="active"?"En juego":"Terminadas"}
              {tab==="active" && activeMatches.length > 0 && <span style={{background:"#4ade80",color:"#0a1f0a",borderRadius:20,padding:"1px 7px",fontSize:11,fontWeight:800,marginLeft:6}}>{activeMatches.length}</span>}
            </button>
          ))}
        </div>
        <div className="app-scroll" style={{padding:"0 14px"}}>
          {list.length === 0 && <div style={{color:"#444",textAlign:"center",marginTop:60,fontSize:14}}>{lobbyTab==="active"?"No hay partidas en juego.":"No hay partidas terminadas."}</div>}
          {list.map(m => <LobbyCard key={m.id} m={m} onOpen={()=>{setActiveId(m.id);setScreen("match");}} onDelete={()=>deleteMatch(m.id)} onReplay={replayMatch} />)}
        </div>
        <div style={{padding:"14px 18px"}}>
          <button style={{width:"100%",padding:"14px 0",borderRadius:14,background:"linear-gradient(135deg,#166534,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontSize:15,fontWeight:800,cursor:"pointer"}} onClick={()=>setScreen("newMatch")}>+ Nueva Partida</button>
        </div>
      </div>
    );
  }

  // ===== NUEVA PARTIDA =====
  if (screen === "newMatch") {
    const ready = wP1.trim() && wP2.trim() && wServe;
    return (
      <div className="app-screen" style={{background:"radial-gradient(ellipse at 50% 35%,#1a4a1a 0%,#0a1f0a 55%,#060f06 100%)"}}>
        <div className="app-scroll" style={{padding:"24px 22px"}}>
          <button onClick={()=>setScreen("lobby")} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.11)",color:"#bbb",borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit",marginBottom:16}}>← Volver</button>
          <div style={{fontSize:20,fontWeight:800,color:"#4ade80",marginBottom:18}}>Nueva Partida</div>

          <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Jugador 1</div>
          <input style={{width:"100%",padding:"11px 14px",borderRadius:10,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",fontFamily:"inherit",fontSize:15,outline:"none",boxSizing:"border-box"}} value={wP1} onChange={e=>setWP1(e.target.value)} placeholder="Ej: César" />
          <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:14}}>Jugador 2</div>
          <input style={{width:"100%",padding:"11px 14px",borderRadius:10,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",fontFamily:"inherit",fontSize:15,outline:"none",boxSizing:"border-box"}} value={wP2} onChange={e=>setWP2(e.target.value)} placeholder="Ej: Walker" />

          <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:18}}>Modalidad</div>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            {MODALIDADES.map(mod => {
              const sel = wModalidad === mod;
              return <button key={mod} onClick={()=>setWModalidad(mod)} style={{flex:1,padding:"10px 4px",borderRadius:14,fontFamily:"inherit",fontSize:10,fontWeight:700,cursor:"pointer",background:sel?"linear-gradient(160deg,#1a3a1a,#2d6a2d)":"rgba(255,255,255,0.05)",border:sel?"1px solid rgba(74,222,128,0.5)":"1px solid rgba(255,255,255,0.09)",color:sel?"#fff":"#888",display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
                <BallIcon modalidad={mod} size={30} />{mod}
              </button>;
            })}
          </div>

          <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:18}}>Carrera</div>
          <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
            {CARRERAS.map(c => <button key={c} onClick={()=>setWCarrera(c)} style={chip(wCarrera===c)}>{c}</button>)}
          </div>

          <div style={{color:"#666",fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:6,marginTop:18}}>Primer saque</div>
          <div style={{display:"flex",gap:12,marginTop:8}}>
            {["p1","p2"].map(k => {
              const name = k==="p1"?(wP1||"Jugador 1"):(wP2||"Jugador 2");
              const sel = wServe===k;
              return <button key={k} onClick={()=>setWServe(k)} style={{flex:1,padding:"13px 8px",borderRadius:12,fontFamily:"inherit",fontSize:14,fontWeight:700,cursor:"pointer",background:sel?"linear-gradient(135deg,#166534,#4ade80)":"rgba(255,255,255,0.06)",border:sel?"none":"1px solid rgba(255,255,255,0.11)",color:sel?"#fff":"#999"}}>{name}</button>;
            })}
          </div>

          <div style={{display:"flex",gap:12,marginTop:20}}>
            <button style={{flex:1,padding:"14px 0",borderRadius:10,background:"linear-gradient(135deg,#166534,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontSize:15,fontWeight:700,cursor:"pointer",opacity:ready?1:0.4}} onClick={startNewMatch} disabled={!ready}>Iniciar</button>
            <button style={{padding:"14px 16px",borderRadius:10,background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.11)",color:"#aaa",fontFamily:"inherit",fontSize:14,cursor:"pointer"}} onClick={()=>setScreen("lobby")}>Cancelar</button>
          </div>
        </div>
      </div>
    );
  }

  // ===== PARTIDA =====
  if (!activeMatch) { setScreen("lobby"); return null; }
  const isReadOnly = activeMatch.matchClosed;
  const {p1Name, p2Name, currentServe, wins, carrera, modalidad, games, seriesFinished, seriesWinner, seriesWins, seriesCount, seriesHistory} = activeMatch;

  const CELL_W=44, CELL_H=100, NAM_W=155, HDR_H=18;
  const BORDER="2px solid rgba(255,255,255,0.22)";
  const BORDER_THIN="1px solid rgba(255,255,255,0.11)";
  const totalJuegos = carrera*2-1;
  const sw1 = seriesWins.p1+(seriesFinished&&seriesWinner==="p1"?1:0);
  const sw2 = seriesWins.p2+(seriesFinished&&seriesWinner==="p2"?1:0);

  const handleCellClick = (k, ji) => {
    const gameRecord = games[ji];
    const hasWon = gameRecord && gameRecord.winner === k;
    const isLastGame = ji === games.length-1;
    const isNext = !seriesFinished && ji === games.length;
    if (isNext) {
      const newWins = {...wins, [k]: wins[k]+1};
      const nextServe = currentServe==="p1"?"p2":"p1";
      const willFinish = newWins[k] >= carrera;
      updateMatch(activeId, m => ({...m, wins:newWins, games:[...m.games,{winner:k,serve:currentServe}], currentServe:nextServe, seriesFinished:willFinish, seriesWinner:willFinish?k:null}));
    } else if (hasWon && isLastGame) {
      updateMatch(activeId, m => {
        if (m.games.length===0) return m;
        const last = m.games[m.games.length-1];
        return {...m, games:m.games.slice(0,-1), wins:{...m.wins,[last.winner]:m.wins[last.winner]-1}, currentServe:last.serve, seriesFinished:false, seriesWinner:null};
      });
    }
  };

  return (
    <div className="app-screen" style={{background:"radial-gradient(ellipse at 50% 35%,#1a4a1a 0%,#0a1f0a 55%,#060f06 100%)"}}>

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px 8px",borderBottom:"1px solid rgba(255,255,255,0.07)",background:"rgba(0,0,0,0.4)"}}>
        <button onClick={()=>setScreen("lobby")} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.11)",color:"#bbb",borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Inicio</button>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <BallIcon modalidad={modalidad} size={26} />
          <div style={{fontSize:9,color:"#777",letterSpacing:1,textTransform:"uppercase"}}>{modalidad} - C{carrera} - S#{seriesCount}</div>
        </div>
        <button onClick={()=>setShowHistory(true)} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.11)",color:"#bbb",borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Hist.</button>
      </div>

      {/* Series bar */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 16px",background:"rgba(0,0,0,0.45)",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
          <span style={{fontSize:11,color:"#888",fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,maxWidth:85,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p1Name}</span>
          <span style={{fontSize:30,fontWeight:900,lineHeight:1,color:sw1>sw2?"#f9e04b":"#fff"}}>{sw1}</span>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
          <div style={{fontSize:8,letterSpacing:2,color:"#4ade80",textTransform:"uppercase"}}>SERIES</div>
          <div style={{fontSize:18,color:"#333",fontWeight:700}}>-</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1,flexDirection:"row-reverse"}}>
          <span style={{fontSize:11,color:"#888",fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,maxWidth:85,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p2Name}</span>
          <span style={{fontSize:30,fontWeight:900,lineHeight:1,color:sw2>sw1?"#f9e04b":"#fff"}}>{sw2}</span>
        </div>
      </div>

      {/* Banner */}
      {seriesFinished
        ? <div style={{textAlign:"center",padding:"7px 0",background:"rgba(249,224,75,0.08)",borderBottom:"1px solid rgba(249,224,75,0.18)",color:"#ddd",fontSize:13,fontWeight:600}}>Serie #{seriesCount} - Ganó: <strong style={{color:"#f9e04b"}}>{seriesWinner==="p1"?p1Name:p2Name}</strong></div>
        : <div style={{textAlign:"center",padding:"6px 0",background:"rgba(249,224,75,0.04)",borderBottom:"1px solid rgba(249,224,75,0.08)",color:"#bbb",fontSize:13}}>Saque: <strong style={{color:"#f9e04b"}}>{currentServe==="p1"?p1Name:p2Name}</strong></div>
      }

      {/* Cuadrícula */}
      <div style={{flex:1,display:"flex",flexDirection:"column",padding:"6px 0",overflow:"hidden"}}>
        <div style={{display:"flex",overflow:"hidden"}}>
          <div style={{flexShrink:0,borderRight:BORDER}}>
            <div style={{height:HDR_H}} />
            {["p1","p2"].map((k,ri) => {
              const sw=k==="p1"?sw1:sw2, name=k==="p1"?p1Name:p2Name;
              const tFS=sw<=5?16:sw<=10?15:sw<=15?13:11;
              return <div key={k} style={{width:NAM_W,height:CELL_H,borderBottom:ri===0?BORDER:"none",background:"rgba(0,0,0,0.25)",display:"flex",flexDirection:"column",alignItems:"flex-start",justifyContent:"flex-start",padding:"8px 8px 6px",overflow:"hidden",boxSizing:"border-box"}}>
                <div style={{fontSize:18,fontWeight:800,color:"#e0e0e0",lineHeight:1.15,width:"100%",wordBreak:"break-word",flexShrink:0,marginBottom:5}}>{name}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:1,width:"100%",overflow:"hidden"}}>
                  {Array.from({length:sw},(_,i)=><span key={i} style={{fontSize:tFS,lineHeight:1.1}}>&#127942;</span>)}
                </div>
              </div>;
            })}
          </div>
          <div style={{flex:1,overflowX:"auto"}}>
            <div style={{minWidth:"max-content"}}>
              <div style={{display:"flex",height:HDR_H}}>
                {Array.from({length:totalJuegos},(_,ji)=><div key={ji} style={{width:CELL_W,textAlign:"center",fontSize:10,color:"#666",fontWeight:700,lineHeight:HDR_H+"px"}}>{ji+1}</div>)}
              </div>
              {["p1","p2"].map((k,ri)=>(
                <div key={k} style={{display:"flex",borderBottom:ri===0?BORDER:"none"}}>
                  {Array.from({length:totalJuegos},(_,ji)=>{
                    const gr=games[ji], hasWon=gr&&gr.winner===k;
                    const isLastGame=ji===games.length-1;
                    const isNext=!seriesFinished&&ji===games.length;
                    const isSaque=isNext&&currentServe===k;
                    const clickable=!isReadOnly&&(isNext||(hasWon&&isLastGame));
                    return <div key={ji} onClick={()=>clickable&&handleCellClick(k,ji)} style={{width:CELL_W,height:CELL_H,borderRight:BORDER_THIN,display:"flex",alignItems:"center",justifyContent:"center",background:isNext?"rgba(255,255,255,0.04)":"rgba(255,255,255,0.02)",position:"relative",cursor:clickable?"pointer":"default",boxShadow:(seriesFinished&&hasWon&&isLastGame)?"inset 0 0 0 2px rgba(249,115,22,0.5)":"none"}}>
                      {hasWon && <BallIcon modalidad={modalidad} size={28} />}
                      {isSaque && <div style={{position:"absolute",top:4,left:4}}><CueBallSaque size={16} /></div>}
                    </div>;
                  })}
                </div>
              ))}
            </div>
          </div>
        </div>
        <div style={{height:1,background:"rgba(255,255,255,0.06)",margin:"8px 0"}} />
        <div style={{fontSize:10,color:seriesFinished?"#f97316":"#555",textAlign:"center",paddingBottom:2}}>
          {seriesFinished?"Toca la última bola para deshacer - o presiona Siguiente serie":"Toca una casilla para asignar o quitar victoria"}
        </div>
      </div>

      {/* Footer */}
      <div style={{display:"flex",gap:8,padding:"10px 14px",borderTop:"1px solid rgba(255,255,255,0.05)",background:"rgba(0,0,0,0.32)",alignItems:"center"}}>
        {!isReadOnly && seriesFinished
          ? <button style={{flex:2,fontSize:13,padding:"12px 0",borderRadius:14,background:"linear-gradient(135deg,#166534,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontWeight:800,cursor:"pointer"}} onClick={startNewSeries}>Siguiente serie</button>
          : <div style={{flex:2}} />
        }
        {!isReadOnly && <button style={{padding:"11px 14px",borderRadius:12,background:"rgba(255,80,80,0.12)",border:"1px solid rgba(255,80,80,0.28)",color:"#f87171",fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}} onClick={()=>setShowCloseMatch(true)}>Terminar</button>}
      </div>

      {/* Modal terminar */}
      {showCloseMatch && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{background:"#0f2010",border:"1px solid rgba(74,222,128,0.16)",borderRadius:20,padding:"22px 20px",textAlign:"center",color:"#fff",width:300}}>
            <div style={{fontSize:16,fontWeight:700,marginBottom:10,color:"#e0e0e0"}}>¿Terminar esta partida?</div>
            <div style={{fontSize:13,color:"#aaa",marginBottom:14}}>{p1Name} vs {p2Name} - {modalidad}</div>
            <div style={{display:"flex",gap:10,justifyContent:"center"}}>
              <button style={{padding:"11px 20px",borderRadius:10,background:"rgba(255,80,80,0.12)",border:"1px solid rgba(255,80,80,0.28)",color:"#f87171",fontFamily:"inherit",fontSize:14,fontWeight:700,cursor:"pointer"}} onClick={closeMatch}>Confirmar</button>
              <button style={{padding:"10px 20px",borderRadius:10,background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.11)",color:"#aaa",fontFamily:"inherit",fontSize:14,cursor:"pointer"}} onClick={()=>setShowCloseMatch(false)}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {/* Modal historial editable */}
      {showHistory && (
        <HistorialEditable
          p1Name={p1Name} p2Name={p2Name}
          modalidad={modalidad} carrera={carrera}
          seriesHistory={seriesHistory} seriesWins={seriesWins}
          games={games} seriesCount={seriesCount}
          seriesFinished={seriesFinished} seriesWinner={seriesWinner}
          matchClosed={isReadOnly}
          onClose={()=>setShowHistory(false)}
          onEditCurrentGame={(ji, k) => {
            updateMatch(activeId, m => {
              const ng = m.games.map((g,i) => i===ji ? {...g, winner:k} : g);
              const nw = {p1:0, p2:0};
              ng.forEach(g => nw[g.winner]++);
              const sf = nw.p1>=m.carrera||nw.p2>=m.carrera;
              const sw = nw.p1>=m.carrera?"p1":nw.p2>=m.carrera?"p2":null;
              return {...m, games:ng, wins:nw, seriesFinished:sf, seriesWinner:sw};
            });
          }}
          onDeleteLastSeries={() => {
            updateMatch(activeId, m => {
              if (m.seriesHistory.length===0) return m;
              const last = m.seriesHistory[m.seriesHistory.length-1];
              const nh = m.seriesHistory.slice(0,-1);
              const nsw = {p1:0,p2:0};
              nh.forEach(s => { if(s.winner&&!s.partial) nsw[s.winner]++; });
              return {...m, seriesHistory:nh, seriesWins:nsw, seriesCount:last.seriesNum,
                games:last.games||[], wins:{p1:last.p1wins,p2:last.p2wins},
                seriesFinished:true, seriesWinner:last.winner};
            });
          }}
          onEditHistoryGame={(si, ji, k, fallback) => {
            updateMatch(activeId, m => {
              const nh = m.seriesHistory.map((ser,idx) => {
                if(idx!==si) return ser;
                const bg = ser.games||fallback;
                const ng = bg.map((g,i) => i===ji ? {...g,winner:k} : g);
                const p1 = ng.filter(g=>g.winner==="p1").length;
                const p2 = ng.filter(g=>g.winner==="p2").length;
                const nw = p1>=m.carrera?"p1":p2>=m.carrera?"p2":ser.winner;
                return {...ser,games:ng,p1wins:p1,p2wins:p2,winner:nw};
              });
              const nsw = {p1:0,p2:0};
              nh.forEach(s => { if(s.winner&&!s.partial) nsw[s.winner]++; });
              return {...m, seriesHistory:nh, seriesWins:nsw};
            });
          }}
          onRestoreLastSeries={(lastSerie, lastGames) => {
            updateMatch(activeId, m => {
              const nh = m.seriesHistory.slice(0,-1);
              const nsw = {p1:0,p2:0};
              nh.forEach(s => { if(s.winner&&!s.partial) nsw[s.winner]++; });
              const rg = lastSerie.games||lastGames;
              const rw = {p1:rg.filter(g=>g.winner==="p1").length, p2:rg.filter(g=>g.winner==="p2").length};
              const lg = rg[rg.length-1];
              const ns = lg?(lg.serve==="p1"?"p2":"p1"):m.firstServe;
              return {...m, seriesHistory:nh, seriesWins:nsw, seriesCount:lastSerie.seriesNum,
                games:rg, wins:rw, currentServe:ns, seriesFinished:false, seriesWinner:null};
            });
            setShowHistory(false);
          }}
          onReactivar={() => {
            updateMatch(activeId, m => ({...m, matchClosed:false, closedAt:null}));
            setShowHistory(false);
          }}
        />
      )}
    </div>
  );
}

function HistorialEditable({p1Name, p2Name, modalidad, carrera, seriesHistory, seriesWins,
  games, seriesCount, seriesFinished, seriesWinner, matchClosed,
  onClose, onEditCurrentGame, onDeleteLastSeries, onEditHistoryGame, onRestoreLastSeries, onReactivar}) {

  const sw = seriesWins||{p1:0,p2:0};
  const d1 = sw.p1+(seriesFinished&&seriesWinner==="p1"?1:0);
  const d2 = sw.p2+(seriesFinished&&seriesWinner==="p2"?1:0);
  const CELL_W=38, CELL_H=60, NAM_W=90;
  const BORDER="1px solid rgba(255,255,255,0.15)";
  const BORDER_THIN="1px solid rgba(255,255,255,0.08)";
  const totalJuegos = carrera*2-1;

  const MiniGrid = ({gamesData, isEditable, onToggle, p1wins, p2wins}) => (
    <div style={{overflowX:"auto",marginTop:6}}>
      <div style={{display:"flex",minWidth:"max-content"}}>
        <div style={{flexShrink:0,borderRight:BORDER}}>
          <div style={{height:16}}/>
          {["p1","p2"].map((k,ri)=>{
            const sw=k==="p1"?p1wins:p2wins;
            return <div key={k} style={{width:NAM_W,height:CELL_H,borderBottom:ri===0?BORDER:"none",background:"rgba(0,0,0,0.3)",display:"flex",flexDirection:"column",alignItems:"flex-start",justifyContent:"flex-start",padding:"5px",overflow:"hidden",boxSizing:"border-box"}}>
              <div style={{fontSize:12,fontWeight:800,color:"#e0e0e0",lineHeight:1.2,wordBreak:"break-word",marginBottom:3}}>{k==="p1"?p1Name:p2Name}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:1}}>
                {Array.from({length:sw},(_,i)=><span key={i} style={{fontSize:12,lineHeight:1}}>&#127942;</span>)}
              </div>
            </div>;
          })}
        </div>
        <div style={{flex:1,overflowX:"auto"}}>
          <div style={{minWidth:"max-content"}}>
            <div style={{display:"flex",height:16}}>
              {Array.from({length:totalJuegos},(_,ji)=><div key={ji} style={{width:CELL_W,textAlign:"center",fontSize:9,color:"#555",fontWeight:700,lineHeight:"16px"}}>{ji+1}</div>)}
            </div>
            {["p1","p2"].map((k,ri)=>(
              <div key={k} style={{display:"flex",borderBottom:ri===0?BORDER:"none"}}>
                {Array.from({length:totalJuegos},(_,ji)=>{
                  const g=gamesData?gamesData[ji]:null;
                  const hasWon=g&&g.winner===k;
                  const clickable=isEditable&&g;
                  return <div key={ji} onClick={()=>clickable&&onToggle(ji,k)}
                    style={{width:CELL_W,height:CELL_H,borderRight:BORDER_THIN,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,0.01)",cursor:clickable?"pointer":"default"}}>
                    {hasWon&&<BallIcon modalidad={modalidad} size={22}/>}
                  </div>;
                })}
              </div>
            ))}
          </div>
        </div>
      </div>
      {isEditable&&<div style={{fontSize:9,color:"#555",marginTop:4,textAlign:"center"}}>Toca una bola para cambiar el ganador</div>}
    </div>
  );

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:100,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"20px 10px"}}>
      <div style={{background:"#0f2010",border:"1px solid rgba(74,222,128,0.18)",borderRadius:20,padding:"20px 16px",color:"#fff",width:"100%",maxWidth:380}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
          <div style={{fontSize:15,fontWeight:700,color:"#e0e0e0"}}>Historial</div>
          <div style={{fontSize:20,fontWeight:800,color:"#4ade80"}}>{d1} - {d2}</div>
        </div>
        <div style={{fontSize:10,color:"#f9e04b",letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>
          Última serie #{seriesCount} — {seriesFinished?"Concluida":"Inconclusa"}
        </div>
        {(games||[]).length===0
          ? <div style={{color:"#555",fontSize:12,marginBottom:12}}>Sin juegos registrados</div>
          : <MiniGrid gamesData={games||[]} isEditable={false} p1wins={0} p2wins={0} onToggle={(ji,k)=>onEditCurrentGame(ji,k)}/>
        }

        {(seriesHistory||[]).length>0&&<>
          <div style={{fontSize:10,color:"#4ade80",letterSpacing:1,textTransform:"uppercase",margin:"14px 0 8px"}}>Series completadas</div>
          {(seriesHistory||[]).map((s,i)=>{
           {(seriesHistory||[]).map((s,i)=>{
             const isLast=i===seriesHistory.length-1;
             const fakeGames=s.games||[
               ...Array.from({length:s.p1wins},()=>({winner:"p1"})),
               ...Array.from({length:s.p2wins},()=>({winner:"p2"})),
             ];
             const incompleta = s.p1wins<carrera && s.p2wins<carrera;
             return (
               <div key={i} style={{background:isLast?"rgba(255,255,255,0.04)":"rgba(0,0,0,0.15)",border:isLast?"1px solid rgba(74,222,128,0.2)":"1px solid rgba(255,255,255,0.06)",borderRadius:10,padding:"8px 10px",marginBottom:6}}>
                 <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}}>
                   <span style={{color:"#556",fontSize:11}}>Serie #{s.seriesNum}{s.partial?" *":""}</span>
                 </div>
                 {/* Resumen visual cuando no es editable */}
                 {(!isLast || matchClosed) && (
                   <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                     <div style={{flex:1}}>
                       <div style={{fontSize:11,color:s.p1wins>s.p2wins?"#4ade80":"#666",marginBottom:4,fontWeight:s.p1wins>s.p2wins?700:400}}>{s.p1wins>s.p2wins?"🏆 ":""}{p1Name}</div>
                       <div style={{display:"flex",flexWrap:"wrap",gap:2}}>
                         {Array.from({length:s.p1wins},(_,j)=><BallIcon key={j} modalidad={modalidad} size={20}/>)}
                         {s.p1wins===0 && <span style={{fontSize:11,color:"#444"}}>—</span>}
                       </div>
                     </div>
                     <div style={{fontSize:14,fontWeight:900,padding:"0 10px",textAlign:"center"}}>
                       <span style={{color:s.p1wins>s.p2wins?"#4ade80":"#555"}}>{s.p1wins}</span>
                       <span style={{color:"#333",margin:"0 4px"}}>-</span>
                       <span style={{color:s.p2wins>s.p1wins?"#4ade80":"#555"}}>{s.p2wins}</span>
                     </div>
                     <div style={{flex:1,textAlign:"right"}}>
                       <div style={{fontSize:11,color:s.p2wins>s.p1wins?"#4ade80":"#666",marginBottom:4,textAlign:"right",fontWeight:s.p2wins>s.p1wins?700:400}}>{p2Name}{s.p2wins>s.p1wins?" 🏆":""}</div>
                       <div style={{display:"flex",flexWrap:"wrap",gap:2,justifyContent:"flex-end"}}>
                         {Array.from({length:s.p2wins},(_,j)=><BallIcon key={j} modalidad={modalidad} size={20}/>)}
                         {s.p2wins===0 && <span style={{fontSize:11,color:"#444"}}>—</span>}
                       </div>
                     </div>
                   </div>
                 )}
                 {/* MiniGrid editable solo para última serie en partidas activas */}
                 {isLast && !matchClosed && (
                   <>
                     <MiniGrid
                       gamesData={fakeGames}
                       isEditable={true}
                       p1wins={s.winner==="p1"?1:0}
                       p2wins={s.winner==="p2"?1:0}
                       onToggle={(ji,k)=>onEditHistoryGame(i,ji,k,fakeGames)}
                     />
                     {incompleta && (
                       <button onClick={()=>{onRestoreLastSeries(s,fakeGames);}}
                         style={{marginTop:6,width:"100%",padding:"8px 0",borderRadius:8,background:"linear-gradient(135deg,#166534,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                         ▶ Continuar esta serie
                       </button>
                     )}
                     <button onClick={onDeleteLastSeries}
                       style={{marginTop:6,width:"100%",padding:"6px 0",borderRadius:8,background:"rgba(255,80,80,0.1)",border:"1px solid rgba(255,80,80,0.22)",color:"#f87171",fontFamily:"inherit",fontSize:11,cursor:"pointer"}}>
                       Eliminar esta serie del historial
                     </button>
                   </>
                 )}
               </div>
             );
           })}
          })}
        </>}

        {matchClosed && (
          <button onClick={onReactivar}
            style={{marginTop:8,width:"100%",padding:"12px 0",borderRadius:10,background:"linear-gradient(135deg,#166534,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontSize:14,fontWeight:800,cursor:"pointer"}}>
            &#9654; Reactivar partida
          </button>
        )}
        <button style={{marginTop:8,width:"100%",padding:"12px 0",borderRadius:12,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#ccc",fontFamily:"inherit",fontSize:14,fontWeight:700,cursor:"pointer"}} onClick={onClose}>Cerrar</button>
      </div>
    </div>
  );
}


function LobbyCard({m, onOpen, onDelete, onReplay}) {
  const isOpen = !m.matchClosed;
  const sw1 = m.seriesWins.p1+(m.seriesFinished&&m.seriesWinner==="p1"?1:0);
  const sw2 = m.seriesWins.p2+(m.seriesFinished&&m.seriesWinner==="p2"?1:0);
  const hasInconclusa = m.wins && (m.wins.p1>0||m.wins.p2>0) && !m.seriesFinished;

  return (
    <div onClick={onOpen} style={{display:"flex",flexDirection:"column",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:"10px 12px",marginBottom:10,cursor:"pointer",opacity:isOpen?1:0.95}}>

      {/* Fila 1: Fecha + estado + borrar */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
        <div style={{fontSize:11,color:"#4a7a4a",fontWeight:600,letterSpacing:0.5}}>
          &#128337; {formatDate(m.createdAt)}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <div style={{fontSize:9,color:isOpen?"#4ade80":"#888",background:isOpen?"rgba(74,222,128,0.1)":"rgba(255,255,255,0.05)",border:isOpen?"1px solid rgba(74,222,128,0.22)":"none",borderRadius:20,padding:"2px 7px",fontWeight:700}}>{isOpen?"EN JUEGO":"FIN"}</div>
          <button style={{background:"rgba(255,80,80,0.1)",border:"1px solid rgba(255,80,80,0.2)",color:"#f87171",borderRadius:8,padding:"3px 7px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}} onClick={e=>{e.stopPropagation();onDelete();}}>x</button>
        </div>
      </div>

      {/* Fila 2: Nombre vs Nombre + bola en centro */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <div style={{fontSize:14,fontWeight:800,color:"#e8e8e8",flex:1}}>{m.p1Name}</div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1,padding:"0 8px"}}>
          <BallIcon modalidad={m.modalidad} size={28}/>
          <div style={{fontSize:11,color:"#4ade80",fontWeight:700,marginTop:2}}>{m.modalidad}</div>
          <div style={{fontSize:9,color:"#666"}}>Carrera {m.carrera}</div>
        </div>
        <div style={{fontSize:14,fontWeight:800,color:"#e8e8e8",flex:1,textAlign:"right"}}>{m.p2Name}</div>
      </div>

      {/* Fila 3: Marcador con trofeos */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 10px",background:"rgba(0,0,0,0.2)",borderRadius:10,marginBottom:hasInconclusa?6:0}}>
        <div style={{display:"flex",flexWrap:"wrap",gap:2,flex:1}}>
          {sw1>0 ? Array.from({length:sw1},(_,i)=><span key={i} style={{fontSize:15}}>&#127942;</span>) : <span style={{fontSize:11,color:"#444"}}>—</span>}
        </div>
        <div style={{fontSize:20,fontWeight:900,padding:"0 10px",minWidth:60,textAlign:"center"}}>
          <span style={{color:sw1>sw2?"#4ade80":sw1<sw2?"#aaa":"#888"}}>{sw1}</span>
          <span style={{color:"#444"}}> - </span>
          <span style={{color:sw2>sw1?"#4ade80":sw2<sw1?"#aaa":"#888"}}>{sw2}</span>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:2,flex:1,justifyContent:"flex-end"}}>
          {sw2>0 ? Array.from({length:sw2},(_,i)=><span key={i} style={{fontSize:15}}>&#127942;</span>) : <span style={{fontSize:11,color:"#444",textAlign:"right",width:"100%"}}>—</span>}
        </div>
      </div>

      {/* Fila 4: Serie inconclusa */}
      {hasInconclusa && (
        <div style={{padding:"5px 10px",background:"rgba(249,224,75,0.05)",border:"1px solid rgba(249,224,75,0.12)",borderRadius:8,marginBottom:4}}>
          <div style={{fontSize:10,color:"#a08030",fontWeight:600,marginBottom:3}}>Serie inconclusa</div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",gap:3}}>
              {m.wins.p1>0 ? Array.from({length:m.wins.p1},(_,i)=><BallIcon key={i} modalidad={m.modalidad} size={18}/>) : <span style={{fontSize:11,color:"#444"}}>—</span>}
            </div>
            <div style={{fontSize:11,color:"#555",fontWeight:700,padding:"0 8px"}}>vs</div>
            <div style={{display:"flex",gap:3,justifyContent:"flex-end"}}>
              {m.wins.p2>0 ? Array.from({length:m.wins.p2},(_,i)=><BallIcon key={i} modalidad={m.modalidad} size={18}/>) : <span style={{fontSize:11,color:"#444"}}>—</span>}
            </div>
          </div>
        </div>
      )}

      {!isOpen && (
        <button style={{marginTop:8,width:"100%",padding:"8px 0",borderRadius:10,background:"linear-gradient(135deg,#166534,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={e=>{e.stopPropagation();onReplay(m);}}>Volver a jugar</button>
      )}
    </div>
  );
}

function App() {
  const [ok, setOk] = useState(()=>!!localStorage.getItem("bg"));
  if (!ok) return <Acceso ok={()=>setOk(true)} />;
  return <BillarApp />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
