function BallIcon({ modalidad, size = 38 }) {
  if (modalidad === "Contrarreloj") {
    return <span style={{fontSize:size*0.85,lineHeight:1,flexShrink:0}}>⏱</span>;
  }
  const b = BALL_COLORS[modalidad]; if (!b) return null;
  const r = size / 2;
  const fs = size < 32 ? 9 : size < 44 ? 11 : 13;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
      <circle cx={r} cy={r+1.5} r={r-1} fill="rgba(0,0,0,0.35)" />
      <circle cx={r} cy={r} r={r-1} fill={b.bg} />
      <ellipse cx={r*0.65} cy={r*0.52} rx={r*0.28} ry={r*0.18} fill="rgba(255,255,255,0.35)" />
      <circle cx={r} cy={r} r={r*0.38} fill="white" />
      <text x={r} y={r+fs*0.38} textAnchor="middle" fontSize={fs} fontWeight="bold" fill="#222" fontFamily="Arial,sans-serif">{b.num}</text>
    </svg>
  );
}

function CueBallSaque({ size }) {
  const r = size / 2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={r} cy={r} r={r-0.5} fill="#f0ede0" />
      <circle cx={r*0.65} cy={r*0.78} r={r*0.13} fill="#bb1f00" />
      <circle cx={r*1.12} cy={r*0.62} r={r*0.11} fill="#bb1f00" />
      <circle cx={r*0.88} cy={r*1.15} r={r*0.12} fill="#bb1f00" />
    </svg>
  );
}

function createMatch(p1, p2, firstServe, carrera, modalidad, extraData={}) {
  return {
    id: uid(), p1Name: p1, p2Name: p2, firstServe,
    carrera, modalidad, games: [], currentServe: firstServe,
    wins: {p1:0, p2:0}, seriesFinished: false, seriesWinner: null,
    seriesHistory: [], seriesWins: {p1:0, p2:0}, ...extraData, seriesCount: 1,
    matchClosed: false, closedAt: null, createdAt: Date.now(),
  };
}

function formatDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const dias = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return dias[d.getDay()] + " " + d.getDate() + " " + meses[d.getMonth()] + " " + d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
}

function Acceso({ ok }) {
  const [c, setC] = useState("");
  const [err, setErr] = useState(false);
  const [loading, setLoading] = useState(false);

  const go = async () => {
    if (!c.trim()) return;
    setLoading(true);
    try {
      const snap = await db.collection("config").doc("acceso").get();
      if (snap.exists && snap.data().codigo === c.trim()) {
        localStorage.setItem("bg","1"); ok();
      } else { setErr(true); setTimeout(()=>setErr(false),2000); }
    } catch(e) { setErr(true); setTimeout(()=>setErr(false),2000); }
    setLoading(false);
  };

  return (
    <div style={{minHeight:"100vh",background:"radial-gradient(ellipse at 50% 35%,#1a4a1a,#0a1f0a)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{fontSize:11,color:"#c9a227",letterSpacing:4,textTransform:"uppercase"}}>Billares</div>
      <div style={{fontSize:34,fontWeight:900,color:"#fff",letterSpacing:2,lineHeight:1,marginBottom:6}}>García</div>
      <div style={{fontSize:10,color:"#3a6a3a",letterSpacing:2,marginBottom:36}}>Control de partidas</div>
      <div style={{width:"100%",maxWidth:300}}>
        <input type="password" value={c} onChange={e=>setC(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&!loading&&go()} placeholder="Código de acceso" autoFocus
          style={{width:"100%",padding:"13px 16px",borderRadius:12,background:err?"rgba(255,80,80,0.1)":"rgba(255,255,255,0.07)",border:err?"1px solid rgba(255,80,80,0.5)":"1px solid rgba(255,255,255,0.15)",color:"#fff",fontFamily:"inherit",fontSize:16,outline:"none",textAlign:"center",letterSpacing:4,boxSizing:"border-box"}}/>
        {err && <div style={{color:"#f87171",fontSize:12,textAlign:"center",marginTop:6}}>Código incorrecto</div>}
        <button onClick={go} disabled={loading}
          style={{marginTop:12,width:"100%",padding:"13px 0",borderRadius:12,background:"linear-gradient(135deg,#166534,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontSize:15,fontWeight:800,cursor:"pointer",opacity:loading?0.7:1}}>
          {loading?"Verificando...":"Entrar"}
        </button>
      </div>
    </div>
  );
}

function BillarApp() {
  const [matches, setMatches] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [screen, setScreen] = useState("lobby");
  const [playersList, setPlayersList] = useState(()=>{
    try { return JSON.parse(localStorage.getItem("bg_players")||"[]"); } catch{return [];}
  });
  const saveJornadas = (list) => {
    setJornadas(list);
    try { localStorage.setItem("bg_jornadas", JSON.stringify(list)); } catch{}
  };

  const savePlayersList = (list) => {
    setPlayersList(list);
    try { localStorage.setItem("bg_players", JSON.stringify(list)); } catch{}
  };

  const renamePlayer = (oldName, newName) => {
    if (!newName.trim() || oldName === newName.trim()) return;
    const n = newName.trim();
    // Actualizar lista de jugadores
    savePlayersList(playersList.map(p => p === oldName ? n : p).sort((a,b)=>a.localeCompare(b)));
    // Actualizar TODAS las partidas donde aparece ese nombre
    const updated = matches.map(m => {
      let changed = false;
      let nm = {...m};
      // Partidas normales
      if (nm.p1Name === oldName) { nm.p1Name = n; changed = true; }
      if (nm.p2Name === oldName) { nm.p2Name = n; changed = true; }
      // Historial de series
      if (nm.seriesHistory) {
        nm.seriesHistory = nm.seriesHistory.map(s => ({...s})); // shallow copy ok
      }
      // Contrarreloj
      if (nm.crPlayers) {
        const np = nm.crPlayers.map(p => p === oldName ? n : p);
        if (np.some((p,i) => p !== nm.crPlayers[i])) { nm.crPlayers = np; changed = true; }
      }
      if (nm.crSerieHistory) {
        nm.crSerieHistory = nm.crSerieHistory.map(s => ({...s,
          winnerName: s.winnerName === oldName ? n : s.winnerName
        }));
        changed = true;
      }
      return changed ? nm : m;
    });
    saveMatches(updated);
  };
  const addPlayerToList = (name) => {
    const n = name.trim();
    if (!n || playersList.includes(n)) return;
    savePlayersList([...playersList, n].sort((a,b)=>a.localeCompare(b)));
  };
  const [wP1, setWP1] = useState("");
  const [wP2, setWP2] = useState("");
  const [wServe, setWServe] = useState(null);
  const [wCarrera, setWCarrera] = useState(5);
  const [wModalidad, setWModalidad] = useState("Bola 8");
  const [wPlayers, setWPlayers] = useState(["", ""]);
  const [wOrder, setWOrder] = useState([]);
  const [wRondasCR, setWRondasCR] = useState(3);
  const [wSeriesCR, setWSeriesCR] = useState(1);
  const [wPenaltyTime, setWPenaltyTime] = useState(10);
  const [newPlayerName, setNewPlayerName] = useState("");
  const [editingNameKey, setEditingNameKey] = useState(null); // "matchId:field" e.g. "abc:p1" or "abc:cr:2"
  const [sfModalidades, setSfModalidades] = useState([]);
  const [sfJugadores, setSfJugadores] = useState([]);
  const [sfPeriod, setSfPeriod] = useState("Todo");
  const [sfFechaDesde, setSfFechaDesde] = useState("");
  const [sfFechaHasta, setSfFechaHasta] = useState("");
  const [matchOrder, setMatchOrder] = useState([]);
  const [jornadas, setJornadas] = useState(() => { try { return JSON.parse(localStorage.getItem("bg_jornadas")||"[]"); } catch{return[];} });
  const [jornadaScreen, setJornadaScreen] = useState(null); // null | "list" | jornadaId
  const [showHistory, setShowHistory] = useState(false);
  const [showCloseMatch, setShowCloseMatch] = useState(false);
  const [lobbyTab, setLobbyTab] = useState("active");
  const [ballMenu, setBallMenu] = useState(null); // {k, ji} posición del menú
  const [lobbyBallMenu, setLobbyBallMenu] = useState(null); // {matchId, k, ji}

  useEffect(() => {
    const unsub = db.collection("billar").doc("partidas").onSnapshot(snap => {
      if (snap.exists) { const d = snap.data(); if (d && d.matches) setMatches(d.matches); }
    });
    return () => unsub();
  }, []);

  const moveMatch = (id, dir) => {
    const ids = activeMatches.map(m=>m.id);
    const i = ids.indexOf(id);
    if(dir===-1 && i===0) return;
    if(dir===1 && i===ids.length-1) return;
    const newIds = [...ids];
    [newIds[i], newIds[i+dir]] = [newIds[i+dir], newIds[i]];
    setMatchOrder(newIds);
  };

  const saveMatches = async (nm) => {
    setMatches(nm);
    try { await db.collection("billar").doc("partidas").set({matches: nm}); }
    catch(e) { console.error("Error Firebase:", e); }
  };

  const updateMatch = (id, fn) => {
    setMatches(prev => {
      const nm = prev.map(m => m.id === id ? fn(m) : m);
      db.collection("billar").doc("partidas").set({matches: nm}).catch(e => console.error(e));
      return nm;
    });
  };

  const activeMatch = matches.find(m => m.id === activeId);

  const startNewMatch = () => {
    if (wModalidad === "Contrarreloj") {
      const validPlayers = wPlayers.filter(p => p.trim());
      if (validPlayers.length < 2 || wOrder.length < validPlayers.length) return;
      const m = createMatch(validPlayers[0], validPlayers[1], "p1", wCarrera, wModalidad, {
        crPlayers: validPlayers,
        crOrder: wOrder,
        crTimes: {},
        crRound: 1,
        crTotalRounds: wRondasCR,
        crTotalSeries: wSeriesCR,
        crCurrentSerie: 1,
        crSerieWins: {},
        crSerieHistory: [],
        crPenaltyTime: wPenaltyTime,
        crCurrentIdx: 0,
        crRunning: false,
        crStartTs: null,
        crRoundWins: {},
        crAccumTime: {},
      });
      const pendingJId = sessionStorage.getItem("pendingJornadaId")||null;
      sessionStorage.removeItem("pendingJornadaId");
      const mWithJ = pendingJId ? {...m, jornadaId:pendingJId} : m;
      saveMatches([...matches, mWithJ]);
      if(pendingJId) {
        saveJornadas(jornadas.map(j=>j.id===pendingJId?{...j,matchOrder:[...(j.matchOrder||[]),mWithJ.id]}:j));
        setJornadaScreen(pendingJId);
      } else {
        setActiveId(mWithJ.id); setScreen("lobby"); setLobbyTab("active");
      }
      setWPlayers(["",""]); setWOrder([]); setWCarrera(5); setWModalidad("Bola 8"); setWRondasCR(3); setWSeriesCR(1); setWPenaltyTime(10);
    } else {
      if (!wP1.trim() || !wP2.trim() || !wServe) return;
      const pendingJId2 = sessionStorage.getItem("pendingJornadaId")||null;
      sessionStorage.removeItem("pendingJornadaId");
      const m = createMatch(wP1.trim(), wP2.trim(), wServe, wCarrera, wModalidad);
      const mWithJ2 = pendingJId2 ? {...m, jornadaId:pendingJId2} : m;
      saveMatches([...matches, mWithJ2]);
      if(pendingJId2) {
        saveJornadas(jornadas.map(j=>j.id===pendingJId2?{...j,matchOrder:[...(j.matchOrder||[]),mWithJ2.id]}:j));
        setJornadaScreen(pendingJId2);
      } else {
        setActiveId(mWithJ2.id); setScreen("lobby"); setLobbyTab("active");
      }
      setWP1(""); setWP2(""); setWServe(null); setWCarrera(5); setWModalidad("Bola 8");
    }
  };

  const startNewSeries = () => {
    updateMatch(activeId, m => {
      const sw = m.seriesWinner;
      return {
        ...m,
        seriesHistory: [...m.seriesHistory, {winner:sw, p1wins:m.wins.p1, p2wins:m.wins.p2, seriesNum:m.seriesCount, games:[...m.games]}],
        seriesWins: {...m.seriesWins, [sw]: m.seriesWins[sw]+1},
        seriesCount: m.seriesCount+1,
        games: [], wins: {p1:0, p2:0},
        seriesFinished: false, seriesWinner: null,
      };
    });
  };

  const closeMatch = () => {
    setShowCloseMatch(false);
    updateMatch(activeId, m => {
      const finalSeriesWins = m.seriesFinished
        ? {...m.seriesWins, [m.seriesWinner]: m.seriesWins[m.seriesWinner]+1}
        : m.seriesWins;
      return {...m, matchClosed:true, closedAt:Date.now(), seriesWins:finalSeriesWins};
    });
    setScreen("lobby");
  };

  const deleteMatch = async (id) => {
    const nm = matches.filter(m => m.id !== id);
    await saveMatches(nm);
    if (activeId === id) { setActiveId(null); setScreen("lobby"); }
  };

  const replayMatch = (m) => {
    setWModalidad(m.modalidad);
    setWCarrera(m.carrera);
    if (m.modalidad === "Contrarreloj") {
      setWPlayers(m.crPlayers && m.crPlayers.length ? [...m.crPlayers] : ["",""]);
      setWOrder([]);
      setWRondasCR(m.crTotalRounds || 3);
    } else {
      setWP1(m.p1Name); setWP2(m.p2Name);
      setWServe(null);
    }
    setScreen("newMatch");
  };

  const activeMatchesRaw = matches.filter(m => !m.matchClosed && !m.jornadaId);
  const activeMatches = matchOrder.length
    ? [...activeMatchesRaw].sort((a,b) => {
        const ai = matchOrder.indexOf(a.id);
        const bi = matchOrder.indexOf(b.id);
        if(ai===-1&&bi===-1) return (b.createdAt||0)-(a.createdAt||0);
        if(ai===-1) return 1;
        if(bi===-1) return -1;
        return ai-bi;
      })
    : activeMatchesRaw.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const closedMatches = matches.filter(m => m.matchClosed).sort((a,b) => (b.closedAt||b.createdAt||0)-(a.closedAt||a.createdAt||0));

  const chip = (sel) => ({
    padding:"8px 14px", borderRadius:20, fontFamily:"inherit", fontSize:13, fontWeight:600,
    cursor:"pointer", background:sel?"linear-gradient(135deg,#166534,#4ade80)":"rgba(255,255,255,0.05)",
    border:sel?"none":"1px solid rgba(255,255,255,0.1)", color:sel?"#fff":"#999",
    boxShadow:sel?"0 3px 10px rgba(74,222,128,0.28)":"none"
  });

  // ===== LOBBY =====
  // ===== JORNADAS =====
  if (jornadaScreen) {
    const jornadaMatches = matches.filter(m => m.jornadaId === jornadaScreen && jornadaScreen !== "list");
    const currentJ = jornadas.find(j => j.id === jornadaScreen);

    // ── Lista de jornadas ──
    if (jornadaScreen === "list") {
      return (
        <div className="app-screen" style={{background:"radial-gradient(ellipse at 50% 35%,#1a4a1a 0%,#0a1f0a 55%,#060f06 100%)"}}>
          <div className="app-scroll" style={{padding:"20px 14px"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
              <div style={{fontSize:22,fontWeight:800,color:"#f9e04b"}}>🗓 Jornadas</div>
              <button onClick={()=>setJornadaScreen(null)} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.13)",color:"#ccc",borderRadius:10,padding:"7px 13px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>← Volver</button>
            </div>
            {/* Crear nueva jornada */}
            <button onClick={()=>{
              const newJ = {id:"j_"+Date.now(), name:"Jornada "+(jornadas.length+1), currentTurn:0, turnStarted:false, turnScored:false, matchOrder:[], finished:false};
              saveJornadas([...jornadas, newJ]);
              setJornadaScreen(newJ.id);
            }} style={{width:"100%",padding:"14px 0",borderRadius:12,border:"none",fontFamily:"inherit",fontSize:15,fontWeight:800,marginBottom:16,background:"linear-gradient(135deg,#166534,#4ade80)",color:"#fff",cursor:"pointer"}}>
              + Nueva jornada
            </button>
            {/* Lista de jornadas existentes */}
            {jornadas.length===0
              ? <div style={{color:"#444",textAlign:"center",padding:"40px 0",fontSize:13}}>No hay jornadas creadas</div>
              : jornadas.slice().reverse().map(j => {
                  const jms = matches.filter(m=>m.jornadaId===j.id);
                  const done = jms.filter(m=>m.matchClosed).length;
                  return (
                    <div key={j.id} style={{padding:"12px 14px",borderRadius:12,background:"rgba(255,255,255,0.04)",border:`1px solid ${j.finished?"rgba(255,255,255,0.06)":"rgba(249,224,75,0.2)"}`,marginBottom:8}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                        <div onClick={()=>setJornadaScreen(j.id)} style={{flex:1,cursor:"pointer"}}>
                          <span style={{fontSize:15,fontWeight:700,color:j.finished?"#555":"#f9e04b"}}>{j.name}</span>
                          <span style={{fontSize:11,color:"#888",marginLeft:8}}>{done}/{jms.length} partidas</span>
                        </div>
                        <div style={{display:"flex",gap:6}}>
                          <button onClick={()=>{
                            const newName = prompt("Nuevo nombre:", j.name);
                            if(newName?.trim()) saveJornadas(jornadas.map(x=>x.id===j.id?{...x,name:newName.trim()}:x));
                          }} style={{fontSize:11,padding:"4px 8px",borderRadius:6,background:"rgba(74,222,128,0.08)",border:"1px solid rgba(74,222,128,0.2)",color:"#4ade80",fontFamily:"inherit",cursor:"pointer"}}>✏️</button>
                          <button onClick={()=>{
                            if(window.confirm(`¿Eliminar "${j.name}"? También se eliminarán sus partidas.`)){
                              saveMatches(matches.filter(m=>m.jornadaId!==j.id));
                              saveJornadas(jornadas.filter(x=>x.id!==j.id));
                            }
                          }} style={{fontSize:11,padding:"4px 8px",borderRadius:6,background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.2)",color:"#f87171",fontFamily:"inherit",cursor:"pointer"}}>🗑</button>
                        </div>
                      </div>
                      <div onClick={()=>setJornadaScreen(j.id)} style={{fontSize:11,color:"#666",cursor:"pointer"}}>{j.finished?"✅ Finalizada":"🟡 En curso"} · Toca para abrir</div>
                    </div>
                  );
                })
            }
          </div>
        </div>
      );
    }

    // ── Pantalla de jornada específica ──
    if (!currentJ) { setJornadaScreen("list"); return null; }

    const jMatchIds = currentJ.matchOrder || [];
    const currentTurnIdx = currentJ.currentTurn ?? 0;
    const currentMatchId = jMatchIds[currentTurnIdx % Math.max(jMatchIds.length,1)];
    const turnStarted = currentJ.turnStarted ?? false;
    const canNext = currentJ.turnScored === true;
    const allJDone = jMatchIds.length>0 && jMatchIds.every(id=>matches.find(m=>m.id===id)?.matchClosed);

    const goNextTurn = () => {
      let next = (currentTurnIdx+1) % jMatchIds.length;
      let tries = 0;
      while(tries<jMatchIds.length){
        const nm = matches.find(m=>m.id===jMatchIds[next]);
        if(nm && !nm.matchClosed && !nm.jornadaPaused) break;
        next=(next+1)%jMatchIds.length; tries++;
      }
      saveJornadas(jornadas.map(j=>j.id===currentJ.id?{...j,currentTurn:next,turnStarted:true,turnScored:false}:j));
    };

    return (
      <div className="app-screen" style={{background:"radial-gradient(ellipse at 50% 35%,#1a4a1a 0%,#0a1f0a 55%,#060f06 100%)"}}>
        <div className="app-scroll" style={{padding:"14px 12px"}}>
          {/* Header */}
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
            <button onClick={()=>setJornadaScreen("list")} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.13)",color:"#ccc",borderRadius:10,padding:"7px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>←</button>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{fontSize:16,fontWeight:800,color:"#f9e04b"}}>{currentJ.name}</div>
                <button onClick={()=>{const n=prompt("Nuevo nombre:",currentJ.name);if(n?.trim())saveJornadas(jornadas.map(j=>j.id===currentJ.id?{...j,name:n.trim()}:j));}}
                  style={{fontSize:11,padding:"3px 6px",borderRadius:5,background:"rgba(74,222,128,0.08)",border:"1px solid rgba(74,222,128,0.2)",color:"#4ade80",fontFamily:"inherit",cursor:"pointer"}}>✏️</button>
              </div>
              <div style={{fontSize:11,color:"#888"}}>{jMatchIds.filter(id=>matches.find(m=>m.id===id)?.matchClosed).length}/{jMatchIds.length} terminadas</div>
            </div>
            {/* Botón Nueva partida */}
            <button onClick={()=>{
              setActiveId(null);
              // Guardar jornadaId pendiente para la nueva partida
              sessionStorage.setItem("pendingJornadaId", currentJ.id);
              setJornadaScreen(null);
              setScreen("newMatch");
            }} style={{padding:"7px 12px",borderRadius:10,background:"linear-gradient(135deg,#166534,#4ade80)",border:"none",color:"#fff",fontFamily:"inherit",fontSize:12,fontWeight:800,cursor:"pointer"}}>+ Partida</button>
            {allJDone && (
              <button onClick={()=>{
                if(window.confirm("¿Finalizar jornada? Las partidas pasarán a Terminadas.")) {
                  // Mover partidas de jornada a terminadas globales
                  const updated = matches.map(m => m.jornadaId===currentJ.id ? {...m,jornadaId:null} : m);
                  saveMatches(updated);
                  saveJornadas(jornadas.map(j=>j.id===currentJ.id?{...j,finished:true}:j));
                  setJornadaScreen("list");
                }
              }} style={{padding:"7px 12px",borderRadius:10,background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.3)",color:"#f87171",fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer"}}>🏁 Fin</button>
            )}
          </div>

          {/* Barra de turno */}
          {jMatchIds.length>0 && !allJDone && (
            <div style={{background:"rgba(249,224,75,0.06)",border:"1px solid rgba(249,224,75,0.2)",borderRadius:10,padding:"10px 12px",marginBottom:10,display:"flex",alignItems:"center",gap:10}}>
              <div style={{flex:1,fontSize:12,color:"#f9e04b",fontWeight:700}}>
                {!turnStarted?"⚡ Turno listo":canNext?"✅ Resultado anotado":"🎱 Turno en juego"}
              </div>
              {!turnStarted ? (
                <button onClick={()=>saveJornadas(jornadas.map(j=>j.id===currentJ.id?{...j,turnStarted:true,turnScored:false}:j))}
                  style={{padding:"8px 16px",borderRadius:8,border:"none",fontFamily:"inherit",fontSize:13,fontWeight:800,cursor:"pointer",background:"linear-gradient(135deg,#166534,#4ade80)",color:"#fff"}}>
                  🎱 Iniciar turno
                </button>
              ) : (
                <button onClick={()=>{if(canNext)goNextTurn();}}
                  style={{padding:"8px 16px",borderRadius:8,border:"none",fontFamily:"inherit",fontSize:12,fontWeight:800,
                    cursor:canNext?"pointer":"not-allowed",
                    background:canNext?"linear-gradient(135deg,#1e3a8a,#3b82f6)":"rgba(255,255,255,0.06)",
                    color:canNext?"#fff":"#555"}}>
                  {canNext?"→ Siguiente":"Anota primero"}
                </button>
              )}

            </div>
          )}

          {/* Tarjetas de partidas de la jornada */}
          {jMatchIds.length===0
            ? <div style={{color:"#444",textAlign:"center",padding:"40px 0",fontSize:13}}>Crea partidas con el botón "+ Partida"</div>
            : jMatchIds.map((mid, idx) => {
                const mm = matches.find(m=>m.id===mid);
                if(!mm) return null;
                const isPausedM = mm.jornadaPaused===true;
                const isTurn = mid===currentMatchId && turnStarted && !mm.matchClosed && !isPausedM;
                const borderColor = mm.matchClosed?"rgba(255,255,255,0.06)":isTurn?"rgba(74,222,128,0.5)":"rgba(255,255,255,0.1)";
                const bgColor = mm.matchClosed?"rgba(255,255,255,0.02)":isTurn?"rgba(74,222,128,0.05)":"rgba(255,255,255,0.03)";
                return (
                  <div key={mid} style={{border:`2px solid ${borderColor}`,borderRadius:14,marginBottom:10,background:bgColor,opacity:mm.matchClosed?0.6:1}}>
                    <LobbyCard
                      m={mm}
                      onOpen={id=>{setActiveId(id);}}
                      onDelete={id=>saveMatches(matches.filter(m=>m.id!==id))}
                      onReplay={()=>{}}
                      onUpdateMatch={(id,fn)=>updateMatch(id,fn)}
